<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUFOR Admin | Maintenance Master</title>

    <script src="../security.js"></script>

    <style>
        :root {
            --bg:       #0f172a;
            --card:     rgba(30, 41, 59, 0.9);
            --primary:  #3b82f6;
            --success:  #10b981;
            --danger:   #ef4444;
            --warning:  #f59e0b;
            --text:     #f8fafc;
            --text-dim: #94a3b8;
            --border:   rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 15px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .icon-db {
            width: 60px; height: 60px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--primary);
        }

        h1 { margin: 0; font-size: 20px; font-weight: 800; }

        .badge {
            color: var(--primary);
            font-family: monospace;
            font-size: 12px;
            background: rgba(59, 130, 246, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        #offline-banner {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 15px;
        }

        .status-panel {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            padding: 15px;
            margin: 25px 0;
            text-align: left;
            font-size: 13px;
            border: 1px solid var(--border);
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-line:last-child { margin-bottom: 0; }

        .input-group { margin-bottom: 25px; }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input[type="password"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 24px;
            text-align: center;
            letter-spacing: 5px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus { border-color: var(--primary); }

        button#btn-action {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button#btn-action:disabled {
            background: #475569;
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        #log-msg {
            margin-top: 15px;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-dim);
            min-height: 18px;
        }

        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 0.75rem;
        }
        .footer-link:hover { color: var(--text-dim); }

        @media (max-width: 380px) {
            .card { padding: 25px 15px; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-db">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
        </div>

        <h1>Maintenance Diandioly</h1>
        <div style="margin: 12px 0;"><span class="badge">asufor_db_diandioly</span></div>

        <div id="offline-banner">⚠️ Connexion Internet perdue</div>

        <div class="status-panel">
            <div class="status-line">
                <span>Cycle actuel :</span>
                <span id="cycle-display" style="color:var(--primary)">--/----</span>
            </div>
            <div class="status-line">
                <span>Entrées à traiter :</span>
                <span id="count-display" style="color:var(--text-dim)">--</span>
            </div>
            <div class="status-line">
                <span>État :</span>
                <span id="state-display">Vérification...</span>
            </div>
        </div>

        <div class="input-group">
            <label>Passcode Dynamique (AnnéeMois)</label>
            <input type="password" id="passcode" maxlength="6" placeholder="AAAAMM" inputmode="numeric">
        </div>

        <button id="btn-action" onclick="runMaintenance()" disabled>Chargement...</button>
        <div id="log-msg">Initialisation du système...</div>
        <a href="../home/accueil.html" class="footer-link">← Retourner à l'accueil</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ✅ Vérification d'accès – Président uniquement
        if (typeof window.checkAccess === 'function') {
            const s = window.checkAccess(['président']);
            if (!s) throw new Error('Accès refusé');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAKC7lrKSCFwfuoXASvX-yYIGneLXInvDk",
            authDomain: "asufor-67a06.firebaseapp.com",
            databaseURL: "https://asufor-67a06-default-rtdb.firebaseio.com",
            projectId: "asufor-67a06"
        };

        const app  = initializeApp(firebaseConfig);
        const db   = getDatabase(app);
        const auth = getAuth(app);

        const now  = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const cycleKey        = `${year}-${month}`;
        const expectedPasscode = `${year}${month}`;

        const btn          = document.getElementById('btn-action');
        const log          = document.getElementById('log-msg');
        const stateDisp    = document.getElementById('state-display');
        const countDisp    = document.getElementById('count-display');
        const offlineBanner = document.getElementById('offline-banner');

        document.getElementById('cycle-display').textContent = cycleKey;

        const spinnerIcon = `<svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>`;

        window.addEventListener('offline', () => {
            offlineBanner.style.display = 'block';
            btn.disabled = true;
            btn.textContent = "Action bloquée (Hors ligne)";
        });

        window.addEventListener('online', () => {
            offlineBanner.style.display = 'none';
            checkStatus();
        });

        async function checkStatus() {
            if (!navigator.onLine) {
                log.textContent = "En attente de connexion réseau.";
                return;
            }
            try {
                const backupRef = ref(db, `asufor_backup/${cycleKey}`);
                const snap      = await get(backupRef);

                if (snap.exists()) {
                    stateDisp.textContent = "DÉJÀ EFFECTUÉ";
                    stateDisp.style.color = "var(--danger)";
                    btn.textContent = "Action verrouillée";
                    btn.disabled = true;
                    log.textContent = "Le backup du cycle en cours existe déjà.";
                } else {
                    // Compter les entrées
                    const srcSnap = await get(ref(db, 'asufor_db_diandioly'));
                    const count = srcSnap.exists() ? Object.keys(srcSnap.val()).length : 0;
                    countDisp.textContent = count + ' entrée(s)';

                    stateDisp.textContent = "PRÊT / DISPONIBLE";
                    stateDisp.style.color = "var(--success)";
                    btn.textContent = "Lancer Maintenance";
                    btn.disabled = false;
                    log.textContent = "Saisissez le passcode du mois (" + cycleKey.replace('-', '') + ").";
                }
            } catch (e) {
                log.textContent = "Erreur de connexion Firebase : " + e.message;
            }
        }

        // Lancer une fois que Firebase Auth est prêt
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (navigator.onLine) checkStatus();
                else window.dispatchEvent(new Event('offline'));
            } else {
                log.textContent = "Session Firebase expirée. Veuillez vous reconnecter.";
                btn.disabled = true;
            }
        });

        window.runMaintenance = async function () {
            if (!navigator.onLine) {
                alert("Vous êtes hors ligne. Action impossible.");
                return;
            }

            const inputPass = document.getElementById('passcode').value;
            if (inputPass !== expectedPasscode) {
                alert("Passcode incorrect !");
                return;
            }

            if (!confirm(`⚠️ ATTENTION\n\nVoulez-vous clôturer le cycle ${cycleKey} et réinitialiser la base Diandioly ?\n\nCette opération est irréversible.`)) return;

            btn.disabled = true;
            btn.innerHTML = `${spinnerIcon} Traitement en cours...`;
            log.textContent = "Ne fermez pas la page, communication avec Firebase...";

            try {
                const sourceSnap = await get(ref(db, 'asufor_db_diandioly'));

                if (!sourceSnap.exists()) {
                    throw new Error("La base de données est vide. Rien à archiver.");
                }

                const data    = sourceSnap.val();
                const keys    = Object.keys(data);
                const updates = {};

                // --- Sauvegarde complète du cycle ---
                updates[`asufor_backup/${cycleKey}`] = {
                    info: {
                        date_sauvegarde: now.toLocaleString('fr-FR'),
                        total_entrees:   keys.length,
                        cycle:           cycleKey
                    },
                    donnees: data
                };

                // ✅ CORRECTION FINALE : Calcul rigoureux de apaid (dette réelle du cycle)
                keys.forEach(key => {
                    const val = data[key];
                    const nIdx    = parseFloat(val.new_index   || 0);
                    const lIdx    = parseFloat(val.last_index  || 0);
                    const facteur = parseFloat(val.facteur     || 250);
                    const conso   = Math.max(0, nIdx - lIdx);
                    const montantMois = conso * facteur;

                    // ── Calcul de la dette à reporter (apaid) ──────────────────────────
                    // Si le compteur a été payé ce mois-ci → aucune dette à reporter
                    // Sinon → dette = montant du mois clôturé + arriérés déjà existants
                    const estPaye = String(val.status || "").trim().toLowerCase() === "paye"
                                 || String(val.statut || "").trim().toLowerCase() === "true";

                    const arrieresCourants = parseFloat(val.arrieres || val._impaye_anterieur || 0);
                    const nouvelApaid = estPaye ? 0 : (montantMois + arrieresCourants);
                    // ──────────────────────────────────────────────────────────────────

                    updates[`asufor_db_diandioly/${key}/last_index`]       = String(nIdx);
                    updates[`asufor_db_diandioly/${key}/new_index`]        = nIdx;
                    updates[`asufor_db_diandioly/${key}/status`]           = "impaye";
                    updates[`asufor_db_diandioly/${key}/statut`]           = "false";
                    updates[`asufor_db_diandioly/${key}/apaid`]            = nouvelApaid;  // ✅ Dette réelle calculée
                    updates[`asufor_db_diandioly/${key}/arrieres`]         = 0;            // ✅ Remis à zéro (porté dans apaid)
                    updates[`asufor_db_diandioly/${key}/facture`]          = "false";
                    updates[`asufor_db_diandioly/${key}/print`]            = "false";
                    updates[`asufor_db_diandioly/${key}/last_modified_by`] = null;
                    updates[`asufor_db_diandioly/${key}/last_modified_at`] = null;
                    updates[`asufor_db_diandioly/${key}/date_paiement`]    = null;  // ✅ Réinitialisé pour le nouveau cycle
                });

                await update(ref(db), updates);

                log.textContent = `✅ MAINTENANCE RÉUSSIE — ${keys.length} entrée(s) archivée(s)`;
                log.style.color = "var(--success)";
                btn.textContent = `✓ Cycle ${cycleKey} Clôturé`;
                btn.style.background = "var(--success)";
                stateDisp.textContent = "ARCHIVÉ";
                stateDisp.style.color = "var(--success)";

            } catch (e) {
                console.error('Erreur maintenance :', e);
                log.textContent = "Erreur : " + e.message;
                log.style.color = "var(--danger)";
                btn.textContent = "Réessayer";
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
