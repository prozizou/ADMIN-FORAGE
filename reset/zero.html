<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#f8fafc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Satigué Eau">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">

    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satigué Eau Admin | Maintenance Master</title>

    <script src="../security.js"></script>
    <!-- ✅ Overlay de chargement partagé -->
    <script src="../loader.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="../firebase-config.js"></script>
    <!-- ✅ Multi-forage : résolution des chemins (mode legacy = chemins actuels) -->
    <script src="../admin-config.js"></script>
    <script src="../forage-context.js"></script>
    <!-- ✅ Sécurité : hachage SHA-256 des passcodes maintenance -->
    <script src="../crypto.js"></script>

    <style>
        :root {
            --bg:       #f0f2f5;
            --card:     #ffffff;
            --primary:  #3b82f6;
            --success:  #10b981;
            --danger:   #dc2626;
            --warning:  #d97706;
            --text:     #1e293b;
            --text-dim: #64748b;
            --border:   rgba(15, 23, 42, 0.1);
        }

        body {
            margin: 0;
            padding: 15px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.12);
            text-align: center;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        .icon-db {
            width: 64px; height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            flex-shrink: 0;
        }
        .icon-db img { width: 100%; height: 100%; }

        h1 { margin: 0; font-size: 20px; font-weight: 800; }

        .badge {
            color: var(--primary);
            font-family: monospace;
            font-size: 12px;
            background: rgba(59, 130, 246, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        #offline-banner {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 15px;
        }

        .status-panel {
            background: rgba(15, 23, 42, 0.04);
            border-radius: 16px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            font-size: 13px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-line:last-child { margin-bottom: 0; }

        button#btn-verify {
            width: 100%;
            padding: 12px;
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: none;
            transition: all 0.2s;
        }
        button#btn-verify:hover { background: rgba(245, 158, 11, 0.3); }

        .unpaid-container {
            display: none;
            text-align: left;
            background: rgba(15, 23, 42, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
        }

        .unpaid-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            border-left: 3px solid var(--warning);
        }
        .unpaid-item:last-child { margin-bottom: 0; }
        
        .unpaid-header { font-weight: bold; margin-bottom: 8px; color: var(--text); }
        .unpaid-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        
        .unpaid-item input, .unpaid-item select {
            width: 100%;
            background: rgba(15, 23, 42, 0.04);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 6px;
            border-radius: 6px;
            font-size: 12px;
            box-sizing: border-box;
        }
        
        .btn-save-item {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-save-item:hover { opacity: 0.9; }

        .input-group { margin-bottom: 20px; flex-shrink: 0; }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input[type="password"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.04);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            color: var(--text);
            font-size: 24px;
            text-align: center;
            letter-spacing: 5px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus { border-color: var(--primary); }

        button#btn-action {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
        }

        button#btn-action:disabled {
            background: #94a3b8;
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        #log-msg {
            margin-top: 15px;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-dim);
            min-height: 18px;
            flex-shrink: 0;
        }

        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: rgba(30, 41, 59, 0.4);
            text-decoration: none;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .footer-link:hover { color: var(--text-dim); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15,23,42,0.05); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(15,23,42,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(15,23,42,0.35); }

        @media (max-width: 380px) {
            .card { padding: 25px 15px; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-db">
            <img src="../icons/logo.png" alt="Satigué Eau">
        </div>

        <h1 id="page-h1">Maintenance</h1>
        <div style="margin: 8px 0;"><span class="badge" id="path-badge">…</span></div>

        <div id="offline-banner">⚠️ Connexion Internet perdue</div>

        <div class="status-panel">
            <div class="status-line">
                <span>Cycle actuel :</span>
                <span id="cycle-display" style="color:var(--primary)">--/----</span>
            </div>
            <div class="status-line">
                <span>Entrées à traiter :</span>
                <span id="count-display" style="color:var(--text-dim)">--</span>
            </div>
            <div class="status-line">
                <span>État :</span>
                <span id="state-display">Vérification...</span>
            </div>
        </div>

        <button id="btn-verify" onclick="toggleUnpaidList()">🔍 Vérifier & Éditer les Impayés avant Clôture</button>
        <div id="unpaid-container" class="unpaid-container">
            <div id="unpaid-content">Chargement des données...</div>
        </div>

        <div class="input-group">
            <label id="passcode-label">Passcode de maintenance</label>
            <input type="password" id="passcode" maxlength="8" placeholder="••••••••" inputmode="text" autocomplete="off">
            <button id="btn-generate-pass" onclick="generateMaintenancePasscode()" style="margin-top:8px;width:100%;padding:10px;background:var(--warning);color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">🔑 Générer un nouveau passcode</button>
        </div>

        <button id="btn-action" onclick="runMaintenance()" disabled>Chargement...</button>
        <div id="log-msg">Initialisation du système...</div>
        <a href="../home/accueil.html" class="footer-link">← Retourner à l'accueil</a>
    </div>
       <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ✅ Vérification d'accès
        if (typeof window.checkAccess === 'function') {
            const s = window.checkAccess(['président']);
            if (!s) throw new Error('Accès refusé');
        }

        const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;

        const app  = initializeApp(firebaseConfig);
        const db   = getDatabase(app);
        const auth = getAuth(app);
        // ✅ Chemins Firebase du forage courant, résolus dynamiquement (namespacé Asufor/{forageKey}/…)
        const P = window.ForageContext.paths();

        // ✅ FIX XSS : échappement de toute valeur dynamique injectée dans innerHTML.
        const esc = window.escHtml || ((s) => String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;'));

        // ✅ Branding dynamique par forage : le nœud technique lu/écrit et le nom du
        // village affichés à l'écran doivent refléter le VRAI forage de l'utilisateur
        // connecté, jamais "Diandioly" en dur (bug constaté quand plusieurs villages
        // partagent la même app).
        let villageName = 'ce forage';
        document.getElementById('path-badge').textContent = P.compteurs;
        get(ref(db, P.config)).then((snap) => {
            const cfg = snap.exists() ? snap.val() : {};
            villageName = cfg.siege || cfg.nom || P.forageKey;
            document.getElementById('page-h1').textContent = 'Maintenance ' + villageName;
        }).catch(() => {
            document.getElementById('page-h1').textContent = 'Maintenance';
        });

        // ✅ FIX LOGIQUE : un compteur d'eau est MONOTONE — son index ne régresse jamais.
        // Renvoie l'index réel à conserver : le nouveau relevé s'il est valide et >= ancien,
        // sinon (non relevé, 0, ou aberrant) on CONSERVE l'ancien index. Jamais de retour à 0.
        function indexConserve(val) {
            const lRaw = parseFloat(val.last_index);
            const lIdx = Number.isFinite(lRaw) ? lRaw : 0;
            const nRaw = parseFloat(val.new_index);
            const nIdx = (Number.isFinite(nRaw) && nRaw >= lIdx) ? nRaw : lIdx;
            return { lIdx, nIdx };
        }

        // ✅ CORRECTION v4 : Passcode de maintenance sécurisé.
        //    Au lieu du format prévisible AAAAMM, un passcode aléatoire de 8 caractères
        //    est généré et stocké (hashé) dans Firebase sous Asufor/{key}/config/maintenance_passcode_hash.
        //    Le passcode est valide pour toute la durée du cycle courant.
        //    Le label affiche "Passcode stocké en base (contactez le super-admin)" si aucun passcode n'est trouvé.
        const now  = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const cycleKey = `${year}-${month}`;
        let expectedPasscode = '';          // sera résolu depuis Firebase
        let maintenancePasscodeSet = false; // true si un passcode hash est déjà stocké

        // Charger le hash du passcode depuis Firebase
        async function loadMaintenancePasscode() {
            try {
                const snap = await get(ref(db, P.config + '/maintenance_passcode_hash'));
                if (snap.exists()) {
                    expectedPasscode = snap.val();
                    maintenancePasscodeSet = true;
                    document.getElementById('passcode-label').textContent = 'Passcode de maintenance (8 caractères)';
                } else {
                    document.getElementById('passcode-label').textContent = 'Aucun passcode configuré — générez-en un ci-dessous';
                }
            } catch (e) {
                console.error('Chargement du passcode échoué :', e);
                document.getElementById('passcode-label').textContent = 'Erreur de chargement du passcode';
            }
        }
        loadMaintenancePasscode();

        // Générer un nouveau passcode et le stocker (hashé) dans Firebase
        window.generateMaintenancePasscode = async function() {
            if (typeof window.ASUFORCrypto === 'undefined') {
                alert('Module cryptographique non chargé. Rechargez la page.');
                return;
            }
            const newPasscode = window.ASUFORCrypto.generateMaintenancePasscode();
            const hash = await window.ASUFORCrypto.hashMaintenancePasscode(newPasscode);
            try {
                await update(ref(db), {
                    [P.config + '/maintenance_passcode_hash']: hash,
                    [P.config + '/maintenance_passcode_cycle']: cycleKey
                });
                expectedPasscode = hash;
                maintenancePasscodeSet = true;
                // Afficher le passcode en clair une seule fois (ne sera plus visible)
                document.getElementById('passcode-label').textContent = 'Nouveau passcode : ' + newPasscode + ' (ne sera plus affiché)';
                document.getElementById('log-msg').textContent = '✅ Passcode généré et stocké. Copiez-le maintenant, il ne sera plus visible.';
                document.getElementById('log-msg').style.color = 'var(--success)';
                setTimeout(() => {
                    document.getElementById('passcode-label').textContent = 'Passcode de maintenance (8 caractères)';
                }, 15000);
            } catch (e) {
                alert('Erreur lors de la génération : ' + e.message);
            }
        };

        // Calcul dynamique du mois précédent (pour lire l'archive correspondante)
        const prevDate = new Date();
        prevDate.setMonth(prevDate.getMonth() - 1);
        const prevYear = prevDate.getFullYear();
        const prevMonth = String(prevDate.getMonth() + 1).padStart(2, '0');
        const prevCycleKey = `${prevYear}-${prevMonth}`;

        const btn          = document.getElementById('btn-action');
        const btnVerify    = document.getElementById('btn-verify');
        const log          = document.getElementById('log-msg');
        const stateDisp    = document.getElementById('state-display');
        const countDisp    = document.getElementById('count-display');
        const offlineBanner = document.getElementById('offline-banner');

        document.getElementById('cycle-display').textContent = cycleKey;

        const spinnerIcon = `<svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>`;

        window.addEventListener('offline', () => {
            offlineBanner.style.display = 'block';
            btn.disabled = true;
            btnVerify.style.display = 'none';
            btn.textContent = "Action bloquée (Hors ligne)";
        });

        window.addEventListener('online', () => {
            offlineBanner.style.display = 'none';
            checkStatus();
        });

        async function checkStatus() {
            if (!navigator.onLine) {
                log.textContent = "En attente de connexion réseau.";
                return;
            }
            try {
                const backupRef = ref(db, `${P.backup}/${cycleKey}`);
                const snap      = await get(backupRef);

                if (snap.exists()) {
                    stateDisp.textContent = "DÉJÀ EFFECTUÉ";
                    stateDisp.style.color = "var(--danger)";
                    btn.textContent = "Action verrouillée";
                    btn.disabled = true;
                    btnVerify.style.display = 'none';
                    log.textContent = "Le backup du cycle en cours existe déjà.";
                } else {
                    const srcSnap = await get(ref(db, P.compteurs));
                    const count = srcSnap.exists() ? Object.keys(srcSnap.val()).length : 0;
                    countDisp.textContent = count + ' entrée(s)';

                    stateDisp.textContent = "PRÊT / DISPONIBLE";
                    stateDisp.style.color = "var(--success)";
                    btn.textContent = "Lancer Maintenance";
                    btn.disabled = false;
                    btnVerify.style.display = 'block'; 
                    btnVerify.textContent = `🔍 Vérifier les impayés du mois précédent (${prevCycleKey})`;
                    // ✅ CORRECTION sécurité : ne pas afficher le passcode attendu à l'écran
                    log.textContent = "Saisissez le passcode dynamique du mois (format AAAAMM).";
                }
            } catch (e) {
                log.textContent = "Erreur de connexion Firebase : " + e.message;
                if (window.AsuforLoader) {
                    AsuforLoader.fail('Erreur de connexion Firebase. Session peut-être expirée.', { retry: checkStatus });
                }
                return;
            } finally {
                if (window.AsuforLoader) AsuforLoader.hide();
            }
        }

        window.toggleUnpaidList = async function() {
            const container = document.getElementById('unpaid-container');
            if (container.style.display === 'none' || container.style.display === '') {
                container.style.display = 'block';
                await loadUnpaidMeters();
            } else {
                container.style.display = 'none';
            }
        };

        window.loadUnpaidMeters = async function() {
            const contentDiv = document.getElementById('unpaid-content');
            contentDiv.innerHTML = `${spinnerIcon} Chargement de l'archive ${prevCycleKey}...`;
            
            try {
                // Lecture depuis l'archive du mois précédent !
                const snap = await get(ref(db, `${P.backup}/${prevCycleKey}/donnees`));
                if (!snap.exists()) {
                    contentDiv.innerHTML = `<div style="padding:10px; text-align:center; color:var(--text-dim)">Aucune archive trouvée pour ${prevCycleKey}.</div>`;
                    return;
                }

                const data = snap.val();
                let html = '';
                let count = 0;

                for (const key in data) {
                    const val = data[key];
                    // Vérification rigoureuse du statut booléen ou texte
                    const estPaye = String(val.status || "").trim().toLowerCase() === "paye" || 
                                    val.statut === true || 
                                    String(val.statut || "").trim().toLowerCase() === "true";

                    if (!estPaye) {
                        count++;
                        // Gestion des deux formats de nom (name ou nom/prenom)
                        const nomAffiche = val.name ? val.name : (val.nom ? `${val.prenom || ''} ${val.nom}`.trim() : key);
                        // ✅ FIX : index conservé (l'ancien index ne tombe pas à 0 si non relevé)
                        const { lIdx: ancienIdx, nIdx: nouvelIdx } = indexConserve(val);
                        // ✅ FIX XSS : échapper nom et clé avant injection HTML
                        const safeNom = esc(nomAffiche);
                        const safeKey = esc(key);

                        html += `
                        <div class="unpaid-item" id="item_${safeKey}">
                            <div class="unpaid-header">👤 ${safeNom} (ID: ${safeKey})</div>
                            <div class="unpaid-details">
                                <div><small style="color:var(--text-dim)">Ancien Index</small><br>${ancienIdx}</div>
                                <div>
                                    <small style="color:var(--text-dim)">Nouvel Index</small><br>
                                    <input type="number" id="idx_${safeKey}" value="${nouvelIdx}" min="${ancienIdx}" data-ancien="${ancienIdx}">
                                </div>
                                <div style="grid-column: span 2;">
                                    <small style="color:var(--text-dim)">Statut du paiement</small><br>
                                    <select id="stat_${safeKey}">
                                        <option value="impaye" selected>🔴 Impayé</option>
                                        <option value="paye">🟢 Payé</option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn-save-item" onclick="saveMeterEdit('${safeKey}')">💾 Corriger l'archive ${esc(prevCycleKey)}</button>
                        </div>`;
                    }
                }

                if (count === 0) {
                    contentDiv.innerHTML = `<div style="color:var(--success); font-weight:bold; text-align:center; padding:10px;">✅ Tous les compteurs de l'archive ${prevCycleKey} sont payés !</div>`;
                } else {
                    contentDiv.innerHTML = `<div style="margin-bottom:12px; font-weight:bold; color:var(--warning)">⚠️ ${count} compteurs impayés dans l'archive ${prevCycleKey}</div>` + html;
                }

            } catch (e) {
                // ✅ CORRECTION v5 : échappement du message d'erreur (peut refléter des données).
                contentDiv.innerHTML = `<div style="color:var(--danger)">Erreur de chargement : ${esc(e.message)}</div>`;
            }
        };

        window.saveMeterEdit = async function(key) {
            const btnSave = document.querySelector(`#item_${key} .btn-save-item`);
            const originalText = btnSave.innerHTML;

            const idxInput = document.getElementById(`idx_${key}`);
            const newStat = document.getElementById(`stat_${key}`).value;

            // ✅ FIX : anti-régression — l'index saisi ne peut pas être inférieur à l'ancien.
            const ancien = parseFloat(idxInput.dataset.ancien) || 0;
            const nVal   = parseFloat(idxInput.value);

            if (!Number.isFinite(nVal)) {
                alert("Index invalide : saisissez un nombre.");
                idxInput.focus();
                return;
            }
            if (nVal < ancien) {
                alert(`Index refusé : ${nVal} est inférieur à l'ancien index (${ancien}).\nUn compteur d'eau ne peut pas régresser.`);
                idxInput.value = ancien;
                idxInput.focus();
                return;
            }

            const newIdx = nVal;
            btnSave.innerHTML = "Sauvegarde...";
            btnSave.disabled = true;

            try {
                const updates = {};
                // 1. Mise à jour dans le backup du mois précédent
                updates[`${P.backup}/${prevCycleKey}/donnees/${key}/new_index`] = Number(newIdx);
                updates[`${P.backup}/${prevCycleKey}/donnees/${key}/status`] = newStat;
                updates[`${P.backup}/${prevCycleKey}/donnees/${key}/statut`] = newStat === 'paye' ? true : false; // Booléen corrigé

                // 2. Synchronisation: On met à jour le last_index de la base active pour éviter un saut d'index ce mois-ci
                updates[`${P.compteurs}/${key}/last_index`] = String(newIdx);

                await update(ref(db), updates);
                
                if(newStat === 'paye') {
                    document.getElementById(`item_${key}`).remove();
                } else {
                    btnSave.innerHTML = "✅ Archivé";
                    btnSave.style.background = "var(--success)";
                    setTimeout(() => {
                        btnSave.innerHTML = originalText;
                        btnSave.style.background = "var(--primary)";
                        btnSave.disabled = false;
                    }, 2000);
                }
            } catch(e) {
                alert("Erreur lors de la mise à jour : " + e.message);
                btnSave.innerHTML = "❌ Erreur";
                btnSave.disabled = false;
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (navigator.onLine) {
                    if (window.AsuforLoader) AsuforLoader.show('Vérification du cycle…');
                    checkStatus();
                } else {
                    if (window.AsuforLoader) AsuforLoader.hide();
                    window.dispatchEvent(new Event('offline'));
                }
            } else {
                // ✅ CORRECTION v4 : nettoyer 'asufor_session' pour éviter la
                // désynchronisation avec l'état Firebase réel.
                try { localStorage.removeItem('asufor_session'); } catch(_) {}
                log.textContent = "Session Firebase expirée. Veuillez vous reconnecter.";
                btn.disabled = true;
                if (window.AsuforLoader) {
                    AsuforLoader.fail('Session expirée ou invalide. Reconnexion nécessaire.');
                }
            }
        });

        // ✅ CORRECTION : compteur de tentatives de passcode pour éviter le brute-force
        let maintenanceAttempts = 0;
        const MAX_MAINTENANCE_ATTEMPTS = 3;

        window.runMaintenance = async function () {
            if (!navigator.onLine) {
                alert("Vous êtes hors ligne. Action impossible.");
                return;
            }

            const inputPass = document.getElementById('passcode').value;
            maintenanceAttempts++;
            if (maintenanceAttempts > MAX_MAINTENANCE_ATTEMPTS) {
                log.textContent = "Trop de tentatives incorrectes. Rechargez la page.";
                log.style.color = "var(--danger)";
                btn.disabled = true;
                return;
            }
            // ✅ CORRECTION v4 : Vérification du passcode via comparaison de hash SHA-256.
            if (typeof window.ASUFORCrypto !== 'undefined' && maintenancePasscodeSet) {
                const isMatch = await window.ASUFORCrypto.verifyMaintenancePasscode(inputPass, expectedPasscode);
                if (!isMatch) {
                    const remaining = MAX_MAINTENANCE_ATTEMPTS - maintenanceAttempts;
                    alert("Passcode incorrect !" + (remaining > 0 ? " (" + remaining + " essai(s) restant(s))" : " Rechargez la page."));
                    document.getElementById('passcode').value = '';
                    if (remaining <= 0) btn.disabled = true;
                    return;
                }
            } else {
                // Fallback : si le module crypto n'est pas chargé, refuser l'action
                const remaining = MAX_MAINTENANCE_ATTEMPTS - maintenanceAttempts;
                alert("Système de vérification non disponible. Rechargez la page." + (remaining > 0 ? " (" + remaining + " essai(s) restant(s))" : ""));
                document.getElementById('passcode').value = '';
                if (remaining <= 0) btn.disabled = true;
                return;
            }
            maintenanceAttempts = 0; // Reset si correct

            if (!confirm(`⚠️ ATTENTION\n\nVoulez-vous clôturer le cycle ${cycleKey} et réinitialiser la base ${villageName} ?\n\nCette opération est irréversible.`)) return;
            // ✅ CORRECTION : Effacer le passcode dès que validé
            document.getElementById('passcode').value = '';

            document.getElementById('unpaid-container').style.display = 'none';
            btnVerify.style.display = 'none';

            btn.disabled = true;
            btn.innerHTML = `${spinnerIcon} Traitement en cours...`;
            log.textContent = "Ne fermez pas la page, communication avec Firebase...";

            try {
                // ✅ CORRECTION v5 : VERROU ANTI-DOUBLE-CLÔTURE.
                //    Si le cycle a déjà été archivé (double clic, second onglet,
                //    deuxième président), on REFUSE d'écraser le backup existant
                //    et de réinitialiser les compteurs une 2ème fois (perte de données).
                const existingBackup = await get(ref(db, `${P.backup}/${cycleKey}/info`));
                if (existingBackup.exists()) {
                    throw new Error(`Le cycle ${cycleKey} a DÉJÀ été archivé le ${existingBackup.val().date_sauvegarde || '(date inconnue)'}. Clôture annulée pour protéger l'archive existante.`);
                }

                const sourceSnap = await get(ref(db, P.compteurs));

                if (!sourceSnap.exists()) {
                    throw new Error("La base de données est vide. Rien à archiver.");
                }

                const data    = sourceSnap.val();
                const keys    = Object.keys(data);
                const updates = {};

                updates[`${P.backup}/${cycleKey}`] = {
                    info: {
                        date_sauvegarde: now.toLocaleString('fr-FR'),
                        total_entrees:   keys.length,
                        cycle:           cycleKey
                    },
                    donnees: data
                };

                keys.forEach(key => {
                    const val = data[key];

                    // ✅ FIX : index conservé (jamais de régression à 0 si non relevé)
                    const { lIdx, nIdx } = indexConserve(val);

                    // ✅ FIX : ne pas écraser un facteur légitime à 0 via ||
                    const fRaw    = parseFloat(val.facteur);
                    const facteur = Number.isFinite(fRaw) ? fRaw : 250;

                    const conso       = Math.max(0, nIdx - lIdx);
                    const montantMois = conso * facteur;

                    const estPaye = String(val.status || "").trim().toLowerCase() === "paye"
                                 || val.statut === true 
                                 || String(val.statut || "").trim().toLowerCase() === "true";

                    // ✅ FIX : arriérés à 0 légitimes préservés (?? au lieu de ||)
                    const aRaw = parseFloat(val.arrieres ?? val._impaye_anterieur);
                    const arrieresCourants = Number.isFinite(aRaw) ? aRaw : 0;
                    const nouvelApaid = estPaye ? 0 : (montantMois + arrieresCourants);

                    // ✅ FIX : le NOUVEL index DEVIENT l'ANCIEN index (déplacement, pas duplication).
                    // last_index = relevé final conservé ; new_index est REMIS À 0 (le nombre)
                    // pour accueillir la relève du mois prochain.
                    //  • Conforme aux règles Firebase : new_index doit être un nombre >= 0.
                    //  • stats.js considère "non relevé" tant que new_index <= 0 → correct.
                    //  • indexConserve() : 0 < last_index ⇒ retombe sur last_index, aucune régression.
                    updates[`${P.compteurs}/${key}/last_index`]       = String(nIdx);
                    updates[`${P.compteurs}/${key}/new_index`]        = 0;
                    updates[`${P.compteurs}/${key}/status`]           = "impaye";
                    updates[`${P.compteurs}/${key}/statut`]           = false; // Booléen corrigé
                    updates[`${P.compteurs}/${key}/apaid`]            = nouvelApaid;
                    updates[`${P.compteurs}/${key}/arrieres`]         = 0;
                    updates[`${P.compteurs}/${key}/facture`]          = "false";
                    updates[`${P.compteurs}/${key}/print`]            = "false";
                    updates[`${P.compteurs}/${key}/last_modified_by`] = null;
                    updates[`${P.compteurs}/${key}/last_modified_at`] = null;
                    updates[`${P.compteurs}/${key}/date_paiement`]    = null;
                });

                await update(ref(db), updates);

                // ✅ CORRECTION v5 : EXPORT AUTOMATIQUE de l'archive en local (JSON).
                //    Firebase n'est plus le seul dépositaire de l'historique : en cas
                //    de corruption/suppression de la base, ce fichier permet la
                //    restauration. Téléchargement déclenché côté client, sans serveur.
                try {
                    const exportPayload = {
                        meta: {
                            application:      'Satigué Eau Admin',
                            type_export:      'archive_cloture_cycle',
                            cycle:            cycleKey,
                            village:          villageName,
                            date_export:      new Date().toISOString(),
                            total_entrees:    keys.length
                        },
                        donnees: data
                    };
                    const blob = new Blob([JSON.stringify(exportPayload, null, 2)], { type: 'application/json' });
                    const url  = URL.createObjectURL(blob);
                    const a    = document.createElement('a');
                    a.href     = url;
                    a.download = `satigue_eau_archive_${villageName.replace(/\s+/g, '_')}_${cycleKey}.json`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 5000);
                } catch (exportErr) {
                    // L'export local ne doit jamais faire échouer la clôture elle-même.
                    console.warn('Export local de l\'archive impossible :', exportErr);
                }

                log.textContent = `✅ MAINTENANCE RÉUSSIE — ${keys.length} entrée(s) archivée(s) — archive JSON téléchargée (conservez-la en lieu sûr)`;
                log.style.color = "var(--success)";
                btn.textContent = `✓ Cycle ${cycleKey} Clôturé`;
                btn.style.background = "var(--success)";
                stateDisp.textContent = "ARCHIVÉ";
                stateDisp.style.color = "var(--success)";

            } catch (e) {
                console.error('Erreur maintenance :', e);
                log.textContent = "Erreur : " + e.message;
                log.style.color = "var(--danger)";
                btn.textContent = "Réessayer";
                btn.disabled = false;
            }
        };
    </script>
