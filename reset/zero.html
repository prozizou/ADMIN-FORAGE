<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUFOR Admin | Maintenance Master</title>

    <script src="../security.js"></script>

    <style>
        :root {
            --bg:       #0f172a;
            --card:     rgba(30, 41, 59, 0.9);
            --primary:  #3b82f6;
            --success:  #10b981;
            --danger:   #ef4444;
            --warning:  #f59e0b;
            --text:     #f8fafc;
            --text-dim: #94a3b8;
            --border:   rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 15px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
        }

        .icon-db {
            width: 60px; height: 60px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            color: var(--primary);
            margin-left: auto;
            margin-right: auto;
            flex-shrink: 0;
        }

        h1 { margin: 0; font-size: 20px; font-weight: 800; }

        .badge {
            color: var(--primary);
            font-family: monospace;
            font-size: 12px;
            background: rgba(59, 130, 246, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        #offline-banner {
            display: none;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: bold;
            margin-top: 15px;
        }

        .status-panel {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 16px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            font-size: 13px;
            border: 1px solid var(--border);
            flex-shrink: 0;
        }

        .status-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .status-line:last-child { margin-bottom: 0; }

        button#btn-verify {
            width: 100%;
            padding: 12px;
            background: rgba(245, 158, 11, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            display: none;
            transition: all 0.2s;
        }
        button#btn-verify:hover { background: rgba(245, 158, 11, 0.3); }

        .unpaid-container {
            display: none;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
        }

        .unpaid-item {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            border-left: 3px solid var(--warning);
        }
        .unpaid-item:last-child { margin-bottom: 0; }
        
        .unpaid-header { font-weight: bold; margin-bottom: 8px; color: var(--text); }
        .unpaid-details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        
        .unpaid-item input, .unpaid-item select {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            color: white;
            padding: 6px;
            border-radius: 6px;
            font-size: 12px;
            box-sizing: border-box;
        }
        
        .btn-save-item {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-save-item:hover { opacity: 0.9; }

        .input-group { margin-bottom: 20px; flex-shrink: 0; }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        input[type="password"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            color: white;
            font-size: 24px;
            text-align: center;
            letter-spacing: 5px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="password"]:focus { border-color: var(--primary); }

        button#btn-action {
            width: 100%;
            padding: 18px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
        }

        button#btn-action:disabled {
            background: #475569;
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        #log-msg {
            margin-top: 15px;
            font-size: 11px;
            font-weight: bold;
            color: var(--text-dim);
            min-height: 18px;
            flex-shrink: 0;
        }

        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: rgba(255,255,255,0.3);
            text-decoration: none;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        .footer-link:hover { color: var(--text-dim); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

        @media (max-width: 380px) {
            .card { padding: 25px 15px; }
            h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-db">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
        </div>

        <h1>Maintenance Diandioly</h1>
        <div style="margin: 8px 0;"><span class="badge">asufor_db_diandioly</span></div>

        <div id="offline-banner">⚠️ Connexion Internet perdue</div>

        <div class="status-panel">
            <div class="status-line">
                <span>Cycle actuel :</span>
                <span id="cycle-display" style="color:var(--primary)">--/----</span>
            </div>
            <div class="status-line">
                <span>Entrées à traiter :</span>
                <span id="count-display" style="color:var(--text-dim)">--</span>
            </div>
            <div class="status-line">
                <span>État :</span>
                <span id="state-display">Vérification...</span>
            </div>
        </div>

        <button id="btn-verify" onclick="toggleUnpaidList()">🔍 Vérifier & Éditer les Impayés avant Clôture</button>
        <div id="unpaid-container" class="unpaid-container">
            <div id="unpaid-content">Chargement des données...</div>
        </div>

        <div class="input-group">
            <label>Passcode Dynamique (AnnéeMois)</label>
            <input type="password" id="passcode" maxlength="6" placeholder="AAAAMM" inputmode="numeric">
        </div>

        <button id="btn-action" onclick="runMaintenance()" disabled>Chargement...</button>
        <div id="log-msg">Initialisation du système...</div>
        <a href="../home/accueil.html" class="footer-link">← Retourner à l'accueil</a>
    </div>
       <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ✅ Vérification d'accès
        if (typeof window.checkAccess === 'function') {
            const s = window.checkAccess(['président']);
            if (!s) throw new Error('Accès refusé');
        }

        const firebaseConfig = {
            apiKey: "AIzaSyAKC7lrKSCFwfuoXASvX-yYIGneLXInvDk",
            authDomain: "asufor-67a06.firebaseapp.com",
            databaseURL: "https://asufor-67a06-default-rtdb.firebaseio.com",
            projectId: "asufor-67a06"
        };

        const app  = initializeApp(firebaseConfig);
        const db   = getDatabase(app);
        const auth = getAuth(app);

        // Mois actuel (Cycle en cours de clôture)
        const now  = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const cycleKey = `${year}-${month}`;
        const expectedPasscode = `${year}${month}`;

        // Calcul dynamique du mois précédent (pour lire l'archive correspondante)
        const prevDate = new Date();
        prevDate.setMonth(prevDate.getMonth() - 1);
        const prevYear = prevDate.getFullYear();
        const prevMonth = String(prevDate.getMonth() + 1).padStart(2, '0');
        const prevCycleKey = `${prevYear}-${prevMonth}`;

        const btn          = document.getElementById('btn-action');
        const btnVerify    = document.getElementById('btn-verify');
        const log          = document.getElementById('log-msg');
        const stateDisp    = document.getElementById('state-display');
        const countDisp    = document.getElementById('count-display');
        const offlineBanner = document.getElementById('offline-banner');

        document.getElementById('cycle-display').textContent = cycleKey;

        const spinnerIcon = `<svg class="spinner" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>`;

        window.addEventListener('offline', () => {
            offlineBanner.style.display = 'block';
            btn.disabled = true;
            btnVerify.style.display = 'none';
            btn.textContent = "Action bloquée (Hors ligne)";
        });

        window.addEventListener('online', () => {
            offlineBanner.style.display = 'none';
            checkStatus();
        });

        async function checkStatus() {
            if (!navigator.onLine) {
                log.textContent = "En attente de connexion réseau.";
                return;
            }
            try {
                const backupRef = ref(db, `asufor_backup/${cycleKey}`);
                const snap      = await get(backupRef);

                if (snap.exists()) {
                    stateDisp.textContent = "DÉJÀ EFFECTUÉ";
                    stateDisp.style.color = "var(--danger)";
                    btn.textContent = "Action verrouillée";
                    btn.disabled = true;
                    btnVerify.style.display = 'none';
                    log.textContent = "Le backup du cycle en cours existe déjà.";
                } else {
                    const srcSnap = await get(ref(db, 'asufor_db_diandioly'));
                    const count = srcSnap.exists() ? Object.keys(srcSnap.val()).length : 0;
                    countDisp.textContent = count + ' entrée(s)';

                    stateDisp.textContent = "PRÊT / DISPONIBLE";
                    stateDisp.style.color = "var(--success)";
                    btn.textContent = "Lancer Maintenance";
                    btn.disabled = false;
                    btnVerify.style.display = 'block'; 
                    btnVerify.textContent = `🔍 Vérifier les impayés du mois précédent (${prevCycleKey})`;
                    log.textContent = "Saisissez le passcode du mois (" + expectedPasscode + ").";
                }
            } catch (e) {
                log.textContent = "Erreur de connexion Firebase : " + e.message;
            }
        }

        window.toggleUnpaidList = async function() {
            const container = document.getElementById('unpaid-container');
            if (container.style.display === 'none' || container.style.display === '') {
                container.style.display = 'block';
                await loadUnpaidMeters();
            } else {
                container.style.display = 'none';
            }
        };

        window.loadUnpaidMeters = async function() {
            const contentDiv = document.getElementById('unpaid-content');
            contentDiv.innerHTML = `${spinnerIcon} Chargement de l'archive ${prevCycleKey}...`;
            
            try {
                // Lecture depuis l'archive du mois précédent !
                const snap = await get(ref(db, `asufor_backup/${prevCycleKey}/donnees`));
                if (!snap.exists()) {
                    contentDiv.innerHTML = `<div style="padding:10px; text-align:center; color:var(--text-dim)">Aucune archive trouvée pour ${prevCycleKey}.</div>`;
                    return;
                }

                const data = snap.val();
                let html = '';
                let count = 0;

                for (const key in data) {
                    const val = data[key];
                    // Vérification rigoureuse du statut booléen ou texte
                    const estPaye = String(val.status || "").trim().toLowerCase() === "paye" || 
                                    val.statut === true || 
                                    String(val.statut || "").trim().toLowerCase() === "true";

                    if (!estPaye) {
                        count++;
                        // Gestion des deux formats de nom (name ou nom/prenom)
                        const nomAffiche = val.name ? val.name : (val.nom ? `${val.prenom || ''} ${val.nom}`.trim() : key);
                        const ancienIdx = val.last_index || 0;
                        const nouvelIdx = val.new_index || ancienIdx;

                        html += `
                        <div class="unpaid-item" id="item_${key}">
                            <div class="unpaid-header">👤 ${nomAffiche} (ID: ${key})</div>
                            <div class="unpaid-details">
                                <div><small style="color:var(--text-dim)">Ancien Index</small><br>${ancienIdx}</div>
                                <div>
                                    <small style="color:var(--text-dim)">Nouvel Index</small><br>
                                    <input type="number" id="idx_${key}" value="${nouvelIdx}">
                                </div>
                                <div style="grid-column: span 2;">
                                    <small style="color:var(--text-dim)">Statut du paiement</small><br>
                                    <select id="stat_${key}">
                                        <option value="impaye" selected>🔴 Impayé</option>
                                        <option value="paye">🟢 Payé</option>
                                    </select>
                                </div>
                            </div>
                            <button class="btn-save-item" onclick="saveMeterEdit('${key}')">💾 Corriger l'archive ${prevCycleKey}</button>
                        </div>`;
                    }
                }

                if (count === 0) {
                    contentDiv.innerHTML = `<div style="color:var(--success); font-weight:bold; text-align:center; padding:10px;">✅ Tous les compteurs de l'archive ${prevCycleKey} sont payés !</div>`;
                } else {
                    contentDiv.innerHTML = `<div style="margin-bottom:12px; font-weight:bold; color:var(--warning)">⚠️ ${count} compteurs impayés dans l'archive ${prevCycleKey}</div>` + html;
                }

            } catch (e) {
                contentDiv.innerHTML = `<div style="color:var(--danger)">Erreur de chargement : ${e.message}</div>`;
            }
        };

        window.saveMeterEdit = async function(key) {
            const btnSave = document.querySelector(`#item_${key} .btn-save-item`);
            const originalText = btnSave.innerHTML;
            btnSave.innerHTML = "Sauvegarde...";
            btnSave.disabled = true;

            const newIdx = document.getElementById(`idx_${key}`).value;
            const newStat = document.getElementById(`stat_${key}`).value;

            try {
                const updates = {};
                // 1. Mise à jour dans le backup du mois précédent
                updates[`asufor_backup/${prevCycleKey}/donnees/${key}/new_index`] = Number(newIdx);
                updates[`asufor_backup/${prevCycleKey}/donnees/${key}/status`] = newStat;
                updates[`asufor_backup/${prevCycleKey}/donnees/${key}/statut`] = newStat === 'paye' ? true : false; // Booléen corrigé

                // 2. Synchronisation: On met à jour le last_index de la base active pour éviter un saut d'index ce mois-ci
                updates[`asufor_db_diandioly/${key}/last_index`] = String(newIdx);

                await update(ref(db), updates);
                
                if(newStat === 'paye') {
                    document.getElementById(`item_${key}`).remove();
                } else {
                    btnSave.innerHTML = "✅ Archivé";
                    btnSave.style.background = "var(--success)";
                    setTimeout(() => {
                        btnSave.innerHTML = originalText;
                        btnSave.style.background = "var(--primary)";
                        btnSave.disabled = false;
                    }, 2000);
                }
            } catch(e) {
                alert("Erreur lors de la mise à jour : " + e.message);
                btnSave.innerHTML = "❌ Erreur";
                btnSave.disabled = false;
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (navigator.onLine) checkStatus();
                else window.dispatchEvent(new Event('offline'));
            } else {
                log.textContent = "Session Firebase expirée. Veuillez vous reconnecter.";
                btn.disabled = true;
            }
        });

        window.runMaintenance = async function () {
            if (!navigator.onLine) {
                alert("Vous êtes hors ligne. Action impossible.");
                return;
            }

            const inputPass = document.getElementById('passcode').value;
            if (inputPass !== expectedPasscode) {
                alert("Passcode incorrect !");
                return;
            }

            if (!confirm(`⚠️ ATTENTION\n\nVoulez-vous clôturer le cycle ${cycleKey} et réinitialiser la base Diandioly ?\n\nCette opération est irréversible.`)) return;

            document.getElementById('unpaid-container').style.display = 'none';
            btnVerify.style.display = 'none';

            btn.disabled = true;
            btn.innerHTML = `${spinnerIcon} Traitement en cours...`;
            log.textContent = "Ne fermez pas la page, communication avec Firebase...";

            try {
                const sourceSnap = await get(ref(db, 'asufor_db_diandioly'));

                if (!sourceSnap.exists()) {
                    throw new Error("La base de données est vide. Rien à archiver.");
                }

                const data    = sourceSnap.val();
                const keys    = Object.keys(data);
                const updates = {};

                updates[`asufor_backup/${cycleKey}`] = {
                    info: {
                        date_sauvegarde: now.toLocaleString('fr-FR'),
                        total_entrees:   keys.length,
                        cycle:           cycleKey
                    },
                    donnees: data
                };

                keys.forEach(key => {
                    const val = data[key];
                    const nIdx    = parseFloat(val.new_index   || 0);
                    const lIdx    = parseFloat(val.last_index  || 0);
                    const facteur = parseFloat(val.facteur     || 250);
                    const conso   = Math.max(0, nIdx - lIdx);
                    const montantMois = conso * facteur;

                    const estPaye = String(val.status || "").trim().toLowerCase() === "paye"
                                 || val.statut === true 
                                 || String(val.statut || "").trim().toLowerCase() === "true";

                    const arrieresCourants = parseFloat(val.arrieres || val._impaye_anterieur || 0);
                    const nouvelApaid = estPaye ? 0 : (montantMois + arrieresCourants);

                    updates[`asufor_db_diandioly/${key}/last_index`]       = String(nIdx);
                    updates[`asufor_db_diandioly/${key}/new_index`]        = nIdx;
                    updates[`asufor_db_diandioly/${key}/status`]           = "impaye";
                    updates[`asufor_db_diandioly/${key}/statut`]           = false; // Booléen corrigé
                    updates[`asufor_db_diandioly/${key}/apaid`]            = nouvelApaid;
                    updates[`asufor_db_diandioly/${key}/arrieres`]         = 0;
                    updates[`asufor_db_diandioly/${key}/facture`]          = "false";
                    updates[`asufor_db_diandioly/${key}/print`]            = "false";
                    updates[`asufor_db_diandioly/${key}/last_modified_by`] = null;
                    updates[`asufor_db_diandioly/${key}/last_modified_at`] = null;
                    updates[`asufor_db_diandioly/${key}/date_paiement`]    = null;
                });

                await update(ref(db), updates);

                log.textContent = `✅ MAINTENANCE RÉUSSIE — ${keys.length} entrée(s) archivée(s)`;
                log.style.color = "var(--success)";
                btn.textContent = `✓ Cycle ${cycleKey} Clôturé`;
                btn.style.background = "var(--success)";
                stateDisp.textContent = "ARCHIVÉ";
                stateDisp.style.color = "var(--success)";

            } catch (e) {
                console.error('Erreur maintenance :', e);
                log.textContent = "Erreur : " + e.message;
                log.style.color = "var(--danger)";
                btn.textContent = "Réessayer";
                btn.disabled = false;
            }
        };
    </script>
