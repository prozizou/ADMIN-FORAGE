<!DOCTYPE html>
<html lang="fr"> 
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ASUFOR">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">

    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUFOR - Impression v5</title>
    
    <!-- ✅ Sécurité centralisée -->
    <script src="../security.js"></script>
    <!-- ✅ Overlay de chargement partagé -->
    <script src="../loader.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="../firebase-config.js"></script>
    <!-- ✅ Moteur de facturation partagé (window.Billing) -->
    <script src="../billing.js"></script>
    <!-- ✅ Multi-forage : résolution des chemins (mode legacy = chemins actuels) -->
    <script src="../admin-config.js"></script>
    <script src="../forage-context.js"></script>
    <!-- ✅ Vue à 360° super-admin : sélecteur de village -->
    <script src="../superadmin-village.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── Variables globales ── */
        :root {
            --bg-dark:      #0f172a;
            --card-dark:    #1e293b;
            --accent-green: #22c55e;
            --accent-blue:  #3b82f6;
            --accent-amber: #f59e0b;
            --accent-red:   #ef4444;
            --text-gray:    #94a3b8;
        }

        body { margin:0; font-family:'Inter',sans-serif; background:var(--bg-dark); color:white; min-height:100vh; padding:20px; }

        /* ── Barre d'outils : recherche + impression + filtres ──
           v2 : bloc allégé (deux lignes compactes au lieu d'un pavé qui
           occupait près de la moitié de l'écran), avec un contour "barre
           d'outils" plus net (moins arrondi qu'une carte flottante) pour que
           le contenu qui défile en dessous se lise comme "sous un bandeau
           fixe" plutôt que comme un défaut d'affichage. */
        .toolbar {
            display:flex; flex-direction:column; gap:10px;
            background:#1a2235; padding:14px 18px; border-radius:22px;
            margin:0 auto 18px auto; max-width:1000px; box-shadow:0 12px 24px -6px rgba(0,0,0,0.5);
            position:sticky; top:10px; z-index:1000;
        }
        .toolbar-row { display:flex; gap:10px; align-items:center; }

        .search-box { flex:1; position:relative; min-width:0; }
        .search-box input {
            width:100%; padding:10px 12px 10px 40px; border-radius:14px;
            border:1px solid transparent; background:#242c40; color:white; outline:none;
            font-size:0.92rem; box-sizing:border-box; transition:border-color .15s, box-shadow .15s;
        }
        /* ✅ v2 : état focus visible (contour bleu) — absent jusqu'ici */
        .search-box input:focus { border-color:var(--accent-blue); box-shadow:0 0 0 3px rgba(59,130,246,0.25); }
        .search-box input.filter-active { border-color:rgba(59,130,246,0.5); }
        .search-box i { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-gray); font-size:0.9rem; }

        .tb-select {
            padding:10px 14px; border-radius:14px; border:1px solid transparent; background:#242c40; color:white;
            outline:none; font-size:0.88rem; cursor:pointer; flex:1; min-width:0;
            transition:border-color .15s, box-shadow .15s;
        }
        .tb-select:focus { border-color:var(--accent-blue); box-shadow:0 0 0 3px rgba(59,130,246,0.25); }
        .tb-select option { background:var(--card-dark); }
        /* ✅ v2 : indique qu'un agent précis est filtré (pas "Tous les agents") */
        #releveurFilter.filter-active { border-color:var(--accent-blue); background:rgba(59,130,246,0.12); }

        /* ✅ v2 : une seule couleur d'accent (bleu) pour l'action principale —
           le vert saturé jurait avec le fond sombre. Bouton compact et
           discret plutôt qu'un pavé géant au milieu des filtres. */
        .btn-print {
            background:var(--accent-blue); color:white; border:none; padding:10px 16px;
            border-radius:14px; cursor:pointer; font-weight:700; font-size:0.88rem;
            display:flex; align-items:center; gap:8px; transition:0.2s; flex:none; white-space:nowrap;
        }
        .btn-print:hover { background:#2563eb; box-shadow:0 0 16px rgba(59,130,246,0.4); }
        .btn-print:active { transform:scale(0.97); }

        /* ── Sélection globale : déplacée au-dessus de la liste qu'elle
           contrôle, au lieu d'être isolée dans la barre de filtres. ── */
        .select-bar {
            max-width:1000px; margin:0 auto 14px auto; display:flex; justify-content:flex-end;
        }
        .select-all {
            display:flex; align-items:center; gap:8px; cursor:pointer;
            background:#1a2235; border:1px solid rgba(255,255,255,0.08);
            padding:8px 14px; border-radius:12px; font-size:0.85rem; font-weight:600; color:#cbd5e1;
            transition:border-color .15s;
        }
        .select-all:hover { border-color:var(--accent-blue); }
        .select-all input { width:18px; height:18px; cursor:pointer; accent-color:var(--accent-blue); }

        /* ── En-tête de page : titre + retour accueil (donne une hiérarchie
              claire sur PC ; masqué à l'impression via body * { visibility:hidden }) ── */
        .page-head {
            max-width:1000px; margin:0 auto 16px auto;
            display:flex; align-items:center; gap:14px;
        }
        .page-head .page-title { font-size:1.35rem; margin:0; font-weight:700; }
        .page-head .spacer { flex:1; }
        .btn-back {
            display:inline-flex; align-items:center; gap:8px; text-decoration:none;
            color:#cbd5e1; background:#1a2235; border:1px solid rgba(255,255,255,0.08);
            padding:10px 16px; border-radius:14px; font-weight:600; font-size:.9rem;
            transition:.2s; white-space:nowrap;
        }
        .btn-back:hover { color:#fff; border-color:var(--accent-blue); transform:translateX(-2px); }
        @media (max-width:768px) {
            .page-head { flex-wrap:wrap; gap:10px; }
            .page-head .page-title { font-size:1.1rem; order:2; width:100%; }
        }

        /* ── Bannière modifications en attente ── */
        #banner-modifs {
            display:none; max-width:900px; margin:-10px auto 20px auto;
            background:linear-gradient(135deg,#78350f,#92400e); border:1px solid var(--accent-amber);
            border-radius:16px; padding:12px 20px;
            display:none; align-items:center; gap:12px; font-size:0.95rem;
        }
        #banner-modifs.visible { display:flex; }
        #banner-modifs i { color:var(--accent-amber); font-size:1.3rem; flex-shrink:0; }
        #banner-modifs span { flex:1; }
        #banner-modifs strong { color:var(--accent-amber); }
        #btn-reset-all {
            background:transparent; border:1px solid var(--accent-amber); color:var(--accent-amber);
            padding:6px 14px; border-radius:12px; cursor:pointer; font-size:0.85rem; white-space:nowrap;
            transition:0.2s;
        }
        #btn-reset-all:hover { background:var(--accent-amber); color:#000; }

        /* ── Liste des factures ── */
        .list-container { max-width:900px; margin:auto; }
        .facture-item {
            background:var(--card-dark); padding:15px 20px; border-radius:20px;
            margin-bottom:12px; display:flex; justify-content:space-between; align-items:center;
            border:1px solid rgba(255,255,255,0.05); transition:border-color 0.2s;
            flex-wrap:wrap; gap:12px;
        }
        .facture-item:hover { border-color:var(--accent-blue); }
        .facture-item.is-modified { border-color:var(--accent-amber) !important; }

        /* Infos à gauche */
        .item-info { flex:1; min-width:180px; }
        .item-info strong { font-size:1.05rem; }
        .item-info .sub { color:var(--text-gray); font-size:0.88rem; margin-top:2px; }

        /* Badge "Modifié" */
        .badge-modifie {
            display:inline-flex; align-items:center; gap:5px;
            background:rgba(245,158,11,0.15); border:1px solid var(--accent-amber);
            color:var(--accent-amber); font-size:0.75rem; font-weight:600;
            padding:2px 10px; border-radius:20px; margin-top:5px;
        }

        /* Zone droite : montants + actions */
        .item-right { display:flex; align-items:center; gap:16px; }
        .item-amounts { text-align:right; }
        /* ✅ v2 : contraste renforcé — le gris précédent était limite illisible
           sur le fond sombre de la carte */
        .item-amounts .amounts-detail { color:#b6c2d9; font-size:0.85rem; font-weight:500; }
        .item-amounts .total-val { font-size:1.1rem; font-weight:700; }
        /* ✅ v2 : accent bleu au lieu d'un vert saturé — une seule couleur
           d'accent dans toute la page */
        .total-green { color:var(--accent-blue); }
        .total-gray  { color:var(--text-gray); }

        /* Actions groupées : modifier + case à cocher vivent dans un même
           bloc visuel, pour que leur lien soit évident au premier coup d'œil
           (avant : le crayon flottait seul, sans contexte). */
        .item-actions {
            display:flex; align-items:center; gap:10px;
            background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);
            padding:6px 10px; border-radius:16px; flex-shrink:0;
        }
        .btn-edit {
            background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.4);
            color:var(--accent-blue); width:32px; height:32px; border-radius:50%;
            cursor:pointer; font-size:0.8rem; display:flex; align-items:center; justify-content:center;
            transition:0.2s; flex-shrink:0;
        }
        .btn-edit:hover { background:var(--accent-blue); color:white; }

        /* ── Modal d'édition inline ── */
        .edit-overlay {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6);
            z-index:2000; align-items:center; justify-content:center; padding:20px;
        }
        .edit-overlay.open { display:flex; }
        .edit-modal {
            background:#1e293b; border:1px solid var(--accent-amber);
            border-radius:24px; padding:28px; width:100%; max-width:420px;
            box-shadow:0 20px 60px rgba(0,0,0,0.6);
            animation: popIn 0.2s ease;
        }
        @keyframes popIn {
            from { transform:scale(0.9); opacity:0; }
            to   { transform:scale(1);   opacity:1; }
        }
        .edit-modal h3 {
            margin:0 0 6px 0; font-size:1.15rem; color:var(--accent-amber);
        }
        .edit-modal .edit-client-name { color:var(--text-gray); font-size:0.9rem; margin-bottom:20px; }
        .edit-modal label { display:block; font-size:0.85rem; color:var(--text-gray); margin-bottom:6px; }
        
        .edit-row { margin-bottom:16px; }
        .edit-row .read-val {
            background:#0f172a; padding:10px 16px; border-radius:12px;
            color:white; font-weight:600; font-size:1rem;
        }
        .edit-input-wrap { position:relative; }
        .edit-input-wrap input {
            width:100%; padding:12px 60px 12px 16px; border-radius:14px;
            border:2px solid var(--accent-amber); background:#0f172a;
            color:white; font-size:1.1rem; font-weight:700; outline:none; box-sizing:border-box;
            transition:box-shadow 0.2s;
        }
        .edit-input-wrap input:focus { box-shadow:0 0 0 3px rgba(245,158,11,0.3); }
        .edit-input-wrap .unit { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-gray); font-size:0.85rem; pointer-events:none; }
        
        .edit-preview {
            background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.3);
            border-radius:12px; padding:12px 16px; margin-top:8px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .edit-preview span { color:var(--text-gray); font-size:0.9rem; }
        .edit-preview strong { color:var(--accent-blue); font-size:1.1rem; }

        .edit-buttons { display:flex; gap:10px; margin-top:22px; }
        .btn-confirm {
            flex:1; background:var(--accent-amber); color:#000; border:none;
            padding:13px; border-radius:14px; font-weight:700; font-size:1rem;
            cursor:pointer; transition:0.2s;
        }
        .btn-confirm:hover { background:#fbbf24; }
        .btn-cancel-edit {
            flex:1; background:rgba(255,255,255,0.08); color:white; border:none;
            padding:13px; border-radius:14px; font-weight:600; font-size:1rem;
            cursor:pointer; transition:0.2s;
        }
        .btn-cancel-edit:hover { background:rgba(255,255,255,0.14); }
        .btn-reset-one {
            background:rgba(239,68,68,0.15); color:var(--accent-red); border:1px solid rgba(239,68,68,0.35);
            padding:10px 16px; border-radius:12px; font-size:0.85rem; cursor:pointer; transition:0.2s;
        }
        .btn-reset-one:hover { background:var(--accent-red); color:white; }

        /* ── Zone d'impression ── */
        #print-zone { display:none; }

        /* ── IMPRESSION PAPIER ── */
        @media print {
            @page { size:A4; margin:0; }
            body * { visibility:hidden; }
            #print-zone, #print-zone * { visibility:visible; }
            #print-zone { display:block !important; position:absolute; left:0; top:0; width:100%; color:black; background:white; }
            .invoice-page { width:210mm; height:297mm; padding:12mm 18mm; box-sizing:border-box; background:white; page-break-after:always; }
            .p-header { text-align:center; margin-bottom:5px; font-size:19px; font-weight:bold; line-height:1.4; }
            .section-title { font-family:'Dancing Script',cursive; font-size:26px; text-align:center; margin:12px 0 6px 0; }
            .info-box { border:2.5px solid #333; border-radius:18px; padding:15px 25px; margin-bottom:18px; }
            .p-row { display:flex; justify-content:space-between; margin-bottom:8px; font-size:18px; }
            .bold { font-weight:900; }
            .deadline { margin-top:15px; font-size:18px; font-weight:bold; }
            .tresorier { font-family:'Dancing Script',cursive; font-size:28px; text-align:right; margin-top:-30px; }
            .p-dashed { border-top:2px dashed #000; margin:35px 0; position:relative; }
            .scissors { position:absolute; top:-14px; background:white; padding:0 10px; font-size:22px; }
            .sc-left { left:10%; } .sc-right { right:10%; }
            .footer-line { border-top:4px solid black; margin-top:15px; padding-top:15px; }
            /* Mention "arriérés corrigés" sur facture imprimée si modifié manuellement */
            .modif-notice { font-size:11px; color:#888; font-style:italic; margin-top:4px; }
        }

        /* ── Responsive mobile ── */
        @media (max-width:768px) {
            .toolbar { padding:12px 14px; border-radius:18px; }
            .facture-item { flex-direction:column; align-items:flex-start; }
            .item-right { width:100%; justify-content:space-between; }
        }
        @media (max-width:380px) {
            /* Écrans très étroits uniquement : les deux filtres (Mois / Agent)
               repassent l'un sous l'autre plutôt que de se comprimer. */
            .toolbar-row-filters { flex-direction:column; }
        }
    </style>
</head>
<body>

<script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => { for(let r of regs) r.update(); });
    }
</script>

<!-- ── En-tête de page ── -->
<header class="page-head">
    <a href="../home/accueil.html" class="btn-back"><i class="fas fa-arrow-left"></i> Accueil</a>
    <h1 class="page-title">🖨️ Impression des factures</h1>
    <span class="spacer"></span>
</header>

<!-- ── Barre d'outils : recherche + impression (ligne 1), filtres (ligne 2) ── -->
<div class="toolbar">
    <div class="toolbar-row">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Nom ou N° Compteur..." onkeyup="window.filterList()">
        </div>
        <button class="btn-print" onclick="window.print()" title="Imprimer les factures sélectionnées">
            <i class="fas fa-print"></i>
            <span>Imprimer</span>
        </button>
    </div>
    <div class="toolbar-row toolbar-row-filters">
        <select id="monthFilter" onchange="window.changeMonth()" class="tb-select">
            <option value="actuel">📅 Chargement des périodes...</option>
        </select>
        <select id="releveurFilter" onchange="window.filterList()" class="tb-select">
            <option value="">Tous les agents</option>
        </select>
    </div>
</div>

<!-- ── Bannière modifications ── -->
<div id="banner-modifs">
    <i class="fas fa-exclamation-triangle"></i>
    <span>
        <strong id="banner-count">0</strong> arriérés modifiés manuellement — ces valeurs ne seront pas sauvegardées dans Firebase, elles s'appliquent uniquement à cette impression.
    </span>
    <button id="btn-reset-all" onclick="window.resetAllOverrides()">
        <i class="fas fa-undo"></i> Tout réinitialiser
    </button>
</div>

<!-- ── Sélection globale : juste au-dessus de la liste qu'elle contrôle
     (avant : isolée dans la barre de filtres, sans lien visuel avec elle) ── -->
<div class="select-bar">
    <label class="select-all" for="master-cb">
        <input type="checkbox" id="master-cb" onchange="window.toggleAll(this)">
        <span>Tout sélectionner</span>
    </label>
</div>

<!-- ── Liste des factures ── -->
<div class="list-container" id="list-container">
    <p style="text-align:center; padding:20px;">Analyse de l'historique et calcul des factures en cours...</p>
</div>

<!-- ── Zone d'impression (cachée à l'écran) ── -->
<div id="print-zone"></div>

<!-- ── Modal d'édition des arriérés ── -->
<div class="edit-overlay" id="edit-overlay" onclick="window.closeEditIfOutside(event)">
    <div class="edit-modal" id="edit-modal">
        <h3><i class="fas fa-pencil-alt"></i> Modifier les arriérés</h3>
        <p class="edit-client-name" id="edit-client-name"></p>

        <div class="edit-row">
            <label>Montant du mois (calculé, non modifiable)</label>
            <div class="read-val" id="edit-montant-mois">—</div>
        </div>

        <div class="edit-row">
            <label>Arriérés / Solde antérieur impayé</label>
            <div class="edit-input-wrap">
                <input type="number" id="edit-input-arrieres" min="0" step="50"
                       oninput="window.updateEditPreview()" onkeydown="window.editKeyDown(event)">
                <span class="unit">FCFA</span>
            </div>
        </div>

        <div class="edit-preview">
            <span>Nouveau total à payer</span>
            <strong id="edit-preview-total">—</strong>
        </div>

        <div class="edit-buttons">
            <button class="btn-cancel-edit" onclick="window.closeEditModal()">
                <i class="fas fa-times"></i> Annuler
            </button>
            <button class="btn-reset-one" id="btn-reset-one" onclick="window.resetOneOverride()">
                <i class="fas fa-undo"></i> Réinitialiser
            </button>
            <button class="btn-confirm" onclick="window.confirmEdit()">
                <i class="fas fa-check"></i> Appliquer
            </button>
        </div>
    </div>
</div>

<!-- ════════════════════════════════════════════════════
     SCRIPT PRINCIPAL
════════════════════════════════════════════════════ -->
<script type="module">
    import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, get, set, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged }    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ✅ Vérification de la session
    const session = window.checkAccess(['président', 'secrétaire', 'trésorier']);
    if (!session) throw new Error('Accès refusé');

    // ── Config Firebase ──
    const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;

    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const auth = getAuth(app);
    // ✅ Chemins Firebase du forage courant, résolus dynamiquement (namespacé Asufor/{forageKey}/…)
    const P = window.ForageContext.paths();

    // ✅ Vue à 360° super-admin : sélecteur de village (aucun effet pour les autres rôles)
    if (window.SuperadminVillage) window.SuperadminVillage.init({ db, get, ref, session });

    // ✅ Branding par forage : nom du village + numéro de contact (téléphone du
    // président, saisi obligatoirement à la création du forage) imprimés sur les
    // factures, résolus depuis Asufor/{forageKey}/config — jamais "DIANDIOLY" /
    // un numéro en dur, chaque village doit voir SES propres informations.
    let forageVillage = 'ASUFOR';
    let forageTelephone = '';
    async function loadForageBranding() {
        try {
            const snap = await get(ref(db, P.config));
            const cfg = snap.exists() ? snap.val() : {};
            forageVillage = (cfg.siege || cfg.nom || 'ASUFOR').toUpperCase();
            document.title = 'ASUFOR ' + forageVillage + ' - Impression v5';
            // ⚠️ Repli historique : seul Diandioly (créé avant l'ajout de ce champ)
            // peut ne pas avoir de config.telephone — on garde alors son ancien
            // numéro en dur pour ne rien casser. Tout AUTRE forage sans numéro
            // configuré n'affiche simplement pas de ligne de contact.
            forageTelephone = cfg.telephone ||
                (P.forageKey === window.ForageContext.DEFAULT_FORAGE_KEY ? '77 624 70 30' : '');
        } catch (_) { /* garde le repli générique */ }
    }

    // ── Variables globales ──
    let dataCache           = {};   // données Firebase brutes + calculées
    let allBackups          = {};   // archives mensuelles
    let manualOverrides     = {};   // { [key]: { arrieres: number, original: number } }
    let editCurrentKey      = null; // clé en cours d'édition dans le modal
    let unsubCurrentMonth   = null;
    let currentSelectedMonth = "actuel";

    // ── Formateurs ──
    const fPrice = (val) => new Intl.NumberFormat('fr-FR').format(Math.round(val)) + " FCFA";

    // ✅ CORRECTION XSS : échapper toutes les valeurs dynamiques insérées dans innerHTML
    const esc = (str) => {
        if (str == null) return '—';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    };

    function formatSmartDates(dateReleve, selectedMonthStr, isOnlyArrieres) {
        let dRef;
        if (selectedMonthStr && selectedMonthStr !== "actuel") {
            const parts = selectedMonthStr.split('-');
            dRef = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 15);
        } else {
            dRef = dateReleve ? new Date(dateReleve) : new Date();
        }
        if (isOnlyArrieres) dRef.setMonth(dRef.getMonth() - 1);
        const dDebut    = new Date(dRef.getFullYear(), dRef.getMonth() - 1, 1);
        const dFin      = new Date(dRef.getFullYear(), dRef.getMonth(),     1);
        const dEcheance = new Date(dRef.getFullYear(), dRef.getMonth(),    15);
        const f = d => d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
        return { debut: f(dDebut), fin: f(dFin), echeance: f(dEcheance), date_edition: f(new Date()) };
    }

    // ── Mise à jour de la bannière des modifications ──
    function updateBanner() {
        const count = Object.keys(manualOverrides).length;
        const banner = document.getElementById('banner-modifs');
        if (count > 0) {
            document.getElementById('banner-count').textContent = count;
            banner.classList.add('visible');
        } else {
            banner.classList.remove('visible');
        }
    }

    // ── Chargement du sélecteur de mois ──
    async function initMonthFilter() {
        const monthSelect = document.getElementById('monthFilter');
        try {
            const snapshot = await get(ref(db, P.backup));
            // ✅ v2 : icône calendrier au lieu d'une étoile/soleil — plus adaptée
            // à une appli de gestion utilitaire.
            let optionsHtml = '<option value="actuel">📅 Mois Actuel</option>';
            if (snapshot.exists()) {
                allBackups = snapshot.val();
                Object.keys(allBackups).sort().reverse().forEach(month => {
                    optionsHtml += `<option value="${month}">🗂️ Archive : ${month}</option>`;
                });
            }
            monthSelect.innerHTML = optionsHtml;
            window.changeMonth();
        } catch (e) {
            monthSelect.innerHTML = '<option value="actuel">📅 Mois Actuel</option>';
            window.changeMonth();
        }
    }

    // ── Changement de mois ──
    window.changeMonth = function() {
        currentSelectedMonth = document.getElementById('monthFilter').value;
        // Réinitialise les overrides manuels lors d'un changement de mois
        manualOverrides = {};
        updateBanner();
        document.getElementById('list-container').innerHTML = "<p style='text-align:center'>Calcul des arriérés en cours...</p>";
        if (unsubCurrentMonth) { unsubCurrentMonth(); unsubCurrentMonth = null; }
        const path = currentSelectedMonth === "actuel"
            ? P.compteurs
            : `${P.backup}/${currentSelectedMonth}/donnees`;
        unsubCurrentMonth = onValue(ref(db, path), renderData, (err) => {
            console.error("Firebase:", err.code, err.message);
            document.getElementById('list-container').innerHTML =
                `<p style='text-align:center;color:#ef4444;'>⚠️ Erreur (${err.code}). Reconnectez-vous.</p>`;
        });
    };

    // ══════════════════════════════════════════
    // RENDU DE LA LISTE
    // ══════════════════════════════════════════
    function renderData(snap) {
        if (window.AsuforLoader) AsuforLoader.hide();
        const selectedMonthStr = currentSelectedMonth === "actuel" ? "9999-99" : currentSelectedMonth;
        const listContainer    = document.getElementById('list-container');
        listContainer.innerHTML = "";
        dataCache = {};
        const agentsMap = new Map();

        // ── Moteur de facturation partagé (billing.js) ──
        // On indexe les backups UNE fois par rendu (perf), puis on délègue tout
        // le calcul facture/arriérés/anomalies au module commun. Fini les
        // divergences de logique entre impression et statistiques.
        const indexedBackups = window.Billing.indexBackups(allBackups);
        // Le cumul ne considère que les cycles STRICTEMENT antérieurs au mois affiché.
        // "actuel" → selectedMonthStr vaut "9999-99" (déjà défini plus haut), donc
        // tous les cycles archivés comptent.
        const beforeCycle = selectedMonthStr;

        snap.forEach(child => {
            const d   = child.val();
            const key = child.key;

            // Calcul complet via le moteur partagé
            const stmt = window.Billing.computeStatement(d, indexedBackups, { beforeCycle });
            const montantMois = stmt.facture_courante;
            const arrieres    = stmt.arriere;

            d.vol        = stmt.conso;
            d.montantMois = montantMois;
            d.anomalie   = stmt.anomalie;         // mois courant en anomalie ?
            d.anomalieRaison = stmt.raison || null;
            // Applique l'override manuel s'il existe, sinon valeur calculée
            d.arrieres   = manualOverrides[key] !== undefined ? manualOverrides[key].arrieres : arrieres;
            d.arrieresFB = arrieres;   // valeur calculée d'origine (pour reset)
            d.total      = montantMois + d.arrieres;
            dataCache[key] = d;

            if (d.agent_id) agentsMap.set(d.agent_id, d.agent_name || "Agent inconnu");

            // ── Création de la carte ──
            const isModified = manualOverrides[key] !== undefined;
            const div = document.createElement('div');
            div.className = 'facture-item' + (isModified ? ' is-modified' : '');
            div.setAttribute('data-id',       key);
            div.setAttribute('data-search',   `${(d.name || '').toLowerCase()} ${String(d.numero_compteur || '').trim().toLowerCase()}`);
            div.setAttribute('data-releveur', d.agent_id || '');

            const badgeHtml = isModified
                ? `<div><span class="badge-modifie"><i class="fas fa-pencil-alt"></i> Arriérés modifiés</span></div>`
                : '';

            const checkboxHtml = d.total > 0
                ? `<input type="checkbox" class="bill-cb" data-id="${key}" onchange="window.renderPrint()"
                          style="width:20px;height:20px;accent-color:var(--accent-blue);cursor:pointer;">`
                : `<span style="font-size:0.8rem;color:var(--text-gray);font-style:italic;">Rien à payer</span>`;

            div.innerHTML = `
                <div class="item-info">
                    <strong>${d.name || 'Inconnu'}</strong>
                    <div class="sub">Cpt: ${d.numero_compteur || 'N/A'} | Zone: ${d.zone || 'N/A'}</div>
                    ${badgeHtml}
                </div>
                <div class="item-right">
                    <div class="item-amounts">
                        <div class="amounts-detail" id="detail-${key}">
                            Mois: ${fPrice(montantMois)} | Arr: <span id="arr-${key}">${fPrice(d.arrieres)}</span>
                        </div>
                        <div class="total-val ${d.total > 0 ? 'total-green' : 'total-gray'}" id="total-${key}">
                            ${fPrice(d.total)}
                        </div>
                    </div>
                    <div class="item-actions">
                        <button class="btn-edit" onclick="window.openEditModal('${key}')" title="Modifier les arriérés">
                            <i class="fas fa-pencil-alt"></i>
                        </button>
                        ${checkboxHtml}
                    </div>
                </div>`;
            listContainer.appendChild(div);
        });

        // ── Mise à jour du filtre agents ──
        const releveurSelect = document.getElementById('releveurFilter');
        const current = releveurSelect.value;
        // ✅ CORRECTION v5 : échappement XSS du nom d'agent (donnée Firebase) via
        //    window.escHtml (security.js), et construction en une seule affectation
        //    (évite le reparse DOM à chaque itération avec innerHTML +=).
        const escOpt = window.escHtml || (s => String(s == null ? '' : s));
        let optionsHtml = '<option value="">Tous les agents</option>';
        agentsMap.forEach((name, id) => {
            optionsHtml += `<option value="${escOpt(id)}">👤 ${escOpt(String(name).toUpperCase())}</option>`;
        });
        releveurSelect.innerHTML = optionsHtml;
        releveurSelect.value = current;

        window.filterList();
        updateBanner();
    }

    // ══════════════════════════════════════════
    // GESTION DU MODAL D'ÉDITION DES ARRIÉRÉS
    // ══════════════════════════════════════════

    window.openEditModal = function(key) {
        const d = dataCache[key];
        if (!d) return;
        editCurrentKey = key;

        document.getElementById('edit-client-name').textContent =
            `${d.name || 'Inconnu'} — Cpt: ${d.numero_compteur || 'N/A'} — Zone: ${d.zone || forageVillage}`;
        document.getElementById('edit-montant-mois').textContent = fPrice(d.montantMois);

        const input = document.getElementById('edit-input-arrieres');
        input.value = Math.round(d.arrieres);
        window.updateEditPreview();

        // Affiche/cache le bouton "Réinitialiser" selon qu'il y a un override
        document.getElementById('btn-reset-one').style.display =
            manualOverrides[key] !== undefined ? 'inline-flex' : 'none';

        document.getElementById('edit-overlay').classList.add('open');
        setTimeout(() => input.focus(), 80);
    };

    window.updateEditPreview = function() {
        const key = editCurrentKey;
        if (!key) return;
        const montantMois = dataCache[key]?.montantMois || 0;
        const newArrieres = Math.max(0, parseFloat(document.getElementById('edit-input-arrieres').value) || 0);
        document.getElementById('edit-preview-total').textContent = fPrice(montantMois + newArrieres);
    };

    window.editKeyDown = function(e) {
        if (e.key === 'Enter')  window.confirmEdit();
        if (e.key === 'Escape') window.closeEditModal();
    };

    // ✅ CORRECTION v4 : Persistance des modifications d'arriérés dans Firebase.
    //    Les arriérés modifiés manuellement sont désormais sauvegardés dans la base de données
    //    et historisés dans un journal d'audit.

    window.confirmEdit = async function() {
        const key = editCurrentKey;
        if (!key) return;
        const newArrieres = Math.max(0, parseFloat(document.getElementById('edit-input-arrieres').value) || 0);
        manualOverrides[key] = { arrieres: newArrieres, original: dataCache[key].arrieresFB };

        // Met à jour dataCache
        dataCache[key].arrieres = newArrieres;
        dataCache[key].total    = dataCache[key].montantMois + newArrieres;

        // ✅ CORRECTION v4 : Persister l'arriéré dans Firebase
        // Le chemin cible dépend du mois sélectionné (actuel ou archive)
        const isArchive = currentSelectedMonth && currentSelectedMonth !== "actuel";
        let targetPath;
        if (isArchive) {
            targetPath = `${P.backup}/${currentSelectedMonth}/donnees/${key}/arrieres`;
        } else {
            targetPath = `${P.compteurs}/${key}/arrieres`;
        }

        // Historiser la modification dans le journal d'audit
        const auditEntry = {
            compteurKey: key,
            compteur: dataCache[key].numero_compteur || 'N/A',
            proprietaire: dataCache[key].name || 'N/A',
            zone: dataCache[key].zone || 'N/A',
            ancienArrieres: dataCache[key].arrieresFB || 0,
            nouveauArrieres: newArrieres,
            modifiePar: session.email || 'inconnu',
            modifieRole: session.role || 'inconnu',
            modifieLe: new Date().toISOString(),
            sessionForage: P.forageKey
        };

        try {
            // Écrire la valeur dans la base de données
            await update(ref(db), {
                [targetPath]: newArrieres
            });

            // Historiser dans le journal d'audit (multi-forage)
            const auditRef = push(ref(db, 'Asufor/' + P.forageKey + '/audit_arrieres'));
            await set(auditRef, auditEntry);

            console.log('[ASUFOR] Arriérés sauvegardés pour', key, ':', newArrieres);
        } catch (err) {
            console.error('[ASUFOR] Erreur sauvegarde arriérés :', err);
        }

        // Met à jour la carte dans le DOM sans recharger toute la liste
        refreshCard(key);
        updateBanner();
        window.renderPrint();
        window.closeEditModal();
    };

    window.resetOneOverride = function() {
        const key = editCurrentKey;
        if (!key) return;
        delete manualOverrides[key];
        dataCache[key].arrieres = dataCache[key].arrieresFB;
        dataCache[key].total    = dataCache[key].montantMois + dataCache[key].arrieresFB;

        document.getElementById('edit-input-arrieres').value = Math.round(dataCache[key].arrieres);
        window.updateEditPreview();
        document.getElementById('btn-reset-one').style.display = 'none';

        refreshCard(key);
        updateBanner();
        window.renderPrint();
        window.closeEditModal();
    };

    window.resetAllOverrides = function() {
        if (!confirm('Réinitialiser tous les arriérés modifiés manuellement ?')) return;
        Object.keys(manualOverrides).forEach(key => {
            if (dataCache[key]) {
                dataCache[key].arrieres = dataCache[key].arrieresFB;
                dataCache[key].total    = dataCache[key].montantMois + dataCache[key].arrieresFB;
                refreshCard(key);
            }
        });
        manualOverrides = {};
        updateBanner();
        window.renderPrint();
    };

    window.closeEditModal = function() {
        document.getElementById('edit-overlay').classList.remove('open');
        editCurrentKey = null;
    };

    window.closeEditIfOutside = function(e) {
        if (e.target === document.getElementById('edit-overlay')) window.closeEditModal();
    };

    // Rafraîchit uniquement les éléments visuels d'une carte sans tout re-render
    function refreshCard(key) {
        const d   = dataCache[key];
        const div = document.querySelector(`.facture-item[data-id="${key}"]`);
        if (!div || !d) return;

        const isModified = manualOverrides[key] !== undefined;
        div.classList.toggle('is-modified', isModified);

        // Badge
        const info = div.querySelector('.item-info');
        const oldBadge = info.querySelector('.badge-modifie');
        if (oldBadge) oldBadge.closest('div').remove();
        if (isModified) {
            const bdiv = document.createElement('div');
            bdiv.innerHTML = `<span class="badge-modifie"><i class="fas fa-pencil-alt"></i> Arriérés modifiés</span>`;
            info.appendChild(bdiv);
        }

        // Montants
        const arrEl   = document.getElementById(`arr-${key}`);
        const totalEl = document.getElementById(`total-${key}`);
        if (arrEl)   arrEl.textContent   = fPrice(d.arrieres);
        if (totalEl) {
            totalEl.textContent = fPrice(d.total);
            totalEl.className = `total-val ${d.total > 0 ? 'total-green' : 'total-gray'}`;
        }

        // Checkbox si total est passé à 0 (rare)
        const right   = div.querySelector('.item-right');
        const actions = div.querySelector('.item-actions');
        let cb = right.querySelector('.bill-cb, span');
        if (d.total > 0 && (!cb || cb.tagName === 'SPAN')) {
            if (cb) cb.remove();
            const newCb = document.createElement('input');
            newCb.type = 'checkbox'; newCb.className = 'bill-cb';
            newCb.setAttribute('data-id', key);
            newCb.setAttribute('onchange', 'window.renderPrint()');
            newCb.style.cssText = "width:20px;height:20px;accent-color:var(--accent-blue);cursor:pointer;";
            (actions || right).appendChild(newCb);
        }
    }

    // ══════════════════════════════════════════
    // FILTRES
    // ══════════════════════════════════════════
    window.filterList = function() {
        const searchEl = document.getElementById('searchInput');
        const relEl    = document.getElementById('releveurFilter');
        const q   = searchEl.value.toLowerCase();
        const sel = relEl.value;
        // ✅ v2 : feedback visuel qu'un filtre est appliqué (contour bleu),
        // absent jusqu'ici — on ne voyait pas si "Tous les agents" avait été
        // changé pour un agent précis.
        searchEl.classList.toggle('filter-active', q.trim() !== '');
        relEl.classList.toggle('filter-active', sel !== '');
        document.querySelectorAll('.facture-item').forEach(it => {
            const mText = it.getAttribute('data-search').includes(q);
            const mRel  = sel === "" || it.getAttribute('data-releveur') === sel;
            it.style.display = (mText && mRel) ? 'flex' : 'none';
        });
        window.renderPrint();
    };

    window.toggleAll = function(src) {
        document.querySelectorAll('.facture-item').forEach(it => {
            if (it.style.display !== 'none') {
                const cb = it.querySelector('.bill-cb');
                if (cb) cb.checked = src.checked;
            }
        });
        window.renderPrint();
    };

    // ══════════════════════════════════════════
    // GÉNÉRATION DES PAGES D'IMPRESSION
    // ══════════════════════════════════════════
    window.renderPrint = function() {
        const printZone = document.getElementById('print-zone');
        let html = "";

        document.querySelectorAll('.bill-cb:checked').forEach(box => {
            const item = box.closest('.facture-item');
            if (item.style.display === 'none') return;

            const d   = dataCache[box.getAttribute('data-id')];
            const isOnlyArrieres = (d.montantMois === 0 && d.arrieres > 0);
            const dates = formatSmartDates(d.date, currentSelectedMonth, isOnlyArrieres);
            const isModified = manualOverrides[box.getAttribute('data-id')] !== undefined;

            html += `
            <div class="invoice-page">
                <div class="p-header">Forage ${forageVillage} 🚰${forageTelephone ? '<br>' + esc(forageTelephone) : ''}</div>
                <div class="section-title">Période de consommation</div>
                <div class="info-box">
                    <div class="p-row"><span>DU : <strong>${dates.debut}</strong></span><span>AU : <strong>${dates.fin}</strong></span></div>
                </div>
                <div class="section-title">Détails du client</div>
                <div class="info-box">
                    <div class="p-row"><span>Numéro Compteur</span><span>Compteur N°${esc(d.numero_compteur) || "N/A"}</span></div>
                    <div class="p-row"><span>Prénom/Nom</span><span>${esc(d.name)}</span></div>
                    <div class="p-row"><span>Adresse</span><span>${esc(d.zone) || forageVillage}</span></div>
                </div>
                <div class="section-title">Détails consommation</div>
                <div class="info-box">
                    <div class="p-row"><span>Dernier index</span><span>${esc(d.last_index)} m³</span></div>
                    <div class="p-row"><span>Nouvel index</span><span>${esc(d.new_index)} m³</span></div>
                    <div class="p-row bold"><span>m³ vendus</span><span>${esc(d.vol)} m³</span></div>
                    <div class="p-row"><span>Prix Unitaire</span><span>${esc(d.facteur || 250)} FCFA</span></div>
                    <div class="p-row"><span>Montant du mois</span><span>${fPrice(d.montantMois)}</span></div>
                    <div class="p-row" style="color:#c53030">
                        <span>Solde antérieur impayé</span>
                        <span>${fPrice(d.arrieres)}${isModified ? ' *' : ''}</span>
                    </div>
                    <div class="p-row bold" style="font-size:22px;border-top:2px solid #000;padding-top:8px;margin-top:5px;">
                        <span>Montant Total à Payer</span><span>${fPrice(d.total)}</span>
                    </div>
                    ${isModified ? `<div class="modif-notice">* Montant corrigé manuellement avant impression</div>` : ''}
                </div>
                <div class="deadline">À payer avant le <strong>${dates.echeance}</strong></div>
                <div class="tresorier">Le trésorier</div>
                <div class="p-dashed">
                    <i class="fas fa-scissors scissors sc-left"></i>
                    <i class="fas fa-scissors scissors sc-right"></i>
                </div>
                <div class="section-title" style="font-size:20px">Reçu de paiement</div>
                <div class="p-row"><span>N° Compteur</span><span>Compteur N°${esc(d.numero_compteur) || "N/A"}</span></div>
                <div class="p-row"><span>Prénom & Nom</span><span>${esc(d.name)}</span></div>
                <div class="footer-line">
                    <div class="p-row"><span>Consommation (${esc(d.vol)} m³)</span><span>${fPrice(d.montantMois)}</span></div>
                    <div class="p-row"><span>Arriérés</span><span>${fPrice(d.arrieres)}${isModified ? ' *' : ''}</span></div>
                    <div class="p-row bold" style="font-size:22px"><span>Total Reçu</span><span>${fPrice(d.total)}</span></div>
                    <div style="font-size:12px;margin-top:5px;opacity:0.7">Date du relevé : ${dates.date_edition}</div>
                </div>
            </div>`;
        });

        printZone.innerHTML = html;
    };

    // ══════════════════════════════════════════
    // DÉMARRAGE — on attend la confirmation Auth
    // ══════════════════════════════════════════
    onAuthStateChanged(auth, (user) => {
        if (user) {
            if (window.AsuforLoader) AsuforLoader.show('Chargement des factures…');
            loadForageBranding();
            initMonthFilter();
        } else {
            // ✅ CORRECTION v4 : nettoyer aussi 'asufor_session' (sinon il reste
            // valide en localStorage alors que le token Firebase a été perdu —
            // désynchronisation à l'origine des écrans d'erreur incompris).
            try { localStorage.removeItem('asufor_session'); } catch(_) {}
            if (window.AsuforLoader) {
                AsuforLoader.fail('Session expirée ou invalide. Reconnexion nécessaire.');
            }
            document.getElementById('list-container').innerHTML =
                "<p style='text-align:center;color:#ef4444;'>⚠️ Session expirée. <a href='../index.html' style='color:#3b82f6'>Reconnectez-vous</a></p>";
        }
    });

</script>
</body>
</html>
