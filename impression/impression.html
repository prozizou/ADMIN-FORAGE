<!DOCTYPE html>
<html lang="fr"> 
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#f8fafc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Satigué Eau">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">

    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satigué Eau - Impression v5</title>
    
    <!-- ✅ Sécurité centralisée -->
    <script src="../biometric.js"></script>
    <script src="../security.js"></script>
    <!-- ✅ Overlay de chargement partagé -->
    <script src="../loader.js"></script>
    <script src="../sync.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="../firebase-config.js"></script>
    <!-- ✅ Moteur de facturation partagé (window.Billing) -->
    <script src="../billing.js"></script>
    <!-- ✅ v7 : grand livre comptable (arriérés et avances depuis les factures / paiements) -->
    <script src="../compta.js"></script>
    <script src="../compta-ui.js"></script>
    <!-- ✅ Multi-forage : résolution des chemins (mode legacy = chemins actuels) -->
    <script src="../admin-config.js"></script>
    <script src="../forage-context.js"></script>
    <!-- ✅ Vue à 360° super-admin : sélecteur de village -->
    <script src="../superadmin-village.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ── Variables globales ──
           ✅ v6 : thème bleu nuit conservé, contraste renforcé (surfaces plus
           distinctes du fond, texte secondaire plus lisible) et grille de 8px
           pour tous les espacements de la refonte. */
        :root {
            --bg-dark:      #f0f2f5;
            --card-dark:    #ffffff;
            --surface-2:    #eef1f6;   /* surface intermédiaire (barres, toolbar) */
            --border-soft:  rgba(15,23,42,0.1);
            --accent-green: #22c55e;
            --accent-blue:  #3b82f6;
            --accent-amber: #f59e0b;
            --accent-red:   #ef4444;
            --text-gray:    #64748b;  /* texte secondaire, contraste AA sur fond clair */
        }

        body { margin:0; font-family:'Inter',sans-serif; background:var(--bg-dark); color:#1e293b; min-height:100vh; padding:16px; padding-bottom:16px; }

        /* ── Barre d'outils : recherche + tri + filtres + compteur de résultats ──
           v6 : le bouton "Imprimer" quitte la barre — l'impression est
           désormais liée à la sélection via la barre d'action fixe en bas
           d'écran (.action-bar), jamais accessible "à vide". La barre reste
           compacte (grille 8px), avec un contour net plutôt qu'une carte
           flottante pour bien lire "bandeau fixe" au défilement. */
        .toolbar {
            display:flex; flex-direction:column; gap:8px;
            background:var(--surface-2); padding:12px 16px; border-radius:18px;
            margin:0 auto 10px auto; max-width:1000px; box-shadow:0 12px 24px -6px rgba(15,23,42,0.1);
            position:sticky; top:8px; z-index:1000;
        }
        .toolbar-row { display:flex; gap:8px; align-items:center; }

        .search-box { flex:2; position:relative; min-width:0; }
        .search-box input {
            width:100%; padding:9px 12px 9px 38px; border-radius:12px;
            border:1px solid transparent; background:rgba(15,23,42,0.05); color:#1e293b; outline:none;
            font-size:0.88rem; box-sizing:border-box; transition:border-color .15s, box-shadow .15s;
        }
        /* ✅ v2 : état focus visible (contour bleu) — absent jusqu'ici */
        .search-box input:focus { border-color:var(--accent-blue); box-shadow:0 0 0 3px rgba(59,130,246,0.25); }
        .search-box input.filter-active { border-color:rgba(59,130,246,0.5); }
        .search-box i { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-gray); font-size:0.85rem; }

        .tb-select {
            padding:9px 12px; border-radius:12px; border:1px solid transparent; background:rgba(15,23,42,0.05); color:#1e293b;
            outline:none; font-size:0.84rem; cursor:pointer; flex:1; min-width:0;
            transition:border-color .15s, box-shadow .15s;
        }
        .tb-select:focus { border-color:var(--accent-blue); box-shadow:0 0 0 3px rgba(59,130,246,0.25); }
        .tb-select option { background:var(--card-dark); }
        /* ✅ v2 : indique qu'un agent précis est filtré (pas "Tous les agents") */
        #releveurFilter.filter-active { border-color:var(--accent-blue); background:rgba(59,130,246,0.12); }

        /* Compteur de résultats — répond immédiatement à la recherche/aux
           filtres, sans avoir à compter les cartes soi-même. */
        .result-count {
            font-size:0.78rem; color:var(--text-gray); font-weight:600;
            white-space:nowrap; flex:none; padding:0 2px;
        }

        /* ── Sélection globale + tri : une seule ligne compacte au-dessus de
           la liste (avant : "Tout sélectionner" isolé, aucun tri possible). ── */
        .select-bar {
            max-width:1000px; margin:0 auto 10px auto; display:flex; justify-content:space-between;
            align-items:center; gap:8px; flex-wrap:wrap;
        }
        .select-all {
            display:flex; align-items:center; gap:8px; cursor:pointer;
            background:var(--surface-2); border:1px solid var(--border-soft);
            padding:7px 14px; border-radius:12px; font-size:0.82rem; font-weight:600; color:#475569;
            transition:border-color .15s;
        }
        .select-all:hover { border-color:var(--accent-blue); }
        .select-all input { width:17px; height:17px; cursor:pointer; accent-color:var(--accent-blue); }

        /* ── Total à payer : mis en évidence immédiatement, avant la liste —
           reflète toujours l'ensemble actuellement filtré (recherche/agent),
           pas un total figé au chargement. ── */
        .summary-bar {
            max-width:1000px; margin:0 auto 14px auto;
            background:var(--surface-2); border:1px solid var(--border-soft);
            border-radius:18px; padding:14px 18px;
            display:flex; align-items:center; gap:20px; flex-wrap:wrap;
            box-shadow:0 8px 20px -8px rgba(15,23,42,0.1);
        }
        .summary-total { flex:1; min-width:180px; }
        .summary-total .lbl { font-size:0.72rem; font-weight:700; color:var(--text-gray); text-transform:uppercase; letter-spacing:.04em; }
        .summary-total .val { font-size:1.55rem; font-weight:800; color:var(--accent-blue); margin-top:2px; line-height:1.1; }
        .summary-chips { display:flex; gap:8px; flex-wrap:wrap; }
        .summary-chip {
            display:flex; align-items:center; gap:6px; font-size:0.78rem; font-weight:700;
            padding:6px 12px; border-radius:20px; white-space:nowrap;
        }
        .summary-chip .n { font-size:0.9rem; }
        .summary-chip.chip-ajour   { background:rgba(34,197,94,0.14);  color:#16a34a; border:1px solid rgba(34,197,94,0.3); }
        .summary-chip.chip-arriere{ background:rgba(245,158,11,0.14); color:#d97706; border:1px solid rgba(245,158,11,0.3); }
        .summary-chip.chip-impaye { background:rgba(239,68,68,0.14); color:#dc2626;   border:1px solid rgba(239,68,68,0.3); }
        @media (max-width:520px) {
            .summary-bar { padding:12px 14px; gap:12px; }
            .summary-total .val { font-size:1.3rem; }
        }

        /* ── En-tête de page : titre + retour accueil — compactée en v6
              (padding/police réduits, un seul niveau de hiérarchie visuelle
              avant la barre d'outils qui, elle, concentre l'essentiel de
              l'attention). Masquée à l'impression via body * { visibility:hidden } ── */
        .page-head {
            max-width:1000px; margin:0 auto 12px auto;
            display:flex; align-items:center; gap:12px;
        }
        .page-head .page-title { font-size:1.1rem; margin:0; font-weight:700; }
        .page-head .spacer { flex:1; }
        .btn-back {
            display:inline-flex; align-items:center; gap:8px; text-decoration:none;
            color:#475569; background:#eef1f6; border:1px solid var(--border-soft);
            padding:8px 14px; border-radius:12px; font-weight:600; font-size:.85rem;
            transition:.2s; white-space:nowrap;
        }
        .btn-back:hover { color:var(--accent-blue); border-color:var(--accent-blue); transform:translateX(-2px); }
        @media (max-width:768px) {
            .page-head { flex-wrap:wrap; gap:8px; }
            .page-head .page-title { font-size:1rem; order:2; width:100%; }
        }

        /* ── Bannière modifications en attente ── */
        #banner-modifs {
            display:none; max-width:900px; margin:-10px auto 20px auto;
            background:linear-gradient(135deg,#fef3c7,#fde68a); border:1px solid var(--accent-amber); color:#78350f;
            border-radius:16px; padding:12px 20px;
            display:none; align-items:center; gap:12px; font-size:0.95rem;
        }
        #banner-modifs.visible { display:flex; }
        #banner-modifs i { color:#b45309; font-size:1.3rem; flex-shrink:0; }
        #banner-modifs span { flex:1; }
        #banner-modifs strong { color:#92400e; }
        #btn-reset-all {
            background:transparent; border:1px solid var(--accent-amber); color:#92400e;
            padding:6px 14px; border-radius:12px; cursor:pointer; font-size:0.85rem; white-space:nowrap;
            transition:0.2s;
        }
        #btn-reset-all:hover { background:var(--accent-amber); color:#000; }

        /* ── Liste des factures ──
           ✅ v6 : cartes nettement plus compactes (padding et marge réduits
           d'environ un tiers) pour parcourir beaucoup plus de clients à
           l'écran sans donner une impression de vide. */
        .list-container { max-width:900px; margin:auto; }
        .facture-item {
            background:var(--card-dark); padding:12px 16px; border-radius:16px;
            margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;
            border:1px solid rgba(15,23,42,0.08); transition:border-color 0.2s;
            flex-wrap:wrap; gap:10px;
        }
        .facture-item:hover { border-color:var(--accent-blue); }
        .facture-item.is-modified { border-color:var(--accent-amber) !important; }

        /* Infos à gauche */
        .item-info { flex:1; min-width:180px; }
        .item-info .name-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
        .item-info strong { font-size:0.98rem; }
        .item-info .sub { color:var(--text-gray); font-size:0.82rem; margin-top:2px; }

        /* Badge "Modifié" */
        .badge-modifie {
            display:inline-flex; align-items:center; gap:5px;
            background:rgba(245,158,11,0.15); border:1px solid var(--accent-amber);
            color:#d97706; font-size:0.72rem; font-weight:600;
            padding:2px 10px; border-radius:20px; margin-top:4px;
        }

        /* Pastilles de statut sémantique — même logique que sur la page
           Statistiques : un état honnête, dérivé des seules données
           disponibles (montant total dû + arriérés calculés). Pas de
           "Partiellement payé" : l'appli ne suit aucun paiement partiel par
           facture, un badge de ce type afficherait une info inventée. */
        .status-chip {
            display:inline-flex; align-items:center; gap:4px;
            font-size:0.68rem; font-weight:800; letter-spacing:.02em;
            padding:2px 9px; border-radius:20px; white-space:nowrap;
        }
        .chip-ajour   { background:rgba(34,197,94,0.14);  color:#16a34a; border:1px solid rgba(34,197,94,0.3); }
        .chip-arriere { background:rgba(245,158,11,0.14); color:#d97706; border:1px solid rgba(245,158,11,0.3); }
        .chip-impaye  { background:rgba(239,68,68,0.14);  color:#dc2626;   border:1px solid rgba(239,68,68,0.3); }

        /* Zone droite : montants + actions */
        .item-right { display:flex; align-items:center; gap:14px; }
        .item-amounts { text-align:right; }
        /* ✅ v2 : contraste renforcé — le gris précédent était limite illisible
           sur le fond sombre de la carte */
        .item-amounts .amounts-detail { color:#64748b; font-size:0.8rem; font-weight:500; }
        .item-amounts .total-val { font-size:1.05rem; font-weight:700; }
        /* ✅ v2 : accent bleu au lieu d'un vert saturé — une seule couleur
           d'accent dans toute la page */
        .total-green { color:var(--accent-blue); }
        .total-gray  { color:var(--text-gray); }

        /* Actions groupées : modifier + case à cocher vivent dans un même
           bloc visuel, pour que leur lien soit évident au premier coup d'œil
           (avant : le crayon flottait seul, sans contexte). */
        .item-actions {
            display:flex; align-items:center; gap:10px;
            background:rgba(15,23,42,0.03); border:1px solid rgba(15,23,42,0.07);
            padding:6px 10px; border-radius:16px; flex-shrink:0;
        }
        .btn-edit {
            background:rgba(59,130,246,0.15); border:1px solid rgba(59,130,246,0.4);
            color:var(--accent-blue); width:32px; height:32px; border-radius:50%;
            cursor:pointer; font-size:0.8rem; display:flex; align-items:center; justify-content:center;
            transition:0.2s; flex-shrink:0;
        }
        .btn-edit:hover { background:var(--accent-blue); color:white; }

        /* ── Modal d'édition inline ── */
        .edit-overlay {
            display:none; position:fixed; inset:0; background:rgba(15,23,42,0.5);
            z-index:2000; align-items:center; justify-content:center; padding:20px;
        }
        .edit-overlay.open { display:flex; }
        .edit-modal {
            background:#ffffff; border:1px solid var(--accent-amber);
            border-radius:24px; padding:28px; width:100%; max-width:420px;
            box-shadow:0 20px 60px rgba(15,23,42,0.18);
            animation: popIn 0.2s ease;
        }
        @keyframes popIn {
            from { transform:scale(0.9); opacity:0; }
            to   { transform:scale(1);   opacity:1; }
        }
        .edit-modal h3 {
            margin:0 0 6px 0; font-size:1.15rem; color:#d97706;
        }
        .edit-modal .edit-client-name { color:var(--text-gray); font-size:0.9rem; margin-bottom:20px; }
        .edit-modal label { display:block; font-size:0.85rem; color:var(--text-gray); margin-bottom:6px; }
        
        .edit-row { margin-bottom:16px; }
        .edit-row .read-val {
            background:rgba(15,23,42,0.05); padding:10px 16px; border-radius:12px;
            color:#1e293b; font-weight:600; font-size:1rem;
        }
        .edit-input-wrap { position:relative; }
        .edit-input-wrap input {
            width:100%; padding:12px 60px 12px 16px; border-radius:14px;
            border:2px solid var(--accent-amber); background:rgba(15,23,42,0.04);
            color:#1e293b; font-size:1.1rem; font-weight:700; outline:none; box-sizing:border-box;
            transition:box-shadow 0.2s;
        }
        .edit-input-wrap input:focus { box-shadow:0 0 0 3px rgba(245,158,11,0.3); }
        .edit-input-wrap .unit { position:absolute; right:14px; top:50%; transform:translateY(-50%); color:var(--text-gray); font-size:0.85rem; pointer-events:none; }
        
        .edit-preview {
            background:rgba(59,130,246,0.1); border:1px solid rgba(59,130,246,0.3);
            border-radius:12px; padding:12px 16px; margin-top:8px;
            display:flex; justify-content:space-between; align-items:center;
        }
        .edit-preview span { color:var(--text-gray); font-size:0.9rem; }
        .edit-preview strong { color:var(--accent-blue); font-size:1.1rem; }

        .edit-buttons { display:flex; gap:10px; margin-top:22px; }
        .btn-confirm {
            flex:1; background:var(--accent-amber); color:#000; border:none;
            padding:13px; border-radius:14px; font-weight:700; font-size:1rem;
            cursor:pointer; transition:0.2s;
        }
        .btn-confirm:hover { background:#fbbf24; }
        .btn-cancel-edit {
            flex:1; background:rgba(15,23,42,0.06); color:#1e293b; border:none;
            padding:13px; border-radius:14px; font-weight:600; font-size:1rem;
            cursor:pointer; transition:0.2s;
        }
        .btn-cancel-edit:hover { background:rgba(15,23,42,0.1); }
        .btn-reset-one {
            background:rgba(239,68,68,0.15); color:#dc2626; border:1px solid rgba(239,68,68,0.35);
            padding:10px 16px; border-radius:12px; font-size:0.85rem; cursor:pointer; transition:0.2s;
        }
        .btn-reset-one:hover { background:var(--accent-red); color:white; }

        /* ── Zone d'impression ──
           ✅ v6 : le contenu (une page par facture) garde son apparence
           "papier" en permanence (plus seulement sous @media print) — c'est
           ce qui permet l'aperçu à l'écran ci-dessous. Seule la zone reste
           masquée hors impression/aperçu (display:none), et @media print
           se limite désormais à la géométrie et à la visibilité exclusive
           de #print-zone au moment d'imprimer réellement. */
        #print-zone { display:none; }
        .invoice-page { width:210mm; max-width:100%; min-height:297mm; box-sizing:border-box; background:white; color:black; padding:12mm 18mm; }
        .p-header { text-align:center; margin-bottom:5px; font-size:19px; font-weight:bold; line-height:1.4; }
        .section-title { font-family:'Dancing Script',cursive; font-size:26px; text-align:center; margin:12px 0 6px 0; }
        .info-box { border:2.5px solid #333; border-radius:18px; padding:15px 25px; margin-bottom:18px; }
        .p-row { display:flex; justify-content:space-between; margin-bottom:8px; font-size:18px; }
        .bold { font-weight:900; }
        .deadline { margin-top:15px; font-size:18px; font-weight:bold; }
        .tresorier { font-family:'Dancing Script',cursive; font-size:28px; text-align:right; margin-top:-30px; }
        .p-dashed { border-top:2px dashed #000; margin:35px 0; position:relative; }
        .scissors { position:absolute; top:-14px; background:white; padding:0 10px; font-size:22px; }
        .sc-left { left:10%; } .sc-right { right:10%; }
        .footer-line { border-top:4px solid black; margin-top:15px; padding-top:15px; }
        /* Mention "arriérés corrigés" sur facture imprimée si modifié manuellement */
        .modif-notice { font-size:11px; color:#888; font-style:italic; margin-top:4px; }

        /* ── Aperçu avant impression ──
           Réutilise #print-zone tel quel (aucune duplication de contenu) :
           en mode aperçu, on le sort de son display:none et on le pose en
           overlay plein écran, scrollable, avec une mini barre d'outils
           séparée (fermer / imprimer) qui ne sera jamais écrasée par les
           re-rendus de renderPrint(). */
        body.preview-mode { overflow:hidden; }
        body.preview-mode #print-zone {
            display:flex !important; flex-direction:column; align-items:center; gap:24px;
            position:fixed; inset:0; overflow:auto; z-index:5000;
            background:rgba(15,23,42,0.85); padding:80px 16px 40px 16px;
        }
        body.preview-mode .invoice-page { box-shadow:0 20px 50px rgba(15,23,42,0.35); border-radius:4px; flex-shrink:0; }
        .preview-toolbar {
            display:none; position:fixed; top:0; left:0; right:0; z-index:5001;
            align-items:center; justify-content:space-between; gap:12px;
            background:var(--surface-2); border-bottom:1px solid var(--border-soft);
            padding:14px 20px; box-shadow:0 4px 16px rgba(15,23,42,0.15);
        }
        body.preview-mode .preview-toolbar { display:flex; }
        .preview-toolbar strong { font-size:0.92rem; }
        .preview-toolbar .ptb-actions { display:flex; gap:10px; }
        @media (max-width:768px) {
            body.preview-mode #print-zone { transform-origin:top center; padding:70px 8px 30px 8px; }
            body.preview-mode .invoice-page { transform:scale(0.42); margin-bottom:-380px; }
        }

        /* ── IMPRESSION PAPIER : géométrie + visibilité exclusive uniquement —
           l'apparence de la facture elle-même est définie plus haut, hors
           media query, pour être partagée avec l'aperçu à l'écran. ── */
        @media print {
            @page { size:A4; margin:0; }
            body * { visibility:hidden; }
            #print-zone, #print-zone * { visibility:visible; }
            #print-zone {
                display:block !important; position:absolute; left:0; top:0; width:100%;
                color:black; background:white; padding:0;
            }
            .invoice-page { height:297mm; page-break-after:always; box-shadow:none !important; transform:none !important; margin:0 !important; }
        }

        /* ── Barre d'action fixe, liée à la sélection ──
           N'apparaît que lorsqu'au moins une facture est cochée — impossible
           de lancer une impression "à vide" ou de se demander ce qui va
           sortir de l'imprimante. */
        .action-bar {
            position:fixed; left:16px; right:16px; bottom:-100px; z-index:1500;
            max-width:968px; margin:0 auto;
            background:var(--card-dark); border:1px solid rgba(59,130,246,0.35);
            border-radius:18px; padding:14px 18px;
            display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
            box-shadow:0 16px 40px -8px rgba(15,23,42,0.18);
            transition:bottom .25s ease;
        }
        .action-bar.visible { bottom:16px; }
        .action-bar .ab-info { font-size:0.88rem; font-weight:600; color:#334155; }
        .action-bar .ab-info .ab-total { color:var(--accent-blue); font-weight:800; }
        .action-bar .ab-actions { display:flex; gap:10px; }
        .btn-preview {
            background:transparent; color:#475569; border:1px solid var(--border-soft); padding:10px 16px;
            border-radius:14px; cursor:pointer; font-weight:600; font-size:0.85rem;
            display:flex; align-items:center; gap:8px; transition:0.2s; white-space:nowrap;
        }
        .btn-preview:hover { border-color:var(--accent-blue); color:var(--accent-blue); }
        .btn-print {
            background:var(--accent-blue); color:white; border:none; padding:10px 18px;
            border-radius:14px; cursor:pointer; font-weight:700; font-size:0.85rem;
            display:flex; align-items:center; gap:8px; transition:0.2s; flex:none; white-space:nowrap;
        }
        .btn-print:hover { background:#2563eb; box-shadow:0 0 16px rgba(59,130,246,0.4); }
        .btn-print:active { transform:scale(0.97); }
        /* La liste ne doit jamais rester cachée sous la barre fixe une fois visible */
        body.has-selection .list-container { padding-bottom:78px; }

        /* ── Chargement : skeleton loaders ──
           Remplacent le texte "Calcul en cours..." — la silhouette des
           cartes à venir est plus rassurante qu'un message d'attente nu. */
        .skeleton-card {
            background:var(--card-dark); border:1px solid rgba(15,23,42,0.07);
            border-radius:16px; padding:12px 16px; margin-bottom:8px;
            display:flex; justify-content:space-between; align-items:center; gap:14px;
        }
        .skeleton-line { height:12px; border-radius:6px; background:linear-gradient(90deg,#e2e8f0,#f1f5f9,#e2e8f0); background-size:200% 100%; animation:sk-shimmer 1.4s infinite; }
        .skeleton-card .sk-a { width:45%; }
        .skeleton-card .sk-b { width:30%; margin-top:8px; }
        .skeleton-card .sk-c { width:80px; height:32px; border-radius:10px; flex-shrink:0; }
        @keyframes sk-shimmer { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }

        /* ── Retour visuel (toast) — confirmation après impression ── */
        #toast {
            visibility:hidden; position:fixed; left:50%; bottom:30px; transform:translateX(-50%);
            background:var(--accent-green); color:#04210f; font-weight:700; font-size:0.88rem;
            padding:14px 22px; border-radius:14px; box-shadow:0 10px 30px rgba(15,23,42,0.15);
            z-index:6000; opacity:0; transition:opacity .3s, bottom .3s;
        }
        #toast.show { visibility:visible; opacity:1; bottom:50px; }

        /* ── Responsive mobile ── */
        @media (max-width:768px) {
            .toolbar { padding:10px 12px; border-radius:16px; }
            .facture-item { flex-direction:column; align-items:flex-start; }
            .item-right { width:100%; justify-content:space-between; }
            .action-bar { left:8px; right:8px; flex-direction:column; align-items:stretch; }
            .action-bar .ab-actions { width:100%; }
            .action-bar .ab-actions button { flex:1; justify-content:center; }
        }
        @media (max-width:380px) {
            /* Écrans très étroits uniquement : les deux filtres (Mois / Agent)
               repassent l'un sous l'autre plutôt que de se comprimer. */
            .toolbar-row-filters { flex-direction:column; }
        }
    </style>
</head>

<!-- ════════════════════════════════════════════════════
     SCRIPT PRINCIPAL
════════════════════════════════════════════════════ -->
<script type="module">
    import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, get, set, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged }    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ✅ Vérification de la session
    const session = window.checkAccess(['président', 'secrétaire', 'trésorier']);
    if (!session) throw new Error('Accès refusé');

    // ── Config Firebase ──
    const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;

    // Lecture protégée (délai maximal + nouvelles tentatives, voir sync.js) : jamais de chargement infini.
    const sget = (r) => window.AsuforSync ? window.AsuforSync.safeGet(get, r) : get(r);

    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const auth = getAuth(app);
    // ✅ Chemins Firebase du forage courant, résolus dynamiquement (namespacé Asufor/{forageKey}/…)
    const P = window.ForageContext.paths();

    // ✅ Vue à 360° super-admin : sélecteur de village (aucun effet pour les autres rôles)
    if (window.SuperadminVillage) window.SuperadminVillage.init({ db, get, ref, session });

    // ✅ Branding par forage : nom du village + numéro de contact (téléphone du
    // président, saisi obligatoirement à la création du forage) imprimés sur les
    // factures, résolus depuis Asufor/{forageKey}/config — jamais "DIANDIOLY" /
    // un numéro en dur, chaque village doit voir SES propres informations.
    let forageVillage = 'SATIGUE EAU';
    let forageTelephone = '';
    async function loadForageBranding() {
        try {
            const snap = await sget(ref(db, P.config));
            const cfg = snap.exists() ? snap.val() : {};
            forageVillage = (cfg.siege || cfg.nom || 'SATIGUE EAU').toUpperCase();
            document.title = 'Satigué Eau ' + forageVillage + ' - Impression v5';
            // ⚠️ Repli historique : seul Diandioly (créé avant l'ajout de ce champ)
            // peut ne pas avoir de config.telephone — on garde alors son ancien
            // numéro en dur pour ne rien casser. Tout AUTRE forage sans numéro
            // configuré n'affiche simplement pas de ligne de contact.
            forageTelephone = cfg.telephone ||
                (P.forageKey === window.ForageContext.DEFAULT_FORAGE_KEY ? '77 624 70 30' : '');
        } catch (_) { /* garde le repli générique */ }
    }

    // ── Variables globales ──
    let dataCache           = {};   // données Firebase brutes + calculées
    let allBackups          = {};   // archives mensuelles
    let manualOverrides     = {};   // v7 : toujours vide (plus de correction manuelle d'arriérés : registre « ajustements »)
    let lastSnap            = null;   // dernier instantané rendu (re-rendu quand le grand livre change)
    let editCurrentKey      = null; // clé en cours d'édition dans le modal
    let unsubCurrentMonth   = null;
    let currentSelectedMonth = "actuel";

    // ── Formateurs ──
    const fPrice = (val) => new Intl.NumberFormat('fr-FR').format(Math.round(val)) + " FCFA";

    // ── Skeleton loader (chargement/changement de mois) ──
    const SKELETON_HTML = Array.from({ length: 4 }).map(() =>
        `<div class="skeleton-card"><div><div class="skeleton-line sk-a"></div><div class="skeleton-line sk-b"></div></div><div class="skeleton-line sk-c"></div></div>`
    ).join('');

    // ── Retour visuel (toast) — même logique que statistiques/stats.js ──
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.innerText = msg;
        toast.style.backgroundColor = isError ? 'var(--accent-red)' : 'var(--accent-green)';
        toast.style.color = isError ? '#fff' : '#04210f';
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 3000);
    }
    // ✅ Retour visuel après impression réelle (le navigateur ferme/valide la
    // boîte de dialogue d'impression) — l'utilisateur sait que l'action a
    // bien été envoyée, sans avoir à deviner.
    window.addEventListener('afterprint', () => showToast('✅ Impression envoyée à l\'imprimante'));

    // ── Statut sémantique d'une facture ──
    // À jour   : rien à payer (total <= 0).
    // Arriéré  : un solde antérieur impayé est reporté sur cette facture.
    // Impayé   : seul le mois courant est dû, sans solde reporté.
    // (Pas de "Partiellement payé" : aucun paiement partiel n'est suivi par
    // facture dans cette appli — l'inventer afficherait une donnée fausse.)
    // Consommation inhabituelle (> 100 m³, voir Billing) ET impayé : classé « Arriéré » (dette à
    // suivre de près) même sans arriéré ancien. Les montants ne changent pas.
    window.billStatusChip = function(d) {
        if (d.total <= 0)   return { cls: 'chip-ajour',   label: '✓ À jour' };
        if (d.arrieres > 0) return { cls: 'chip-arriere', label: '⏱ Arriéré' };
        if (d.conso_inhabituelle && d.impaye) return { cls: 'chip-arriere', label: '⏱ Arriéré', title: 'Consommation inhabituelle et impayé' };
        return { cls: 'chip-impaye', label: '✕ Impayé' };
    };

    // ✅ CORRECTION XSS : échapper toutes les valeurs dynamiques insérées dans innerHTML
    const esc = (str) => {
        if (str == null) return '—';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    };

    function formatSmartDates(dateReleve, selectedMonthStr, isOnlyArrieres) {
        let dRef;
        if (selectedMonthStr && selectedMonthStr !== "actuel") {
            const parts = selectedMonthStr.split('-');
            dRef = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 15);
        } else {
            dRef = dateReleve ? new Date(dateReleve) : new Date();
        }
        if (isOnlyArrieres) dRef.setMonth(dRef.getMonth() - 1);
        const dDebut    = new Date(dRef.getFullYear(), dRef.getMonth() - 1, 1);
        const dFin      = new Date(dRef.getFullYear(), dRef.getMonth(),     1);
        const dEcheance = new Date(dRef.getFullYear(), dRef.getMonth(),    15);
        const f = d => d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
        return { debut: f(dDebut), fin: f(dFin), echeance: f(dEcheance), date_edition: f(new Date()) };
    }

    // ── Mise à jour de la bannière des modifications ──
    function updateBanner() {
        if (!document.getElementById('banner-modifs')) return;   // v7 : plus de corrections manuelles d'arriérés
        const count = Object.keys(manualOverrides).length;
        const banner = document.getElementById('banner-modifs');
        if (count > 0) {
            document.getElementById('banner-count').textContent = count;
            banner.classList.add('visible');
        } else {
            banner.classList.remove('visible');
        }
    }

    const Sync = window.AsuforSync || null;
    const fakeSnap = (obj) => ({
        exists: () => !!obj, val: () => obj,
        forEach: (cb) => { Object.keys(obj || {}).forEach(k => cb({ key: k, val: () => obj[k] })); }
    });
    function monthOptions(active) {
        let html = '<option value="actuel">📅 Mois Actuel</option>';
        Object.keys(allBackups || {}).sort().reverse().forEach(month => { html += `<option value="${month}">🗂️ Archive : ${month}</option>`; });
        return { html, active };
    }

    // ── Chargement du sélecteur de mois ──
    async function initMonthFilter() {
        const monthSelect = document.getElementById('monthFilter');
        try {
            const snapshot = await sget(ref(db, P.backup));
            if (snapshot.exists()) allBackups = snapshot.val();
            monthSelect.innerHTML = monthOptions().html;
            window.changeMonth();
        } catch (e) {
            monthSelect.innerHTML = '<option value="actuel">📅 Mois Actuel</option>';
            window.changeMonth();
        }
    }

    // ── Changement de mois ──
    window.changeMonth = function() {
        currentSelectedMonth = document.getElementById('monthFilter').value;
        manualOverrides = {};
        updateBanner();
        attachData(false);
    };

    // Écoute des relevés du mois choisi. silent = resynchronisation en arrière-plan : la liste affichée n'est PAS vidée.
    // La copie locale (dernier instantané reçu) est affichée immédiatement ; le listener précédent est toujours détaché
    // avant le nouveau (clé unique) : aucun doublon, aucun listener zombie.
    function attachData(silent) {
        const path = currentSelectedMonth === "actuel" ? P.compteurs : `${P.backup}/${currentSelectedMonth}/donnees`;
        const cacheKey = 'impression:' + path;
        const list = document.getElementById('list-container');
        if (!silent) {
            const cached = window.AsuforCache ? window.AsuforCache.read(cacheKey) : null;
            if (cached && typeof cached === 'object') renderData(fakeSnap(cached));
            else { list.innerHTML = SKELETON_HTML; lastSnap = null; }
        }
        const un = onValue(ref(db, path), (snap) => {
            if (window.AsuforCache) window.AsuforCache.write(cacheKey, snap.val() || {});
            renderData(snap);
        }, (err) => {
            console.error("Firebase:", err.code, err.message);
            if (lastSnap) return;         // des données sont déjà affichées : on les garde (le badge indique l'état)
            list.innerHTML = `<p style='text-align:center;color:#dc2626;'>⚠️ Erreur (${err.code}). <a href="#" onclick="window.AsuforSync ? AsuforSync.resync('manual',{force:true}) : location.reload(); return false;" style="color:#3b82f6">Réessayer</a></p>`;
        });
        if (Sync) Sync.track('impression:data', un);
        else { if (unsubCurrentMonth) unsubCurrentMonth(); unsubCurrentMonth = un; }
    }

    // Resynchronisation silencieuse : archives relues, écoute des relevés rattachée, rien n'est vidé.
    async function resyncAll() {
        const snapshot = await sget(ref(db, P.backup));
        allBackups = snapshot.exists() ? snapshot.val() : {};
        const monthSelect = document.getElementById('monthFilter');
        const active = monthSelect.value;
        monthSelect.innerHTML = monthOptions().html;
        monthSelect.value = active;
        attachData(true);
        if (lastSnap) renderData(lastSnap);
    }

    // ══════════════════════════════════════════
    // RENDU DE LA LISTE
    // ══════════════════════════════════════════
    function renderData(snap) {
        if (window.AsuforLoader) AsuforLoader.hide();
        const selectedMonthStr = currentSelectedMonth === "actuel" ? "9999-99" : currentSelectedMonth;
        const listContainer    = document.getElementById('list-container');
        listContainer.innerHTML = "";
        dataCache = {};
        const agentsMap = new Map();

        // ── Moteur de facturation partagé (billing.js) ──
        // On indexe les backups UNE fois par rendu (perf), puis on délègue tout
        // le calcul facture/arriérés/anomalies au module commun. Fini les
        // divergences de logique entre impression et statistiques.
        const indexedBackups = window.Billing.indexBackups(allBackups);

        // ── v7 : arriérés et avances depuis le GRAND LIVRE (compta.js) une fois la migration faite ;
        //    avant (ou pour une archive antérieure à la migration) : reconstitution historique (billing.js).
        const S = window.ComptaUI.getState();
        const migrated = window.ComptaUI.isMigrated();
        const mig = window.ComptaUI.getMigration();
        const cutoff = migrated ? (mig.dernier_cycle || '') : null;
        const isOpen = currentSelectedMonth === "actuel";
        const ledger = migrated && (isOpen || currentSelectedMonth > cutoff);
        const currentKeys = {};
        snap.forEach(child => { currentKeys[child.key] = true; });
        manualOverrides = {};
        lastSnap = snap;

        snap.forEach(child => {
            const d   = child.val();
            const key = child.key;
            const cur = window.Billing.computeCurrent(d);
            let montantMois, arrieres, avance = 0, total;
            if (ledger && isOpen) {
                const du = window.Compta.amountDueNow(S, key, d);
                montantMois = du.facture_provisoire; arrieres = du.arrieres; avance = du.avance; total = du.total_du;
            } else if (ledger) {
                const f = S.factures[window.Compta.factureId(currentSelectedMonth, key)];
                const acc = window.Compta.computeAccount(S, key);
                arrieres = acc.factures.filter(x => x.cycle < currentSelectedMonth && !x.annulee).reduce((t, x) => t + x.reste_a_payer, 0);
                const st = f ? window.Compta.factureState(S, f) : null;
                montantMois = st ? st.montant_net : 0;
                total = (st ? st.reste_a_payer : 0) + arrieres;
            } else {
                const stmt = window.Billing.computeStatement(d, indexedBackups, { beforeCycle: selectedMonthStr, fbKey: key, currentKeys });
                montantMois = stmt.facture_courante; arrieres = stmt.arriere; total = stmt.total;
            }

            d.conso_inhabituelle = window.Billing.isUnusualConsumption(d);
            d.impaye     = ledger ? total > 0 : !window.Billing.isPaid(d);
            d.vol        = cur.conso;
            d.montantMois = montantMois;
            d.anomalie   = cur.anomalie;          // mois courant en anomalie ?
            d.anomalieRaison = cur.raison || null;
            d.arrieres   = arrieres;
            d.avance     = avance;
            d.total      = total;
            dataCache[key] = d;

            if (d.agent_id) agentsMap.set(d.agent_id, d.agent_name || "Agent inconnu");

            // ── Création de la carte ──
            const isModified = false;
            const div = document.createElement('div');
            div.className = 'facture-item' + (isModified ? ' is-modified' : '');
            div.setAttribute('data-id',       key);
            div.setAttribute('data-search',   `${(d.name || '').toLowerCase()} ${String(d.numero_compteur || '').trim().toLowerCase()}`);
            div.setAttribute('data-releveur', d.agent_id || '');
            div.setAttribute('data-total',    d.total);
            div.setAttribute('data-name',     (d.name || '').toLowerCase());
            div.setAttribute('data-zone',     (d.zone || '').toLowerCase());

            const badgeHtml = isModified
                ? `<div><span class="badge-modifie"><i class="fas fa-pencil-alt"></i> Arriérés modifiés</span></div>`
                : '';

            // ✅ Badge sémantique honnête — dérivé des seules données
            // disponibles (voir note sur .status-chip : pas de "Partiellement
            // payé", non supporté par le modèle de données actuel).
            const chip = window.billStatusChip(d);

            const checkboxHtml = d.total > 0
                ? `<input type="checkbox" class="bill-cb" data-id="${key}" onchange="window.updateSelectionBar()"
                          style="width:20px;height:20px;accent-color:var(--accent-blue);cursor:pointer;">`
                : `<span style="font-size:0.8rem;color:var(--text-gray);font-style:italic;">Rien à payer</span>`;

            div.innerHTML = `
                <div class="item-info">
                    <div class="name-row">
                        <strong>${d.name || 'Inconnu'}</strong>
                        <span class="status-chip ${chip.cls}"${chip.title ? ` title="${chip.title}"` : ''}>${chip.label}</span>
                    </div>
                    <div class="sub">Compteur n°${d.numero_compteur || 'N/A'} · Zone : ${d.zone || 'N/A'}</div>
                    ${badgeHtml}
                </div>
                <div class="item-right">
                    <div class="item-amounts">
                        <div class="amounts-detail" id="detail-${key}">
                            Mois : ${fPrice(montantMois)} · Arr : <span id="arr-${key}">${fPrice(d.arrieres)}</span>${d.avance > 0 ? ` · Avance : <span id="av-${key}">${fPrice(d.avance)}</span>` : ''}
                        </div>
                        <div class="total-val ${d.total > 0 ? 'total-green' : 'total-gray'}" id="total-${key}">
                            ${fPrice(d.total)}
                        </div>
                    </div>
                    <div class="item-actions">
                        <a class="btn-edit" href="../compte/releve.html?c=${encodeURIComponent(key)}" title="Relevé de compte (factures, paiements, ajustements)">
                            <i class="fas fa-file-invoice"></i>
                        </a>
                        ${checkboxHtml}
                    </div>
                </div>`;
            listContainer.appendChild(div);
        });

        // ── Mise à jour du filtre agents ──
        const releveurSelect = document.getElementById('releveurFilter');
        const current = releveurSelect.value;
        // ✅ CORRECTION v5 : échappement XSS du nom d'agent (donnée Firebase) via
        //    window.escHtml (security.js), et construction en une seule affectation
        //    (évite le reparse DOM à chaque itération avec innerHTML +=).
        const escOpt = window.escHtml || (s => String(s == null ? '' : s));
        let optionsHtml = '<option value="">Tous les agents</option>';
        agentsMap.forEach((name, id) => {
            optionsHtml += `<option value="${escOpt(id)}">👤 ${escOpt(String(name).toUpperCase())}</option>`;
        });
        releveurSelect.innerHTML = optionsHtml;
        releveurSelect.value = current;

        window.filterList();
        updateBanner();
        renderArrearsInfo(ledger, currentKeys);
    }

    // Contrôle sous le total : arriérés et avances de la liste affichée + dettes du grand livre
    // portées par des compteurs absents de la liste (elles n'apparaissent sur aucune facture).
    function renderArrearsInfo(ledger, currentKeys) {
        const el = document.getElementById('prevArrearsInfo');
        if (!el) return;
        const list = Object.values(dataCache);
        const total = list.reduce((a, d) => a + (d.arrieres || 0), 0);
        const av = list.reduce((a, d) => a + (d.avance || 0), 0);
        const n = list.filter(d => d.arrieres > 0).length;
        if (!ledger) {
            el.textContent = window.ComptaUI.isMigrated()
                ? `Archive antérieure à la comptabilité — arriérés reconstitués : ${fPrice(total)} sur ${n} compteur(s).`
                : `Arriérés reconstitués depuis les archives (comptabilité non encore initialisée) : ${fPrice(total)} sur ${n} compteur(s).`;
            return;
        }
        let txt = `Arriérés (factures échues non réglées) : ${fPrice(total)} sur ${n} compteur(s)` + (av > 0 ? ` · Avances : ${fPrice(av)}.` : '.');
        const S = window.ComptaUI.getState();
        const orphelins = {};
        Object.values(S.factures).forEach(f => {
            if (currentKeys[f.compteur_id]) return;
            const st = window.Compta.factureState(S, f);
            if (st.reste_a_payer > 0) orphelins[f.compteur_id] = (orphelins[f.compteur_id] || 0) + st.reste_a_payer;
        });
        const ids = Object.keys(orphelins);
        if (ids.length) {
            const sum = ids.reduce((a, k) => a + orphelins[k], 0);
            txt += ` ⚠️ ${ids.length} compteur(s) absent(s) de cette liste portent encore ${fPrice(sum)} d'arriérés.`;
        }
        el.textContent = txt;
    }

    // ══════════════════════════════════════════
    // TRI, FILTRES, TOTAL À PAYER
    // ══════════════════════════════════════════

    // Réordonne les cartes dans le DOM selon le tri choisi (aucune donnée
    // recalculée, juste un déplacement des noeuds déjà en place).
    function applySort(listContainer) {
        const sortBy = document.getElementById('sortSelect').value;
        if (sortBy === 'none') return;
        const items = Array.from(listContainer.querySelectorAll('.facture-item'));
        const cmp = {
            'total-desc': (a, b) => parseFloat(b.getAttribute('data-total')) - parseFloat(a.getAttribute('data-total')),
            'total-asc':  (a, b) => parseFloat(a.getAttribute('data-total')) - parseFloat(b.getAttribute('data-total')),
            'name-asc':   (a, b) => a.getAttribute('data-name').localeCompare(b.getAttribute('data-name')),
            'zone-asc':   (a, b) => a.getAttribute('data-zone').localeCompare(b.getAttribute('data-zone')),
        }[sortBy];
        if (!cmp) return;
        items.sort(cmp).forEach(el => listContainer.appendChild(el));
    }

    window.filterList = function() {
        const searchEl = document.getElementById('searchInput');
        const relEl    = document.getElementById('releveurFilter');
        const listContainer = document.getElementById('list-container');
        const q   = searchEl.value.toLowerCase();
        const sel = relEl.value;
        // ✅ v2 : feedback visuel qu'un filtre est appliqué (contour bleu),
        // absent jusqu'ici — on ne voyait pas si "Tous les agents" avait été
        // changé pour un agent précis.
        searchEl.classList.toggle('filter-active', q.trim() !== '');
        relEl.classList.toggle('filter-active', sel !== '');

        applySort(listContainer);

        // ✅ v6 : le "Total à recouvrer" et les compteurs À jour/Arriéré/Impayé
        // reflètent toujours la liste FILTRÉE affichée à l'écran, jamais un
        // total figé au chargement — sinon le chiffre devient trompeur dès
        // qu'on cherche un nom ou un agent précis.
        let visibleCount = 0, sumTotal = 0, nAjour = 0, nArriere = 0, nImpaye = 0;
        listContainer.querySelectorAll('.facture-item').forEach(it => {
            const mText = it.getAttribute('data-search').includes(q);
            const mRel  = sel === "" || it.getAttribute('data-releveur') === sel;
            const show  = mText && mRel;
            it.style.display = show ? 'flex' : 'none';
            if (!show) return;
            visibleCount++;
            const d = dataCache[it.getAttribute('data-id')];
            if (!d) return;
            sumTotal += d.total;
            const chip = window.billStatusChip(d);
            if (chip.cls === 'chip-ajour') nAjour++;
            else if (chip.cls === 'chip-arriere') nArriere++;
            else nImpaye++;
        });

        document.getElementById('resultCount').textContent = `${visibleCount} résultat(s)`;
        document.getElementById('summaryTotal').textContent = fPrice(sumTotal);
        document.getElementById('countAjour').textContent   = nAjour;
        document.getElementById('countArriere').textContent = nArriere;
        document.getElementById('countImpaye').textContent  = nImpaye;

        window.updateSelectionBar();
    };

    window.toggleAll = function(src) {
        document.querySelectorAll('.facture-item').forEach(it => {
            if (it.style.display !== 'none') {
                const cb = it.querySelector('.bill-cb');
                if (cb) cb.checked = src.checked;
            }
        });
        window.updateSelectionBar();
    };

    // ══════════════════════════════════════════
    // SÉLECTION → BARRE D'ACTION FIXE
    // ══════════════════════════════════════════
    // ✅ La sélection est persistante : elle compte TOUTES les cases cochées,
    // y compris celles actuellement masquées par un filtre/une recherche —
    // filtrer pour cocher plusieurs zones l'une après l'autre ne fait jamais
    // perdre les cases déjà cochées ailleurs.
    window.updateSelectionBar = function() {
        const checked = Array.from(document.querySelectorAll('.bill-cb:checked'));
        const count = checked.length;
        const total = checked.reduce((sum, cb) => sum + (dataCache[cb.getAttribute('data-id')]?.total || 0), 0);

        document.getElementById('abCount').textContent = count === 1 ? '1 facture' : `${count} factures`;
        document.getElementById('abTotal').textContent = fPrice(total);

        document.getElementById('actionBar').classList.toggle('visible', count > 0);
        document.body.classList.toggle('has-selection', count > 0);
    };

    // ══════════════════════════════════════════
    // GÉNÉRATION DES PAGES D'IMPRESSION
    // ══════════════════════════════════════════
    window.renderPrint = function() {
        const printZone = document.getElementById('print-zone');
        let html = "";

        // ✅ Sélection persistante : on imprime TOUT ce qui est coché, même
        // les factures actuellement masquées par la recherche/le filtre
        // agent — sinon changer de filtre après avoir coché ferait perdre
        // silencieusement des factures de l'impression.
        document.querySelectorAll('.bill-cb:checked').forEach(box => {
            const d   = dataCache[box.getAttribute('data-id')];
            const isOnlyArrieres = (d.montantMois === 0 && d.arrieres > 0);
            const dates = formatSmartDates(d.date, currentSelectedMonth, isOnlyArrieres);

            html += `
            <div class="invoice-page">
                <div class="p-header">Forage ${forageVillage} 🚰${forageTelephone ? '<br>' + esc(forageTelephone) : ''}</div>
                <div class="section-title">Période de consommation</div>
                <div class="info-box">
                    <div class="p-row"><span>DU : <strong>${dates.debut}</strong></span><span>AU : <strong>${dates.fin}</strong></span></div>
                </div>
                <div class="section-title">Détails du client</div>
                <div class="info-box">
                    <div class="p-row"><span>Numéro Compteur</span><span>Compteur N°${esc(d.numero_compteur) || "N/A"}</span></div>
                    <div class="p-row"><span>Prénom/Nom</span><span>${esc(d.name)}</span></div>
                    <div class="p-row"><span>Adresse</span><span>${esc(d.zone) || forageVillage}</span></div>
                </div>
                <div class="section-title">Détails consommation</div>
                <div class="info-box">
                    <div class="p-row"><span>Dernier index</span><span>${esc(d.last_index)} m³</span></div>
                    <div class="p-row"><span>Nouvel index</span><span>${esc(d.new_index)} m³</span></div>
                    <div class="p-row bold"><span>m³ vendus</span><span>${esc(d.vol)} m³</span></div>
                    <div class="p-row"><span>Prix Unitaire</span><span>${esc(d.facteur || 250)} FCFA</span></div>
                    <div class="p-row"><span>Montant du mois</span><span>${fPrice(d.montantMois)}</span></div>
                    <div class="p-row" style="color:#c53030">
                        <span>Solde antérieur impayé</span>
                        <span>${fPrice(d.arrieres)}</span>
                    </div>
                    ${d.avance > 0 ? `<div class="p-row" style="color:#15803d"><span>Avance déduite</span><span>− ${fPrice(d.avance)}</span></div>` : ''}
                    <div class="p-row bold" style="font-size:22px;border-top:2px solid #000;padding-top:8px;margin-top:5px;">
                        <span>Montant Total à Payer</span><span>${fPrice(d.total)}</span>
                    </div>
                </div>
                <div class="deadline">À payer avant le <strong>${dates.echeance}</strong></div>
                <div class="tresorier">Le trésorier</div>
                <div class="p-dashed">
                    <i class="fas fa-scissors scissors sc-left"></i>
                    <i class="fas fa-scissors scissors sc-right"></i>
                </div>
                <div class="section-title" style="font-size:20px">Reçu de paiement</div>
                <div class="p-row"><span>N° Compteur</span><span>Compteur N°${esc(d.numero_compteur) || "N/A"}</span></div>
                <div class="p-row"><span>Prénom & Nom</span><span>${esc(d.name)}</span></div>
                <div class="footer-line">
                    <div class="p-row"><span>Consommation (${esc(d.vol)} m³)</span><span>${fPrice(d.montantMois)}</span></div>
                    <div class="p-row"><span>Arriérés</span><span>${fPrice(d.arrieres)}</span></div>
                    ${d.avance > 0 ? `<div class="p-row"><span>Avance déduite</span><span>− ${fPrice(d.avance)}</span></div>` : ''}
                    <div class="p-row bold" style="font-size:22px"><span>Total Reçu</span><span>${fPrice(d.total)}</span></div>
                    <div style="font-size:12px;margin-top:5px;opacity:0.7">Date du relevé : ${dates.date_edition}</div>
                </div>
            </div>`;
        });

        printZone.innerHTML = html;
    };

    // ══════════════════════════════════════════
    // APERÇU ET IMPRESSION — toujours liés à la sélection
    // ══════════════════════════════════════════

    // "Aperçu" : construit les pages depuis la sélection courante puis les
    // affiche à l'écran (voir .preview-mode dans le <style>) — aucun contenu
    // dupliqué, #print-zone sert à la fois à l'aperçu et à l'impression réelle.
    window.openPreview = function() {
        const n = document.querySelectorAll('.bill-cb:checked').length;
        if (n === 0) { showToast('Sélectionnez au moins une facture à prévisualiser.', true); return; }
        window.renderPrint();
        document.body.classList.add('preview-mode');
    };

    window.closePreview = function() {
        document.body.classList.remove('preview-mode');
    };

    // "Imprimer" : confirmation explicite du nombre de factures avant
    // d'ouvrir la boîte de dialogue d'impression du navigateur — on ne veut
    // jamais qu'un clic déclenche une impression dont l'ampleur surprend.
    window.confirmPrint = function() {
        const checked = Array.from(document.querySelectorAll('.bill-cb:checked'));
        const n = checked.length;
        if (n === 0) { showToast('Sélectionnez au moins une facture à imprimer.', true); return; }
        const total = checked.reduce((sum, cb) => sum + (dataCache[cb.getAttribute('data-id')]?.total || 0), 0);
        const label = n === 1 ? '1 facture' : `${n} factures`;
        if (!confirm(`Imprimer ${label} ? Total : ${fPrice(total)}`)) return;
        window.renderPrint();
        window.print();
    };

    // ══════════════════════════════════════════
    // DÉMARRAGE — on attend la confirmation Auth
    // ══════════════════════════════════════════
    onAuthStateChanged(auth, (user) => {
        if (user) {
            if (window.AsuforLoader) AsuforLoader.show('Chargement des factures…');
            loadForageBranding();
            // ✅ v7 : grand livre (lecture continue) — re-rendu dès qu'il est chargé ou qu'il change.
            window.ComptaUI.init({ db, ref, get, update, push, onValue, P, session, getUid: () => auth.currentUser && auth.currentUser.uid });
            window.ComptaUI.subscribe((st, mig, ready) => { if (ready && lastSnap) renderData(lastSnap); });
            if (Sync && !window.__impSyncOn) { window.__impSyncOn = true; Sync.init({ db, ref, onValue }); Sync.onResync(resyncAll); }
            initMonthFilter();
        } else {
            // ✅ CORRECTION v4 : nettoyer aussi 'asufor_session' (sinon il reste
            // valide en localStorage alors que le token Firebase a été perdu —
            // désynchronisation à l'origine des écrans d'erreur incompris).
            try { localStorage.removeItem('asufor_session'); } catch(_) {}
            if (window.AsuforLoader) {
                AsuforLoader.fail('Session expirée ou invalide. Reconnexion nécessaire.');
            }
            document.getElementById('list-container').innerHTML =
                "<p style='text-align:center;color:#dc2626;'>⚠️ Session expirée. <a href='../index.html' style='color:#3b82f6'>Reconnectez-vous</a></p>";
        }
    });

</script>
</body>
</html>
