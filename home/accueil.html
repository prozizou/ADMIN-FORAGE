<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ASUFOR">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">

    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUFOR Admin – Accueil</title>
    <style>
        /* ── v2 : tableau de bord sobre "corporate" ──
           • En-tête compact (plus de titre géant chevauchant le bouton thème).
           • Une seule couleur d'accent (bleu) ; le rouge reste réservé à l'action
             destructrice (Réinitialiser), reléguée avec Impression/Déconnexion
             dans une liste "Paramètres" discrète en bas de page.
           • Cartes moins volumineuses (moins de vide), icônes uniformes sur
             fond rond teinté au lieu de gros carrés semi-transparents. */
        :root {
            --bg-color: #1a1e21;
            --text-main: #f1f5f9;
            --text-muted: rgba(241, 245, 249, 0.6);
            --accent-blue: #38bdf8;
            --accent-tint: rgba(56, 189, 248, 0.14);
            --danger: #f87171;
            --glass: rgba(255, 255, 255, 0.055);
            --glass-strong: rgba(255, 255, 255, 0.09);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --text-main: #1e293b;
            --text-muted: rgba(30, 41, 59, 0.58);
            --glass: rgba(255, 255, 255, 0.75);
            --glass-strong: rgba(255, 255, 255, 0.95);
            --glass-border: rgba(15, 23, 42, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .page { width: 100%; max-width: 1100px; }

        /* ── En-tête : une seule ligne, badge de rôle + thème toujours dégagés ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 6px 2px 26px;
        }
        .topbar-id { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
        .brand-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: var(--text-muted);
        }
        .greeting {
            margin: 0;
            font-size: clamp(17px, 4.2vw, 21px);
            font-weight: 600;
            letter-spacing: 0.1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar-actions { display: flex; align-items: center; gap: 10px; flex: none; }

        .role-chip {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            padding: 7px 13px;
            border-radius: 999px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            white-space: nowrap;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            cursor: pointer;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s;
        }
        .icon-btn:hover { background: var(--glass-strong); }

        /* ── Actions principales ── */
        .section-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 4px 4px 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            width: 100%;
        }

        .tile {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .tile:hover {
            background: var(--glass-strong);
            border-color: var(--accent-blue);
            transform: translateY(-3px);
        }

        .icon-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--accent-tint);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
        }
        .icon-circle svg { width: 21px; height: 21px; fill: var(--accent-blue); }

        .tile-label {
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
            color: var(--text-main);
        }

        /* ── Paramètres : liste discrète, hors de la grille d'actions ── */
        .settings {
            width: 100%;
            margin-top: 30px;
        }

        .list-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-radius: 14px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            text-decoration: none;
            color: var(--text-main);
            margin-bottom: 8px;
            transition: background 0.15s ease;
        }
        .list-row:hover { background: var(--glass-strong); }

        .row-icon { width: 18px; height: 18px; flex: none; fill: currentColor; opacity: 0.7; }
        .row-label { flex: 1; font-size: 0.88rem; font-weight: 500; }
        .row-chevron { opacity: 0.3; font-size: 15px; flex: none; }

        .list-row-danger { color: var(--danger); }
        .list-row-danger .row-icon { opacity: 1; }

        /* Masque complètement l'action et retire sa place dans la mise en page,
           pour que le reste se réorganise sans laisser de trou. */
        .restricted {
            display: none !important;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
        }
    </style>
</head>
<body>
    <div class="page">
        <header class="topbar">
            <div class="topbar-id">
                <span class="brand-label">ASUFOR Admin</span>
                <h1 class="greeting" id="welcomeTitle">Bienvenue</h1>
            </div>
            <div class="topbar-actions">
                <span class="role-chip" id="userRoleDisplay">…</span>
                <button class="icon-btn" id="themeBtn" aria-label="Changer le thème" title="Mode clair / sombre">🌓</button>
            </div>
        </header>

        <p class="section-label">Actions principales</p>
        <nav class="grid nav-action-group" aria-label="Menu principal">
            <a href="../agents/agent.html" id="btn-agent" class="tile nav-action">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                </div>
                <span class="tile-label">Ajouter Agent</span>
            </a>

            <a href="../counter/list.html" id="btn-list" class="tile nav-action">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                </div>
                <span class="tile-label">Compteur</span>
            </a>

            <a href="../statistiques/stats.html" id="btn-stats" class="tile nav-action">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
                </div>
                <span class="tile-label">Statistiques</span>
            </a>

            <a href="../rapports/rapports.html" id="btn-rapports" class="tile nav-action">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-5h2v5zm4 0h-2V7h2v10zm4 0h-2v-8h2v8z"/></svg>
                </div>
                <span class="tile-label">Rapports &amp; Bilan</span>
            </a>

            <a href="../anomalies/bugs.html" id="btn-anomalies" class="tile nav-action">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                </div>
                <span class="tile-label">Anomalies</span>
            </a>

            <!-- ✅ Multi-forage (Phase 3) : visible seulement pour un président (son équipe) -->
            <a href="../equipe/equipe.html" id="btn-equipe" class="tile nav-action restricted">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </div>
                <span class="tile-label">Mon équipe</span>
            </a>

            <!-- ✅ Multi-forage (Phase 3) : visible seulement pour le super-admin -->
            <a href="../admin/admin.html" id="btn-superadmin" class="tile nav-action restricted">
                <div class="icon-circle">
                    <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
                </div>
                <span class="tile-label">Super-admin</span>
            </a>
        </nav>

        <section class="settings" aria-label="Paramètres">
            <p class="section-label">Paramètres</p>

            <a href="../impression/impression.html" id="btn-impression" class="list-row nav-action">
                <svg class="row-icon" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                <span class="row-label">Impression</span>
                <span class="row-chevron" aria-hidden="true">›</span>
            </a>

            <a href="../reset/zero.html" id="btn-zero" class="list-row list-row-danger nav-action">
                <svg class="row-icon" viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6z"/></svg>
                <span class="row-label">Réinitialiser</span>
                <span class="row-chevron" aria-hidden="true">›</span>
            </a>

            <a href="#" class="list-row nav-action" id="btn-logout" role="button">
                <svg class="row-icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                <span class="row-label">Déconnexion</span>
            </a>
        </section>
    </div>

    <script src="../security.js"></script>
    <script src="../loader.js"></script>
    <script>
        // ✅ CORRECTION : checkAccess() avant tout
        const session = window.checkAccess(['président', 'secrétaire', 'trésorier']);

        if (session) {
            const role = session.role;
            const cap = role.charAt(0).toUpperCase() + role.slice(1);
            // ✅ v2 : un seul endroit affiche le rôle (le badge) ; le titre ne le répète plus.
            document.getElementById('userRoleDisplay').textContent = cap;
            document.getElementById('welcomeTitle').textContent = 'Bienvenue, ' + cap;

            // ✅ CORRECTION : Restrictions correctement appliquées par rôle
            if (role === 'trésorier') {
                ['btn-agent', 'btn-list', 'btn-impression', 'btn-zero'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.add('restricted');
                });
            }

            if (role === 'secrétaire') {
                const el = document.getElementById('btn-zero');
                if (el) el.classList.add('restricted');
            }

            // Président : accès complet, rien à restreindre + gère son équipe
            if (role === 'président') {
                const el = document.getElementById('btn-equipe');
                if (el) el.classList.remove('restricted');
            }

            // ✅ Multi-forage (Phase 3) : tuile Super-admin réservée à session.isSuperadmin
            if (session.isSuperadmin) {
                const el = document.getElementById('btn-superadmin');
                if (el) el.classList.remove('restricted');

                // ✅ Le super-admin ne gère pas un forage précis : seuls le menu
                // super-admin, les statistiques et les rapports & bilan ont un sens
                // pour lui. On masque tout le reste (y compris ce qu'un président
                // verrait normalement), à l'exception de la déconnexion.
                const allowed = ['btn-superadmin', 'btn-stats', 'btn-rapports', 'btn-logout'];
                document.querySelectorAll('.nav-action').forEach(action => {
                    if (!allowed.includes(action.id)) action.classList.add('restricted');
                });
            }
        }

        // Thème persistant
        (function applyTheme() {
            const saved = localStorage.getItem('asufor-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        document.getElementById('themeBtn').addEventListener('click', function () {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('asufor-theme', next);
        });

        // Déconnexion avec confirmation
        document.getElementById('btn-logout').addEventListener('click', function (e) {
            e.preventDefault();
            if (confirm('Voulez-vous vraiment vous déconnecter ?')) {
                window.logout();
            }
        });
    </script>
</body>
</html>
