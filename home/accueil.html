<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ASUFOR">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">

    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUFOR Admin – Accueil</title>
    <style>
        :root {
            --bg-color: #1a1e21;
            --text-main: #dfe6e9;
            --accent-blue: #38bdf8;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glow: rgba(56, 189, 248, 0.15);
        }
        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --text-main: #2d3436;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(200, 200, 200, 0.5);
            --glow: rgba(0, 0, 0, 0.05);
        }

        body {
            background: radial-gradient(circle at top right, #2d3436, var(--bg-color));
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .bg-blob {
            position: fixed;
            width: 300px;
            height: 300px;
            background: var(--accent-blue);
            filter: blur(100px);
            opacity: 0.15;
            z-index: -1;
            border-radius: 50%;
            pointer-events: none;
        }

        .header { text-align: center; margin-bottom: 40px; margin-top: 20px; }
        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; margin-top: 0; }
        .subtitle { opacity: 0.6; font-size: 0.9rem; text-transform: uppercase; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1200px;
            padding-bottom: 60px;
        }

        .glass-btn {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .glass-btn:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 15px 35px var(--glow);
            transform: translateY(-5px);
        }

        .icon-box {
            width: 45px;
            height: 45px;
            margin-bottom: 12px;
            fill: var(--accent-blue);
            filter: drop-shadow(0 0 8px rgba(56,189,248,0.3));
        }

        .btn-label {
            font-weight: 500;
            font-size: 0.95rem;
            text-align: center;
        }

        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            font-size: 20px;
            transition: background 0.3s;
        }

        /* Masque complètement la tuile et retire sa place dans la grille,
           pour que les autres cartes se réorganisent sans laisser de trou. */
        .restricted {
            display: none !important;
        }

        @media (min-width: 768px) {
            .grid { grid-template-columns: repeat(3, 1fr); gap: 30px; }
        }
    </style>
</head>
<body>
    <div class="bg-blob" style="top: -50px; left: -50px;"></div>
    <div class="bg-blob" style="bottom: 50px; right: -50px; background: #60efff;"></div>

    <button class="theme-switch" id="themeBtn" aria-label="Changer le thème" title="Mode clair / sombre">🌓</button>

    <div class="header">
        <h1 id="welcomeTitle">ASUFOR Admin</h1>
        <div class="subtitle" id="userRoleDisplay">Chargement...</div>
    </div>

    <nav class="grid" aria-label="Menu principal">
        <a href="../agents/agent.html" id="btn-agent" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <span class="btn-label">Ajouter Agent</span>
        </a>

        <a href="../counter/list.html" id="btn-list" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            </div>
            <span class="btn-label">Compteur</span>
        </a>

        <a href="../statistiques/stats.html" id="btn-stats" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
            </div>
            <span class="btn-label">Statistiques</span>
        </a>

        <a href="../rapports/rapports.html" id="btn-rapports" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-5h2v5zm4 0h-2V7h2v10zm4 0h-2v-8h2v8z"/></svg>
            </div>
            <span class="btn-label">Rapports &amp; Bilan</span>
        </a>

        <a href="../impression/impression.html" id="btn-impression" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
            </div>
            <span class="btn-label">Impression</span>
        </a>

        <a href="../reset/zero.html" id="btn-zero" class="glass-btn" style="border-color: rgba(255, 99, 132, 0.2);">
            <div class="icon-box" style="fill: #ff6b81;">
                <svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6z"/></svg>
            </div>
            <span class="btn-label" style="color: #ff6b81;">Réinitialiser</span>
        </a>

        <a href="../anomalies/bugs.html" id="btn-anomalies" class="glass-btn" style="border-color: rgba(251, 191, 36, 0.3);">
            <div class="icon-box" style="fill: #fbbf24; filter: drop-shadow(0 0 8px rgba(251,191,36,0.4));">
                <svg viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
            </div>
            <span class="btn-label" style="color: #fbbf24;">Anomalies</span>
        </a>

        <!-- ✅ Multi-forage (Phase 3) : visible seulement pour un président (son équipe) -->
        <a href="../equipe/equipe.html" id="btn-equipe" class="glass-btn restricted" style="border-color: rgba(56, 189, 248, 0.3);">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            </div>
            <span class="btn-label">Mon équipe</span>
        </a>

        <!-- ✅ Multi-forage (Phase 3) : visible seulement pour le super-admin -->
        <a href="../admin/admin.html" id="btn-superadmin" class="glass-btn restricted" style="border-color: rgba(168, 85, 247, 0.3);">
            <div class="icon-box" style="fill: #a855f7; filter: drop-shadow(0 0 8px rgba(168,85,247,0.4));">
                <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            </div>
            <span class="btn-label" style="color: #a855f7;">Super-admin</span>
        </a>

        <a href="#" class="glass-btn" id="btn-logout" role="button">
            <div class="icon-box" style="fill: #ff6b81;">
                <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
            </div>
            <span class="btn-label">Déconnexion</span>
        </a>
    </nav>

    <script src="../security.js"></script>
    <script src="../loader.js"></script>
    <script>
        // ✅ CORRECTION : checkAccess() avant tout
        const session = window.checkAccess(['président', 'secrétaire', 'trésorier']);

        if (session) {
            const role = session.role;
            const cap = role.charAt(0).toUpperCase() + role.slice(1);
            document.getElementById('userRoleDisplay').textContent = 'Session : ' + cap;
            document.getElementById('welcomeTitle').textContent = 'Bienvenue ' + cap;

            // ✅ CORRECTION : Restrictions correctement appliquées par rôle
            if (role === 'trésorier') {
                ['btn-agent', 'btn-list', 'btn-impression', 'btn-zero'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.classList.add('restricted');
                });
            }

            if (role === 'secrétaire') {
                const el = document.getElementById('btn-zero');
                if (el) el.classList.add('restricted');
            }

            // Président : accès complet, rien à restreindre + gère son équipe
            if (role === 'président') {
                const el = document.getElementById('btn-equipe');
                if (el) el.classList.remove('restricted');
            }

            // ✅ Multi-forage (Phase 3) : tuile Super-admin réservée à session.isSuperadmin
            if (session.isSuperadmin) {
                const el = document.getElementById('btn-superadmin');
                if (el) el.classList.remove('restricted');

                // ✅ Le super-admin ne gère pas un forage précis : seuls le menu
                // super-admin, les statistiques et les rapports & bilan ont un sens
                // pour lui. On masque tout le reste (y compris ce qu'un président
                // verrait normalement), à l'exception de la déconnexion.
                const allowed = ['btn-superadmin', 'btn-stats', 'btn-rapports', 'btn-logout'];
                document.querySelectorAll('.grid .glass-btn').forEach(tile => {
                    if (!allowed.includes(tile.id)) tile.classList.add('restricted');
                });
            }
        }

        // Thème persistant
        (function applyTheme() {
            const saved = localStorage.getItem('asufor-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', saved);
        })();

        document.getElementById('themeBtn').addEventListener('click', function () {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('asufor-theme', next);
        });

        // Déconnexion avec confirmation
        document.getElementById('btn-logout').addEventListener('click', function (e) {
            e.preventDefault();
            if (confirm('Voulez-vous vraiment vous déconnecter ?')) {
                window.logout();
            }
        });
    </script>
</body>
</html>
