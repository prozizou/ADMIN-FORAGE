<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="manifest" href="../manifest.json">
<script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asufor Admin - Installation Compteur</title>
    
    <style>
        :root {
            --primary: #2563eb; 
            --bg-dark: #0f172a; 
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: white;
            padding: 20px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h2 { text-align: center; margin: 0 0 30px 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; }

        .input-layout {
            position: relative; border: 1px solid var(--border); border-radius: 8px;
            padding: 14px 16px; margin-bottom: 20px; transition: all 0.2s ease;
            background: rgba(0, 0, 0, 0.2);
        }

        .input-layout:focus-within { border-color: var(--primary); background: rgba(37, 99, 235, 0.05); }

        .input-layout label {
            position: absolute; top: -9px; left: 12px; background: #151f32; 
            padding: 0 6px; font-size: 11px; text-transform: uppercase;
            letter-spacing: 0.05em; color: var(--primary); font-weight: 700;
        }

        select, input {
            width: 100%; background: transparent; border: none;
            color: #f8fafc; font-size: 15px; outline: none;
        }

        option { background: #1e293b; color: white; }

        #btnSubmit {
            width: 100%; padding: 16px; background: var(--primary); border: none;
            border-radius: 8px; color: white; font-weight: 600; font-size: 15px;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            margin-top: 10px; transition: opacity 0.2s;
        }

        #btnSubmit:hover { opacity: 0.9; }
        #btnSubmit:disabled { background: #334155; cursor: not-allowed; }

        .spinner {
            width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin-right: 12px; display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 380px) {
            .card { padding: 25px 15px; }
            h2 { font-size: 1.2rem; }
        }
        @media (min-width: 1400px) { 
            .card { max-width: 600px; padding: 60px; }
            h2 { font-size: 2.5rem; }
            input, select, #btnSubmit { font-size: 1.2rem; padding: 10px; }
            .input-layout { padding: 20px; }
            .input-layout label { font-size: 0.9rem; top: -12px; }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Installation Compteur</h2>

    <div class="input-layout">
        <label>Agent Responsable</label>
        <select id="agentSelect">
            <option value="">Chargement...</option>
        </select>
    </div>

    <div class="input-layout">
        <label>Nom du propriétaire</label>
        <input type="text" id="ownerName" placeholder="ex: Amadou Bâ">
    </div>

    <div class="input-layout">
        <label>Numéro téléphone</label>
        <input type="tel" id="ownerPhone" placeholder="ex: 77#######">
    </div>

    <div class="input-layout">
        <label>Index de départ</label>
        <input type="number" id="startIndex" placeholder="0">
    </div>

    <div class="input-layout">
        <label>Prix du m³ (CFA)</label>
        <input type="number" id="pricePerCube" value="250">
    </div>

    <button id="btnSubmit" onclick="enregistrer()">
        <div class="spinner" id="loader"></div>
        <span id="btnText">ENREGISTRER</span>
    </button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAKC7lrKSCFwfuoXASvX-yYIGneLXInvDk",
        authDomain: "asufor-67a06.firebaseapp.com",
        databaseURL: "https://asufor-67a06-default-rtdb.firebaseio.com",
        projectId: "asufor-67a06"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app); // Requis pour valider la lecture des agents et l'écriture du compteur

    const agentsRef = ref(db, 'db_agents');
    onValue(agentsRef, (snapshot) => {
        const select = document.getElementById('agentSelect');
        select.innerHTML = '<option value="">Choisir un agent</option>';
        snapshot.forEach((child) => {
            const d = child.val();
            const opt = document.createElement('option');
            opt.value = JSON.stringify({
                id: d['agent id'] || child.key,
                name: d.agent,
                tel: d.agent_tel,
                siege: d.siege || "DIANDIOLY"
            });
            opt.textContent = d.agent;
            select.appendChild(opt);
        });
    });

    window.enregistrer = async function() {
        const agentRaw = document.getElementById('agentSelect').value;
        const owner = document.getElementById('ownerName').value.trim();
        const phone = document.getElementById('ownerPhone').value.trim();
        const start = document.getElementById('startIndex').value;
        const price = document.getElementById('pricePerCube').value;

        if (!agentRaw || !owner || !start) return alert("Veuillez remplir les champs obligatoires.");

        const agent = JSON.parse(agentRaw);
        const btn = document.getElementById('btnSubmit');
        const loader = document.getElementById('loader');

        btn.disabled = true;
        loader.style.display = "block";

        const payload = {
            agent_id: agent.id,
            agent_name: agent.name,
            agent_tel: agent.tel,
            siege: agent.siege,
            name: owner,
            tel: phone,
            last_index: start.toString(),
            new_index: parseInt(start),
            facteur: price,
            diff: "0", 
            date_paiement: new Date().toISOString(),
            statut: "true",
            facture: "false",
            print: "false"
        };

        try {
            await push(ref(db, 'asufor_db_diandioly'), payload);
            alert("Compteur enregistré avec succès dans Diandioly !");
            document.getElementById('ownerName').value = "";
            document.getElementById('ownerPhone').value = "";
            document.getElementById('startIndex').value = "";
        } catch (e) {
            alert("Erreur : " + e.message);
        } finally {
            btn.disabled = false;
            loader.style.display = "none";
        }
    }
</script>
</body>
</html>
