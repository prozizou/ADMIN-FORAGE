<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#f8fafc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Satigué Eau">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">

    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satigué Eau Admin – Installation Compteur</title>

    <script src="../security.js"></script>
    <!-- ✅ Overlay de chargement partagé -->
    <script src="../loader.js"></script>
    <!-- ✅ Cache local des données (affichage instantané + restauration entre sessions) -->
    <script src="../data-cache.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="../firebase-config.js"></script>
    <!-- ✅ Multi-forage : résolution des chemins (mode legacy = chemins actuels) -->
    <script src="../admin-config.js"></script>
    <script src="../forage-context.js"></script>
    <!-- ✅ Vue à 360° super-admin : sélecteur de village -->
    <script src="../superadmin-village.js"></script>

    <style>
        :root {
            --primary:    #2563eb;
            --bg-dark:    #f0f2f5;
            --glass:      #ffffff;
            --border:     rgba(15, 23, 42, 0.1);
            --text-muted: #64748b;
            --error:      #dc2626;
            --success:    #16a34a;
        }

        body {
            background-color: var(--bg-dark);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #1e293b;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.1);
        }

        .brand-logo {
            display: block;
            width: 48px;
            height: 48px;
            margin: 0 auto 10px;
        }

        h2 {
            text-align: center;
            margin: 0 0 30px 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .input-layout {
            position: relative;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            margin-bottom: 20px;
            transition: all 0.2s ease;
            background: rgba(15, 23, 42, 0.03);
        }

        .input-layout:focus-within {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .input-layout.error { border-color: var(--error); }

        .input-layout label {
            position: absolute;
            top: -9px;
            left: 12px;
            background: var(--glass);
            padding: 0 6px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
            font-weight: 700;
        }

        select, input {
            width: 100%;
            background: transparent;
            border: none;
            color: #1e293b;
            font-size: 15px;
            outline: none;
        }

        option { background: #ffffff; color: #1e293b; }

        #btnSubmit {
            width: 100%;
            padding: 16px;
            background: var(--primary);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            transition: opacity 0.2s;
            gap: 10px;
        }

        #btnSubmit:hover:not(:disabled) { opacity: 0.9; }
        #btnSubmit:disabled { background: #94a3b8; cursor: not-allowed; }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.35);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #msg {
            text-align: center;
            font-size: 0.85rem;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 600;
        }
        .msg-error   { color: var(--error); }
        .msg-success { color: var(--success); }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(30, 41, 59, 0.5);
            text-decoration: none;
            font-size: 0.8rem;
        }
        .footer-link:hover { color: #0284c7; }

        @media (max-width: 380px) {
            .card { padding: 25px 15px; }
            h2 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="card">
    <img class="brand-logo" src="../icons/logo.png" alt="Satigué Eau">
    <h2>📟 Installation Compteur</h2>

    <div class="input-layout" id="wrap-agent">
        <label>Agent Responsable</label>
        <select id="agentSelect" aria-label="Sélectionner un agent responsable">
            <option value="">Chargement des agents...</option>
        </select>
    </div>

    <div class="input-layout" id="wrap-owner">
        <label>Nom du propriétaire</label>
        <input type="text" id="ownerName" placeholder="ex: Amadou Bâ" autocomplete="off" maxlength="100">
    </div>

    <div class="input-layout" id="wrap-index">
        <label>Index de départ</label>
        <input type="number" id="startIndex" placeholder="0" min="0">
    </div>

    <div class="input-layout">
        <label>Prix du m³ (CFA)</label>
        <input type="number" id="pricePerCube" value="250" min="1">
    </div>

    <button id="btnSubmit" onclick="enregistrer()">
        <div class="spinner" id="loader"></div>
        <span id="btnText">ENREGISTRER</span>
    </button>

    <div id="msg"></div>
    <a href="../home/accueil.html" class="footer-link">← Retourner à l'accueil</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildChanged, onChildRemoved, get, runTransaction } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // ✅ Vérification d'accès
    const session = window.checkAccess(['président', 'secrétaire']);
    if (!session) throw new Error('Accès refusé');

    const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;

    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const auth = getAuth(app);
    // ✅ Chemins Firebase du forage courant, résolus dynamiquement (namespacé Asufor/{forageKey}/…)
    const P = window.ForageContext.paths();

    // ✅ Vue à 360° super-admin : sélecteur de village (aucun effet pour les autres rôles)
    if (window.SuperadminVillage) window.SuperadminVillage.init({ db, get, ref, session });

    // ✅ Repli du siège pour les agents legacy sans champ `siege`, dérivé du forage
    // réel (Asufor/{forageKey}/config.siege) plutôt que "DIANDIOLY" en dur.
    let forageSiege = 'SATIGUE EAU';
    async function loadForageSiege() {
        try {
            const cfgSnap = await get(ref(db, P.config));
            const cfg = cfgSnap.exists() ? cfgSnap.val() : {};
            forageSiege = (cfg.siege || cfg.nom || 'SATIGUE EAU').toUpperCase();
        } catch (_) { /* garde le repli générique */ }
    }

    const msgEl  = document.getElementById('msg');
    const btn    = document.getElementById('btnSubmit');
    const loader = document.getElementById('loader');
    const btnTxt = document.getElementById('btnText');

    function showMsg(text, isError = false) {
        msgEl.textContent = text;
        msgEl.className = isError ? 'msg-error' : 'msg-success';
    }

    function clearErrors() {
        document.querySelectorAll('.input-layout.error').forEach(el => el.classList.remove('error'));
    }

    function markError(wrapId) {
        const el = document.getElementById(wrapId);
        if (el) el.classList.add('error');
    }

    // ✅ CORRECTION : la lecture de 'db_agents' doit ATTENDRE la restauration du
    //    jeton Firebase. Sinon elle part avec auth == null → permission_denied
    //    (les règles exigent auth != null) et le menu reste bloqué sur
    //    « Chargement des agents… » sans aucune erreur visible.
    if (window.AsuforLoader) AsuforLoader.show('Connexion sécurisée…');

    let storeAgents = {};
    const agentsCacheKey = 'agents:' + P.agents;

    function renderAgentOptions() {
        const select = document.getElementById('agentSelect');
        const activeValue = select.value;
        const keys = Object.keys(storeAgents);
        select.innerHTML = '';
        if (keys.length === 0) {
            select.innerHTML = '<option value="">Aucun agent trouvé</option>';
            return;
        }
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Choisir un agent';
        select.appendChild(placeholder);
        keys.forEach((key) => {
            const d = storeAgents[key] || {};
            const opt = document.createElement('option');
            // ✅ CORRECTION : Utiliser la clé Firebase comme id (cohérent avec le reste de l'app)
            opt.value = JSON.stringify({
                id:    key,
                name:  d.agent || 'Agent',
                tel:   d.agent_tel || '',
                siege: d.siege || forageSiege,
                zone:  d.zone || ''
            });
            opt.textContent = (d.agent || 'Agent').toUpperCase() + (d.zone ? ' – ' + d.zone : '');
            select.appendChild(opt);
        });
        if (activeValue) select.value = activeValue;
    }

    // ✅ Chargement INSTANTANÉ : une copie locale (session précédente ou
    // dernier chargement) s'affiche tout de suite, sans attendre le réseau.
    // ✅ Rafraîchissement CIBLÉ : une fois la liste chargée, un agent
    // ajouté/modifié/supprimé ne renvoie et ne retraite plus que CET agent
    // (au lieu de renvoyer toute la liste au moindre changement).
    async function loadAgents() {
        const cached = window.AsuforCache ? window.AsuforCache.read(agentsCacheKey) : null;
        if (cached && typeof cached === 'object') {
            storeAgents = cached;
            renderAgentOptions();
            if (window.AsuforLoader) AsuforLoader.hide();
        } else {
            if (window.AsuforLoader) AsuforLoader.update('Chargement des agents…');
        }

        const agentsRef = ref(db, P.agents);
        try {
            const snap = await get(agentsRef);
            storeAgents = snap.val() || {};
            if (window.AsuforCache) window.AsuforCache.write(agentsCacheKey, storeAgents);
            renderAgentOptions();
            if (window.AsuforLoader) AsuforLoader.hide();
        } catch (err) {
            console.error('Firebase db_agents :', err.code, err.message);
            if (!cached && window.AsuforLoader) {
                AsuforLoader.fail('Impossible de charger les agents (' + err.code + '). Session peut-être expirée.', {
                    retry: loadAgents
                });
            }
            return;
        }

        onChildAdded(agentsRef, (snap) => {
            if (Object.prototype.hasOwnProperty.call(storeAgents, snap.key)) return;
            storeAgents[snap.key] = snap.val();
            if (window.AsuforCache) window.AsuforCache.write(agentsCacheKey, storeAgents);
            renderAgentOptions();
        });
        onChildChanged(agentsRef, (snap) => {
            storeAgents[snap.key] = snap.val();
            if (window.AsuforCache) window.AsuforCache.write(agentsCacheKey, storeAgents);
            renderAgentOptions();
        });
        onChildRemoved(agentsRef, (snap) => {
            delete storeAgents[snap.key];
            if (window.AsuforCache) window.AsuforCache.write(agentsCacheKey, storeAgents);
            renderAgentOptions();
        });
    }

    // On attend la confirmation du jeton Firebase avant toute lecture.
    onAuthStateChanged(auth, (user) => {
        if (user) {
            loadForageSiege();
            loadAgents();
        } else if (window.AsuforLoader) {
            AsuforLoader.fail('Session expirée ou invalide. Reconnexion nécessaire.');
        }
    });

    window.enregistrer = async function () {
        clearErrors();

        const agentRaw  = document.getElementById('agentSelect').value;
        const owner     = document.getElementById('ownerName').value.trim();
        const start     = document.getElementById('startIndex').value;
        const price     = document.getElementById('pricePerCube').value;

        let valid = true;
        if (!agentRaw)  { markError('wrap-agent');   valid = false; }
        if (!owner)     { markError('wrap-owner');   valid = false; }
        if (!start)     { markError('wrap-index');   valid = false; }

        if (!valid) { showMsg('Veuillez remplir les champs obligatoires.', true); return; }

        let agent;
        try { agent = JSON.parse(agentRaw); }
        catch { showMsg('Agent invalide.', true); return; }

        btn.disabled = true;
        loader.style.display = 'block';
        btnTxt.textContent = 'Enregistrement...';
        showMsg('');

        // Attendre l'auth Firebase
        await new Promise((resolve) => {
            const unsub = onAuthStateChanged(auth, (user) => { unsub(); resolve(user); });
        });

        // ✅ CORRECTION v4 : Numérotation atomique via transaction Firebase.
        //    Le compteur d'index est stocké dans Asufor/{key}/config/next_counter_number.
        //    La transaction garantit qu'aucune collision ne peut survenir en cas
        //    d'écritures concurrentes.
        let compteur;
        try {
            const counterRef = ref(db, P.config + '/next_counter_number');
            const txResult = await runTransaction(counterRef, (current) => {
                const next = (typeof current === 'number' && current > 0) ? current : 1;
                return next + 1;
            });
            if (!txResult.committed) {
                throw new Error('La transaction a été annulée.');
            }
            compteur = String(txResult.snapshot.val() - 1); // on retourne l'ancienne valeur
        } catch (e) {
            console.error('Transaction de numérotation échouée :', e);
            showMsg('Erreur : impossible de calculer le numéro de compteur.', true);
            btn.disabled = false;
            loader.style.display = 'none';
            btnTxt.textContent = 'ENREGISTRER';
            return;
        }

        const payload = {
            agent_id:        agent.id,
            agent_name:      agent.name,
            agent_tel:       agent.tel,
            siege:           agent.siege,
            zone:            agent.zone || '',
            name:            owner,
            numero_compteur: compteur,
            last_index:      String(start),
            new_index:       parseInt(start) || 0,
            facteur:         parseInt(price) || 250,
            diff:            "0",
            date_paiement:   new Date().toISOString(),
            statut:          "false",
            status:          "impaye",
            facture:         "false",
            print:           "false"
        };

        try {
            await push(ref(db, P.compteurs), payload);
            showMsg('✅ Compteur n°' + compteur + ' enregistré avec succès !');
            document.getElementById('ownerName').value  = '';
            document.getElementById('startIndex').value = '';
            document.getElementById('agentSelect').value = '';
        } catch (e) {
            console.error('Erreur Firebase :', e);
            showMsg('Erreur : ' + e.message, true);
        } finally {
            btn.disabled = false;
            loader.style.display = 'none';
            btnTxt.textContent = 'ENREGISTRER';
        }
    };
</script>
</body>
</html>
