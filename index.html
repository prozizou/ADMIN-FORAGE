<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ASUFOR">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

    <link rel="manifest" href="manifest.json">
    <script src="pwa.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Accès ASUFOR</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="firebase-config.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-light: #1e293b;
            --bg-accent: #0c4a6e;
            --txt: #f8fafc;
            --blue: #38bdf8;
            --error: #ef4444;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: linear-gradient(-45deg, var(--bg-dark), var(--bg-light), var(--bg-accent), #1a1e21);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--txt);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 32px;
            padding: 35px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60%  { transform: translateX(-8px); }
            40%, 80%  { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
        }

        .header-subtitle {
            opacity: 0.6;
            font-size: 11px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .icon-lock {
            width: 32px;
            height: 32px;
            stroke: var(--blue);
            margin-bottom: 5px;
        }

        .role-selector {
            display: flex;
            gap: 5px;
            background: rgba(0,0,0,0.25);
            padding: 6px;
            border-radius: 50px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border-radius: 50px;
            border: none;
            background: transparent;
            color: var(--txt);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .role-btn.active {
            background: var(--blue);
            color: #000;
            opacity: 1;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            height: 14px;
            align-items: center;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dot.active {
            background: var(--blue);
            box-shadow: 0 0 12px var(--blue);
            transform: scale(1.3);
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .key {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 18px;
            border-radius: 20px;
            color: var(--txt);
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .key:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
        }
        .key:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .key-icon { width: 24px; height: 24px; stroke: currentColor; }

        #status {
            margin-top: 25px;
            font-size: 13px;
            min-height: 20px;
            transition: color 0.3s;
        }

        .status-error   { color: var(--error); }
        .status-success { color: var(--blue); }
        .status-info    { color: #94a3b8; }

        .forgot-link {
            display: inline-block;
            margin-top: 15px;
            font-size: 11px;
            color: var(--txt);
            opacity: 0.5;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .forgot-link:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="card" id="loginCard">
    <svg class="icon-lock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>

    <h2 class="header-title">ASUFOR ADMIN</h2>
    <p class="header-subtitle">Réseau : Forage Diandioly</p>

    <div class="role-selector" role="group" aria-label="Sélection du rôle">
        <button class="role-btn active" onclick="setRole('secrétaire', this)" aria-pressed="true">Secrétaire</button>
        <button class="role-btn" onclick="setRole('président', this)" aria-pressed="false">Président</button>
        <button class="role-btn" onclick="setRole('trésorier', this)" aria-pressed="false">Trésorier</button>
    </div>

    <div class="dots" id="dots" aria-label="Progression du code" role="status">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="keypad" id="keypad">
        <button class="key" onclick="press('1')" aria-label="1">1</button>
        <button class="key" onclick="press('2')" aria-label="2">2</button>
        <button class="key" onclick="press('3')" aria-label="3">3</button>
        <button class="key" onclick="press('4')" aria-label="4">4</button>
        <button class="key" onclick="press('5')" aria-label="5">5</button>
        <button class="key" onclick="press('6')" aria-label="6">6</button>
        <button class="key" onclick="press('7')" aria-label="7">7</button>
        <button class="key" onclick="press('8')" aria-label="8">8</button>
        <button class="key" onclick="press('9')" aria-label="9">9</button>
        <div style="visibility:hidden"></div>
        <button class="key" onclick="press('0')" aria-label="0">0</button>
        <button class="key" onclick="del()" aria-label="Effacer">
            <svg class="key-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
        </button>
    </div>

    <p id="status" role="alert">&nbsp;</p>
    <!-- ✅ CORRECTION : Le lien "Assistance" ne doit pas être un href vide cliquable -->
    <span class="forgot-link" style="cursor:default;">Assistance administrateur</span>
</div>

<script>
    // ✅ CORRECTION MAJEURE : la session locale (localStorage) ne prouve PAS
    //    que le jeton Firebase est valide. Les règles de sécurité n'acceptent
    //    QUE le jeton Firebase (auth != null). Rediriger vers l'accueil sur la
    //    seule foi du localStorage laissait entrer un utilisateur SANS session
    //    Firebase → toutes les lectures échouaient (« Session utilisateur non
    //    valide »). On ne redirige donc plus ici : on se contente de purger une
    //    session locale invalide/expirée. La décision d'entrer dans l'app est
    //    prise par l'observateur onAuthStateChanged (Firebase = source de vérité).
    function localSessionValid() {
        let raw;
        try { raw = localStorage.getItem('asufor_session'); } catch (e) { return false; }
        if (!raw) return false;
        try {
            const s = JSON.parse(raw);
            const SESSION_DURATION_MS = 8 * 60 * 60 * 1000;
            const validRoles = ['président', 'secrétaire', 'trésorier'];
            const ok = s && s.role && validRoles.includes(s.role) &&
                typeof s.time === 'number' &&
                (Date.now() - s.time) < SESSION_DURATION_MS;
            if (!ok) { try { localStorage.removeItem('asufor_session'); } catch (_) {} }
            return ok;
        } catch (e) {
            try { localStorage.removeItem('asufor_session'); } catch (_) {}
            return false;
        }
    }

    const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;
    // ✅ CORRECTION : init défensive. Si la config n'a pas chargé (404) ou si firebase
    // n'est pas disponible, on N'APPELLE PAS firebase.auth() (qui lèverait une exception
    // et interromprait tout le script → erreurs TDZ en cascade sur emailMap/lockUntil).
    // auth reste null et l'UI affiche un message clair au lieu de planter.
    let auth = null;
    if (!firebaseConfig || typeof firebase === 'undefined') {
        console.error('[ASUFOR] firebase-config.js non chargé !');
    } else {
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            // ✅ Persistance LOCALE explicite (défaut, mais on lève tout doute) :
            //    garantit que le jeton Firebase survit à la navigation entre pages.
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
        } catch (e) {
            console.error('[ASUFOR] Échec initialisation Firebase :', e);
        }
    }

    let code = "";
    let role = "secrétaire";
    let isVerifying = false;

    // ✅ Protection brute-force (persistée en sessionStorage pour résister au rechargement)
    let failCount = 0;
    let lockUntil = 0;
    const MAX_FAILS = 5;
    const LOCK_DURATION_MS = 30000; // 30 secondes

    // ✅ CORRECTION : Restauration du verrouillage depuis sessionStorage
    try {
        const stored = JSON.parse(sessionStorage.getItem('asufor_lock') || '{}');
        if (stored.lockUntil && stored.lockUntil > Date.now()) {
            lockUntil = stored.lockUntil;
            failCount = stored.failCount || 0;
        }
    } catch (_) {}

    const statusEl = document.getElementById('status');
    const cardEl   = document.getElementById('loginCard');
    const keypadEl = document.getElementById('keypad');

    // ✅ CORRECTION : Emails définis dans un objet gelé (non modifiable)
    const emailMap = Object.freeze({
        "secrétaire": "secretaire@diandioly.com",
        "président":  "president@diandioly.com",
        "trésorier":  "tresorier@diandioly.com"
    });

    // ✅ CORRECTION : Firebase = source de vérité pour l'accès aux données.
    //  • user + session locale valide → accès confirmé, on entre dans l'app.
    //  • user SANS session locale valide → état incohérent → on déconnecte Firebase.
    //  • pas de user → on purge la session locale « fantôme ».
    //
    //  ⚠️ CORRECTION BOUCLE DE CONNEXION : pendant une connexion en cours
    //     (isVerifying), on NE FAIT RIEN ici. Sinon une condition de course entre
    //     onAuthStateChanged et le .then() de signInWithEmailAndPassword pouvait
    //     déclencher auth.signOut() PUIS purger la session tout juste écrite →
    //     l'accueil ne trouvait plus de session → retour au clavier de code (boucle).
    //     verify() gère lui-même la redirection après une connexion réussie.
    if (auth) auth.onAuthStateChanged((user) => {
        if (isVerifying) return; // connexion en cours : laisser verify() piloter
        if (user) {
            if (localSessionValid()) {
                window.location.replace('home/accueil.html');
            } else {
                auth.signOut().catch(() => {});
            }
        } else {
            try { localStorage.removeItem('asufor_session'); } catch (_) {}
        }
    });

    function setLockState(locked) {
        const keys = keypadEl.querySelectorAll('.key');
        keys.forEach(k => k.disabled = locked);
    }

    function saveLockState() {
        try {
            sessionStorage.setItem('asufor_lock', JSON.stringify({ lockUntil, failCount }));
        } catch(_) {}
    }

    function checkLock() {
        if (Date.now() < lockUntil) {
            const remaining = Math.ceil((lockUntil - Date.now()) / 1000);
            statusEl.textContent = `Trop de tentatives. Attendez ${remaining}s.`;
            statusEl.className = 'status-error';
            setLockState(true);
            return true;
        }
        setLockState(false);
        return false;
    }

    function setRole(newRole, btn) {
        // ✅ CORRECTION : Valider le rôle avant de l'accepter
        const validRoles = Object.keys(emailMap);
        if (!validRoles.includes(newRole)) return;

        role = newRole;
        document.querySelectorAll('.role-btn').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-pressed', 'true');
        code = "";
        statusEl.innerHTML = "&nbsp;";
        statusEl.className = "";
        updateDots();
    }

    function press(n) {
        if (checkLock() || isVerifying) return;
        if (code.length < 6) {
            code += n;
            updateDots();
            if (code.length === 6) verify();
        }
    }

    function del() {
        if (isVerifying) return;
        if (code.length > 0) {
            code = code.slice(0, -1);
            updateDots();
            if (!checkLock()) {
                statusEl.innerHTML = "&nbsp;";
                statusEl.className = "";
            }
        }
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((d, i) => {
            d.classList.toggle('active', i < code.length);
        });
    }

    function verify() {
        if (isVerifying) return;

        // ✅ CORRECTION : si la config Firebase n'a pas chargé, message clair plutôt que crash.
        if (!auth) {
            statusEl.textContent = "⚠️ Configuration non chargée. Rechargez la page.";
            statusEl.className = "status-error";
            code = "";
            updateDots();
            return;
        }

        isVerifying = true;

        statusEl.textContent = "Vérification en cours...";
        statusEl.className = "status-info";
        setLockState(true);

        const email = emailMap[role];
        if (!email) {
            triggerError("Rôle inconnu.");
            return;
        }

        // ✅ CORRECTION : Validation du code avant envoi (6 chiffres uniquement)
        if (!/^\d{6}$/.test(code)) {
            triggerError("Code invalide.");
            return;
        }

        auth.signInWithEmailAndPassword(email, code)
            .then(() => {
                failCount = 0;
                lockUntil = 0;
                saveLockState();
                try {
                    localStorage.setItem('asufor_session', JSON.stringify({
                        role: role,
                        time: Date.now()
                    }));
                } catch(e) {
                    console.error('Impossible de sauvegarder la session :', e);
                }
                statusEl.textContent = "Accès autorisé ✓";
                statusEl.className = "status-success";
                setTimeout(() => window.location.replace('home/accueil.html'), 600);
            })
            .catch((e) => {
                console.error("Authentification échouée :", e.code);
                failCount++;
                saveLockState();

                if (failCount >= MAX_FAILS) {
                    lockUntil = Date.now() + LOCK_DURATION_MS;
                    failCount = 0;
                    saveLockState();
                    statusEl.textContent = "Trop de tentatives. Attendez 30s.";
                    statusEl.className = "status-error";
                    setTimeout(() => {
                        checkLock();
                        code = "";
                        updateDots();
                        isVerifying = false;
                    }, LOCK_DURATION_MS);
                } else {
                    triggerError(`Code incorrect (${failCount}/${MAX_FAILS})`);
                }
            });
    }

    function triggerError(message) {
        statusEl.textContent = message || "Code d'accès incorrect";
        statusEl.className = "status-error";
        cardEl.classList.add('shake');
        setTimeout(() => {
            cardEl.classList.remove('shake');
            code = "";
            updateDots();
            isVerifying = false;
            if (!checkLock()) setLockState(false);
        }, 500);
    }

    // Vérifier le verrouillage au chargement
    checkLock();
</script>
</body>
</html>
