<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ASUFOR">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

    <link rel="manifest" href="manifest.json">
    <script src="pwa.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès ASUFOR</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="firebase-config.js"></script>
    <!-- ✅ Multi-forage : résolution du super-admin (SUPERADMIN_EMAIL, isSuperadmin) -->
    <script src="forage-context.js"></script>

    <style>
        :root {
            --bg-dark: #062f6b;
            --bg-mid: #0d47a1;
            --bg-accent: #0288d1;
            --bg-light: #4fc3f7;
            --txt: #f8fafc;
            --blue: #38bdf8;
            --aqua: #00e5ff;
            --error: #ef4444;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            position: relative;
            background: linear-gradient(-45deg, var(--bg-dark), var(--bg-mid), var(--bg-accent), var(--bg-light));
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--txt);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ── Gouttelettes d'eau tombantes (arrière-plan) ── */
        .droplet {
            position: fixed;
            top: -40px;
            border-radius: 50% 50% 50% 0;
            background: linear-gradient(135deg, rgba(224,247,255,0.9), rgba(56,189,248,0.25));
            box-shadow: 0 0 6px rgba(56,189,248,0.35);
            pointer-events: none;
            z-index: 0;
            animation-name: dropletFall;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        @keyframes dropletFall {
            0%   { transform: translateY(0) rotate(45deg); opacity: 0; }
            8%   { opacity: 0.85; }
            88%  { opacity: 0.85; }
            100% { transform: translateY(112vh) rotate(45deg); opacity: 0; }
        }

        /* ── Vague déferlante (footer) ── */
        .wave-wrap {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 130px;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .wave {
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 200%;
            height: 100%;
        }
        .wave1 { fill: rgba(56, 189, 248, 0.28); animation: waveMove 10s linear infinite; }
        .wave2 { fill: rgba(2, 136, 209, 0.35); animation: waveMove 6.5s linear infinite reverse; }
        @keyframes waveMove {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        @media (prefers-reduced-motion: reduce) {
            .droplet, .wave1, .wave2, body { animation: none !important; }
        }

        .card {
            position: relative;
            z-index: 1;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 32px;
            padding: 35px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60%  { transform: translateX(-8px); }
            40%, 80%  { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
        }

        .header-subtitle {
            opacity: 0.6;
            font-size: 11px;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .icon-lock {
            width: 32px;
            height: 32px;
            stroke: var(--blue);
            margin-bottom: 5px;
        }

        .dots {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 35px;
            height: 16px;
            align-items: center;
        }
        /* Goutte vide : cercle avec un angle relevé en teardrop, tourné à 45°. */
        .dot {
            width: 13px;
            height: 13px;
            border-radius: 50% 50% 50% 0;
            transform: rotate(45deg);
            background: transparent;
            border: 2px solid rgba(255,255,255,0.22);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dot.active {
            background: var(--aqua);
            border-color: var(--aqua);
            box-shadow: 0 0 14px var(--aqua);
            animation: dotFill 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes dotFill {
            0%   { transform: rotate(45deg) scale(0.2); }
            65%  { transform: rotate(45deg) scale(1.35); }
            100% { transform: rotate(45deg) scale(1); }
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .key {
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            padding: 18px;
            border-radius: 20px;
            color: var(--txt);
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .key:active {
            transform: scale(0.92);
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.3);
        }
        .key:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ── Effet de jaillissement au clic (goutte qui éclate) ── */
        .splash {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0,229,255,0.55) 0%, rgba(56,189,248,0.28) 55%, rgba(56,189,248,0) 100%);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            animation: splashOut 0.6s ease-out forwards;
        }
        @keyframes splashOut {
            0%   { transform: translate(-50%, -50%) scale(0); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(2.4); opacity: 0; }
        }

        .key-icon { width: 24px; height: 24px; stroke: currentColor; }

        #status {
            margin-top: 25px;
            font-size: 13px;
            min-height: 20px;
            transition: color 0.3s;
        }

        .status-error   { color: var(--error); }
        .status-success { color: var(--blue); }
        .status-info    { color: #94a3b8; }

        .forgot-link {
            display: inline-block;
            margin-top: 15px;
            font-size: 11px;
            color: var(--txt);
            opacity: 0.5;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .forgot-link:hover { opacity: 1; }

        /* ── Champ identifiant : hexagone étiré avec pointes latérales ── */
        .id-field {
            position: relative;
            margin: 0 auto 26px;
            padding: 13px 30px;
            text-align: left;
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            clip-path: polygon(0% 50%, 5% 0%, 95% 0%, 100% 50%, 95% 100%, 5% 100%);
            transition: border-color 0.2s, background 0.2s;
        }
        .id-field:focus-within {
            background: rgba(255,255,255,0.09);
        }
        .id-label {
            display: block;
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 1.6px;
            opacity: 0.55;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .id-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 0;
            background: transparent;
            border: none;
            color: var(--txt);
            font-size: 14px;
            outline: none;
        }
        .id-field input::placeholder {
            color: rgba(248, 250, 252, 0.45);
        }
    </style>
</head>
<body>

<!-- Gouttelettes tombantes + vague : décor aquatique en arrière-plan -->
<div class="wave-wrap" aria-hidden="true">
    <svg class="wave wave1" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,60 C150,120 350,0 600,60 C850,120 1050,0 1200,60 L1200,120 L0,120 Z"></path>
    </svg>
    <svg class="wave wave2" viewBox="0 0 1200 120" preserveAspectRatio="none">
        <path d="M0,70 C200,10 400,110 600,50 C800,-10 1000,90 1200,40 L1200,120 L0,120 Z"></path>
    </svg>
</div>

<div class="card" id="loginCard">
    <svg class="icon-lock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>

    <h2 class="header-title">ASUFOR ADMIN</h2>
    <p class="header-subtitle">Gestion de forage</p>

    <div class="id-field" id="idField">
        <label class="id-label" for="idInput">Identifiant</label>
        <input type="text" id="idInput" placeholder="Téléphone ou nom" inputmode="text" autocomplete="off" autocapitalize="off">
    </div>

    <div class="dots" id="dots" aria-label="Progression du code" role="status">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="keypad" id="keypad">
        <button class="key" onclick="press('1')" aria-label="1">1</button>
        <button class="key" onclick="press('2')" aria-label="2">2</button>
        <button class="key" onclick="press('3')" aria-label="3">3</button>
        <button class="key" onclick="press('4')" aria-label="4">4</button>
        <button class="key" onclick="press('5')" aria-label="5">5</button>
        <button class="key" onclick="press('6')" aria-label="6">6</button>
        <button class="key" onclick="press('7')" aria-label="7">7</button>
        <button class="key" onclick="press('8')" aria-label="8">8</button>
        <button class="key" onclick="press('9')" aria-label="9">9</button>
        <div style="visibility:hidden"></div>
        <button class="key" onclick="press('0')" aria-label="0">0</button>
        <button class="key" onclick="del()" aria-label="Effacer">
            <svg class="key-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
        </button>
    </div>

    <p id="status" role="alert">&nbsp;</p>
    <!-- ✅ CORRECTION : Le lien "Assistance" ne doit pas être un href vide cliquable -->
    <span class="forgot-link" style="cursor:default;">Assistance administrateur</span>
</div>

<script>
    // ✅ CORRECTION MAJEURE : la session locale (localStorage) ne prouve PAS
    //    que le jeton Firebase est valide. Les règles de sécurité n'acceptent
    //    QUE le jeton Firebase (auth != null). Rediriger vers l'accueil sur la
    //    seule foi du localStorage laissait entrer un utilisateur SANS session
    //    Firebase → toutes les lectures échouaient (« Session utilisateur non
    //    valide »). On ne redirige donc plus ici : on se contente de purger une
    //    session locale invalide/expirée. La décision d'entrer dans l'app est
    //    prise par l'observateur onAuthStateChanged (Firebase = source de vérité).
    function localSessionValid() {
        let raw;
        try { raw = localStorage.getItem('asufor_session'); } catch (e) { return false; }
        if (!raw) return false;
        try {
            const s = JSON.parse(raw);
            const SESSION_DURATION_MS = 8 * 60 * 60 * 1000;
            const validRoles = ['président', 'secrétaire', 'trésorier'];
            const ok = s && s.role && validRoles.includes(s.role) &&
                typeof s.time === 'number' &&
                (Date.now() - s.time) < SESSION_DURATION_MS;
            if (!ok) { try { localStorage.removeItem('asufor_session'); } catch (_) {} }
            return ok;
        } catch (e) {
            try { localStorage.removeItem('asufor_session'); } catch (_) {}
            return false;
        }
    }

    const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;
    // ✅ CORRECTION : init défensive. Si la config n'a pas chargé (404) ou si firebase
    // n'est pas disponible, on N'APPELLE PAS firebase.auth() (qui lèverait une exception
    // et interromprait tout le script → erreurs TDZ en cascade sur lockUntil).
    // auth reste null et l'UI affiche un message clair au lieu de planter.
    let auth = null;
    if (!firebaseConfig || typeof firebase === 'undefined') {
        console.error('[ASUFOR] firebase-config.js non chargé !');
    } else {
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            // ✅ Persistance LOCALE explicite (défaut, mais on lève tout doute) :
            //    garantit que le jeton Firebase survit à la navigation entre pages.
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
        } catch (e) {
            console.error('[ASUFOR] Échec initialisation Firebase :', e);
        }
    }

    let code = "";
    let isVerifying = false;

    // ✅ Protection brute-force (persistée en sessionStorage pour résister au rechargement)
    let failCount = 0;
    let lockUntil = 0;
    const MAX_FAILS = 5;
    const LOCK_DURATION_MS = 30000; // 30 secondes

    // ✅ CORRECTION : Restauration du verrouillage depuis sessionStorage
    try {
        const stored = JSON.parse(sessionStorage.getItem('asufor_lock') || '{}');
        if (stored.lockUntil && stored.lockUntil > Date.now()) {
            lockUntil = stored.lockUntil;
            failCount = stored.failCount || 0;
        }
    } catch (_) {}

    const statusEl = document.getElementById('status');
    const cardEl   = document.getElementById('loginCard');
    const keypadEl = document.getElementById('keypad');

    // ✅ CORRECTION : Firebase = source de vérité pour l'accès aux données.
    //  • user + session locale valide → accès confirmé, on entre dans l'app.
    //  • user SANS session locale valide → état incohérent → on déconnecte Firebase.
    //  • pas de user → on purge la session locale « fantôme ».
    //
    //  ⚠️ CORRECTION BOUCLE DE CONNEXION : pendant une connexion en cours
    //     (isVerifying), on NE FAIT RIEN ici. Sinon une condition de course entre
    //     onAuthStateChanged et le .then() de signInWithEmailAndPassword pouvait
    //     déclencher auth.signOut() PUIS purger la session tout juste écrite →
    //     l'accueil ne trouvait plus de session → retour au clavier de code (boucle).
    //     verify() gère lui-même la redirection après une connexion réussie.
    if (auth) auth.onAuthStateChanged((user) => {
        if (isVerifying) return; // connexion en cours : laisser verify() piloter
        if (user) {
            if (localSessionValid()) {
                window.location.replace('home/accueil.html');
            } else {
                auth.signOut().catch(() => {});
            }
        } else {
            try { localStorage.removeItem('asufor_session'); } catch (_) {}
        }
    });

    function setLockState(locked) {
        const keys = keypadEl.querySelectorAll('.key');
        keys.forEach(k => k.disabled = locked);
    }

    function saveLockState() {
        try {
            sessionStorage.setItem('asufor_lock', JSON.stringify({ lockUntil, failCount }));
        } catch(_) {}
    }

    function checkLock() {
        if (Date.now() < lockUntil) {
            const remaining = Math.ceil((lockUntil - Date.now()) / 1000);
            statusEl.textContent = `Trop de tentatives. Attendez ${remaining}s.`;
            statusEl.className = 'status-error';
            setLockState(true);
            return true;
        }
        setLockState(false);
        return false;
    }

    const idInputEl = document.getElementById('idInput');

    function press(n) {
        if (checkLock() || isVerifying) return;
        if (code.length < 6) {
            code += n;
            updateDots();
            if (code.length === 6) verify();
        }
    }

    function del() {
        if (isVerifying) return;
        if (code.length > 0) {
            code = code.slice(0, -1);
            updateDots();
            if (!checkLock()) {
                statusEl.innerHTML = "&nbsp;";
                statusEl.className = "";
            }
        }
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((d, i) => {
            d.classList.toggle('active', i < code.length);
        });
    }

    /**
     * ✅ Multi-forage : résout role/forageKey/nom depuis users/{uid} après une
     * connexion Firebase réussie. Chaque compte étant désormais individuel
     * (identifiant = téléphone), l'absence de fiche users/{uid} est une erreur
     * (compte mal configuré) : on déconnecte et on prévient au lieu de deviner
     * un rôle par défaut.
     */
    function resolveSessionProfile(user) {
        const email = user.email || '';
        const isSuper = !!(window.ForageContext && window.ForageContext.isSuperadmin(email));

        return firebase.database().ref('users/' + user.uid).once('value')
            .then((snap) => {
                if (snap.exists()) {
                    const u = snap.val() || {};
                    return {
                        role: u.role,
                        time: Date.now(),
                        email: email,
                        forageKey: u.forageKey || null,
                        nom: u.nom || null,
                        isSuperadmin: isSuper
                    };
                }
                if (isSuper) {
                    return { role: 'président', time: Date.now(), email: email, forageKey: null, nom: 'Super-admin', isSuperadmin: true };
                }
                auth.signOut().catch(() => {});
                triggerError("Compte non configuré. Contactez l'administrateur.");
                return null;
            })
            .catch((lookupErr) => {
                console.warn('[ASUFOR] Résolution profil users/{uid} indisponible :', lookupErr);
                auth.signOut().catch(() => {});
                triggerError("Impossible de vérifier le compte. Réessayez.");
                return null;
            });
    }

    function verify() {
        if (isVerifying) return;

        // ✅ CORRECTION : si la config Firebase n'a pas chargé, message clair plutôt que crash.
        if (!auth) {
            statusEl.textContent = "⚠️ Configuration non chargée. Rechargez la page.";
            statusEl.className = "status-error";
            code = "";
            updateDots();
            return;
        }

        isVerifying = true;

        statusEl.textContent = "Vérification en cours...";
        statusEl.className = "status-info";
        setLockState(true);

        const identifiant = (idInputEl.value || '').trim();
        if (!identifiant) {
            triggerError("Identifiant requis.");
            return;
        }
        // ✅ Miroir de resolveLoginEmail() dans provisioning.js : un identifiant
        //    contenant déjà "@" (adresse réelle du super-admin) est gardé tel quel.
        const email = identifiant.includes('@') ? identifiant : identifiant + '@asufor.local';

        // ✅ CORRECTION : Validation du code avant envoi (6 chiffres uniquement)
        if (!/^\d{6}$/.test(code)) {
            triggerError("Code invalide.");
            return;
        }

        auth.signInWithEmailAndPassword(email, code)
            .then((cred) => resolveSessionProfile(cred.user))
            .then((sessionData) => {
                if (!sessionData) return; // resolveSessionProfile a déjà géré l'erreur (compte non configuré)
                failCount = 0;
                lockUntil = 0;
                saveLockState();
                try {
                    localStorage.setItem('asufor_session', JSON.stringify(sessionData));
                } catch(e) {
                    console.error('Impossible de sauvegarder la session :', e);
                }
                statusEl.textContent = "Accès autorisé ✓";
                statusEl.className = "status-success";
                setTimeout(() => window.location.replace('home/accueil.html'), 600);
            })
            .catch((e) => {
                console.error("Authentification échouée :", e.code);
                failCount++;
                saveLockState();

                if (failCount >= MAX_FAILS) {
                    lockUntil = Date.now() + LOCK_DURATION_MS;
                    failCount = 0;
                    saveLockState();
                    statusEl.textContent = "Trop de tentatives. Attendez 30s.";
                    statusEl.className = "status-error";
                    setTimeout(() => {
                        checkLock();
                        code = "";
                        updateDots();
                        isVerifying = false;
                    }, LOCK_DURATION_MS);
                } else {
                    triggerError(`Code incorrect (${failCount}/${MAX_FAILS})`);
                }
            });
    }

    function triggerError(message) {
        statusEl.textContent = message || "Code d'accès incorrect";
        statusEl.className = "status-error";
        cardEl.classList.add('shake');
        setTimeout(() => {
            cardEl.classList.remove('shake');
            code = "";
            updateDots();
            isVerifying = false;
            if (!checkLock()) setLockState(false);
        }, 500);
    }

    // Vérifier le verrouillage au chargement
    checkLock();

    // ── Décor aquatique : gouttelettes tombantes en arrière-plan ──
    // Nombre fixe généré une fois (animations CSS en boucle infinie) :
    // pas de création/suppression continue de nœuds, donc mémoire stable.
    (function spawnBackgroundDroplets() {
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const bands = [[2, 15], [85, 98]]; // bandes latérales gauche / droite, en vw
        const COUNT = 22;
        const frag = document.createDocumentFragment();
        for (let i = 0; i < COUNT; i++) {
            const band = bands[i % 2];
            const left = band[0] + Math.random() * (band[1] - band[0]);
            const size = 6 + Math.random() * 10;
            const duration = 4 + Math.random() * 5;
            const el = document.createElement('div');
            el.className = 'droplet';
            el.style.left = left + 'vw';
            el.style.width = size + 'px';
            el.style.height = size + 'px';
            el.style.animationDuration = duration + 's';
            el.style.animationDelay = (-Math.random() * duration) + 's';
            frag.appendChild(el);
        }
        document.body.appendChild(frag);
    })();

    // ── Effet de jaillissement sur le pavé numérique ──
    // Un cercle translucide s'agrandit depuis le point de contact puis
    // se retire du DOM à la fin de l'animation (pas d'accumulation).
    keypadEl.addEventListener('pointerdown', (e) => {
        const btn = e.target.closest('.key');
        if (!btn || btn.disabled) return;
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height) * 1.4;
        const splash = document.createElement('span');
        splash.className = 'splash';
        splash.style.width = size + 'px';
        splash.style.height = size + 'px';
        splash.style.left = ((e.clientX != null ? e.clientX - rect.left : rect.width / 2)) + 'px';
        splash.style.top = ((e.clientY != null ? e.clientY - rect.top : rect.height / 2)) + 'px';
        btn.appendChild(splash);
        splash.addEventListener('animationend', () => splash.remove());
    });
</script>
</body>
</html>
