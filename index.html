<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ASUFOR">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

    <link rel="manifest" href="manifest.json">
    <script src="pwa.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès ASUFOR</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="firebase-config.js"></script>
    <!-- ✅ Multi-forage : résolution du super-admin (SUPERADMIN_EMAIL, isSuperadmin) -->
    <script src="forage-context.js"></script>

    <style>
        /* ── Design épuré noir sur blanc : contraste fort, aucune décoration superflue ── */
        :root {
            --bg:          #ffffff;
            --fg:          #0a0a0a;
            --muted:       #737373;
            --border-soft: #e5e5e5;
            --error:       #dc2626;
            --success:     #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60%  { transform: translateX(-8px); }
            40%, 80%  { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        .card {
            position: relative;
            background: var(--bg);
            border: 2px solid var(--fg);
            border-radius: 24px;
            box-shadow: 8px 8px 0 var(--fg);
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .icon-lock {
            width: 34px;
            height: 34px;
            stroke: var(--fg);
            margin-bottom: 6px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            margin: 14px 0 4px 0;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-subtitle {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 28px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        /* ── Champ identifiant ── */
        .id-field {
            position: relative;
            margin: 0 auto 24px;
            padding: 12px 16px;
            text-align: left;
            background: var(--bg);
            border: 2px solid var(--fg);
            border-radius: 12px;
            transition: background 0.15s ease;
        }
        .id-field:focus-within { background: #f5f5f5; }
        .id-label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .id-field input {
            width: 100%;
            box-sizing: border-box;
            padding: 0;
            background: transparent;
            border: none;
            color: var(--fg);
            font-size: 15px;
            font-weight: 600;
            outline: none;
        }
        .id-field input::placeholder { color: #b3b3b3; }

        /* ── Points de progression du code PIN ── */
        .dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
            height: 14px;
            align-items: center;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--fg);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dot.active {
            background: var(--fg);
            transform: scale(1.15);
        }

        /* ── Pavé numérique ── */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .key {
            background: var(--bg);
            border: 2px solid var(--fg);
            border-radius: 14px;
            padding: 16px;
            color: var(--fg);
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.12s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .key:hover:not(:disabled) { background: #f5f5f5; }
        .key:active:not(:disabled) {
            background: var(--fg);
            color: var(--bg);
            transform: scale(0.94);
        }
        .key:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .key-icon { width: 20px; height: 20px; stroke: currentColor; }

        #status {
            margin-top: 22px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            min-height: 18px;
            transition: color 0.2s;
        }
        .status-error   { color: var(--error); }
        .status-success { color: var(--success); }
        .status-info    { color: var(--muted); }

        .forgot-link {
            display: inline-block;
            margin-top: 18px;
            font-size: 11px;
            color: var(--muted);
            text-decoration: none;
            letter-spacing: 0.3px;
        }

        @media (max-width: 360px) {
            .card { padding: 30px 20px; box-shadow: 5px 5px 0 var(--fg); }
            .header-title { font-size: 19px; }
            .key { padding: 13px; font-size: 18px; }
            .keypad { gap: 9px; }
            .dots { gap: 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .shake, .dot, .key { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<div class="card" id="loginCard">
    <svg class="icon-lock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>

    <h2 class="header-title">ASUFOR ADMIN</h2>
    <p class="header-subtitle">Gestion de forage</p>

    <div class="id-field" id="idField">
        <label class="id-label" for="idInput">Identifiant</label>
        <input type="text" id="idInput" placeholder="Téléphone ou nom" inputmode="text" autocomplete="off" autocapitalize="off">
    </div>

    <div class="dots" id="dots" aria-label="Progression du code" role="status">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="keypad" id="keypad">
        <button class="key" onclick="press('1')" aria-label="1">1</button>
        <button class="key" onclick="press('2')" aria-label="2">2</button>
        <button class="key" onclick="press('3')" aria-label="3">3</button>
        <button class="key" onclick="press('4')" aria-label="4">4</button>
        <button class="key" onclick="press('5')" aria-label="5">5</button>
        <button class="key" onclick="press('6')" aria-label="6">6</button>
        <button class="key" onclick="press('7')" aria-label="7">7</button>
        <button class="key" onclick="press('8')" aria-label="8">8</button>
        <button class="key" onclick="press('9')" aria-label="9">9</button>
        <div style="visibility:hidden"></div>
        <button class="key" onclick="press('0')" aria-label="0">0</button>
        <button class="key" onclick="del()" aria-label="Effacer">
            <svg class="key-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
        </button>
    </div>

    <p id="status" role="alert">&nbsp;</p>
    <!-- ✅ CORRECTION : Le lien "Assistance" ne doit pas être un href vide cliquable -->
    <span class="forgot-link" style="cursor:default;">Assistance administrateur</span>
</div>

<script>
    // ✅ CORRECTION MAJEURE : la session locale (localStorage) ne prouve PAS
    //    que le jeton Firebase est valide. Les règles de sécurité n'acceptent
    //    QUE le jeton Firebase (auth != null). Rediriger vers l'accueil sur la
    //    seule foi du localStorage laissait entrer un utilisateur SANS session
    //    Firebase → toutes les lectures échouaient (« Session utilisateur non
    //    valide »). On ne redirige donc plus ici : on se contente de purger une
    //    session locale invalide/expirée. La décision d'entrer dans l'app est
    //    prise par l'observateur onAuthStateChanged (Firebase = source de vérité).
    function localSessionValid() {
        let raw;
        try { raw = localStorage.getItem('asufor_session'); } catch (e) { return false; }
        if (!raw) return false;
        try {
            const s = JSON.parse(raw);
            const SESSION_DURATION_MS = 8 * 60 * 60 * 1000;
            const validRoles = ['président', 'secrétaire', 'trésorier'];
            const ok = s && s.role && validRoles.includes(s.role) &&
                typeof s.time === 'number' &&
                (Date.now() - s.time) < SESSION_DURATION_MS;
            if (!ok) { try { localStorage.removeItem('asufor_session'); } catch (_) {} }
            return ok;
        } catch (e) {
            try { localStorage.removeItem('asufor_session'); } catch (_) {}
            return false;
        }
    }

    const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;
    // ✅ CORRECTION : init défensive. Si la config n'a pas chargé (404) ou si firebase
    // n'est pas disponible, on N'APPELLE PAS firebase.auth() (qui lèverait une exception
    // et interromprait tout le script → erreurs TDZ en cascade sur lockUntil).
    // auth reste null et l'UI affiche un message clair au lieu de planter.
    let auth = null;
    if (!firebaseConfig || typeof firebase === 'undefined') {
        console.error('[ASUFOR] firebase-config.js non chargé !');
    } else {
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            // ✅ Persistance LOCALE explicite (défaut, mais on lève tout doute) :
            //    garantit que le jeton Firebase survit à la navigation entre pages.
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
        } catch (e) {
            console.error('[ASUFOR] Échec initialisation Firebase :', e);
        }
    }

    let code = "";
    let isVerifying = false;

    // ✅ Protection brute-force (persistée en sessionStorage pour résister au rechargement)
    let failCount = 0;
    let lockUntil = 0;
    const MAX_FAILS = 5;
    const LOCK_DURATION_MS = 30000; // 30 secondes

    // ✅ CORRECTION : Restauration du verrouillage depuis sessionStorage
    try {
        const stored = JSON.parse(sessionStorage.getItem('asufor_lock') || '{}');
        if (stored.lockUntil && stored.lockUntil > Date.now()) {
            lockUntil = stored.lockUntil;
            failCount = stored.failCount || 0;
        }
    } catch (_) {}

    const statusEl = document.getElementById('status');
    const cardEl   = document.getElementById('loginCard');
    const keypadEl = document.getElementById('keypad');

    // ✅ CORRECTION : Firebase = source de vérité pour l'accès aux données.
    //  • user + session locale valide → accès confirmé, on entre dans l'app.
    //  • user SANS session locale valide → état incohérent → on déconnecte Firebase.
    //  • pas de user → on purge la session locale « fantôme ».
    //
    //  ⚠️ CORRECTION BOUCLE DE CONNEXION : pendant une connexion en cours
    //     (isVerifying), on NE FAIT RIEN ici. Sinon une condition de course entre
    //     onAuthStateChanged et le .then() de signInWithEmailAndPassword pouvait
    //     déclencher auth.signOut() PUIS purger la session tout juste écrite →
    //     l'accueil ne trouvait plus de session → retour au clavier de code (boucle).
    //     verify() gère lui-même la redirection après une connexion réussie.
    if (auth) auth.onAuthStateChanged((user) => {
        if (isVerifying) return; // connexion en cours : laisser verify() piloter
        if (user) {
            if (localSessionValid()) {
                window.location.replace('home/accueil.html');
            } else {
                auth.signOut().catch(() => {});
            }
        } else {
            try { localStorage.removeItem('asufor_session'); } catch (_) {}
        }
    });

    function setLockState(locked) {
        const keys = keypadEl.querySelectorAll('.key');
        keys.forEach(k => k.disabled = locked);
    }

    function saveLockState() {
        try {
            sessionStorage.setItem('asufor_lock', JSON.stringify({ lockUntil, failCount }));
        } catch(_) {}
    }

    function checkLock() {
        if (Date.now() < lockUntil) {
            const remaining = Math.ceil((lockUntil - Date.now()) / 1000);
            statusEl.textContent = `Trop de tentatives. Attendez ${remaining}s.`;
            statusEl.className = 'status-error';
            setLockState(true);
            return true;
        }
        setLockState(false);
        return false;
    }

    const idInputEl = document.getElementById('idInput');

    function press(n) {
        if (checkLock() || isVerifying) return;
        if (code.length < 6) {
            code += n;
            updateDots();
            if (code.length === 6) verify();
        }
    }

    function del() {
        if (isVerifying) return;
        if (code.length > 0) {
            code = code.slice(0, -1);
            updateDots();
            if (!checkLock()) {
                statusEl.innerHTML = "&nbsp;";
                statusEl.className = "";
            }
        }
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((d, i) => {
            d.classList.toggle('active', i < code.length);
        });
    }

    /**
     * ✅ Multi-forage : résout role/forageKey/nom depuis users/{uid} après une
     * connexion Firebase réussie. Chaque compte étant désormais individuel
     * (identifiant = téléphone), l'absence de fiche users/{uid} est une erreur
     * (compte mal configuré) : on déconnecte et on prévient au lieu de deviner
     * un rôle par défaut.
     */
    function resolveSessionProfile(user) {
        const email = user.email || '';
        const isSuper = !!(window.ForageContext && window.ForageContext.isSuperadmin(email));

        return firebase.database().ref('users/' + user.uid).once('value')
            .then((snap) => {
                if (snap.exists()) {
                    const u = snap.val() || {};
                    return {
                        role: u.role,
                        time: Date.now(),
                        email: email,
                        forageKey: u.forageKey || null,
                        nom: u.nom || null,
                        isSuperadmin: isSuper
                    };
                }
                if (isSuper) {
                    return { role: 'président', time: Date.now(), email: email, forageKey: null, nom: 'Super-admin', isSuperadmin: true };
                }
                auth.signOut().catch(() => {});
                triggerError("Compte non configuré. Contactez l'administrateur.");
                return null;
            })
            .catch((lookupErr) => {
                console.warn('[ASUFOR] Résolution profil users/{uid} indisponible :', lookupErr);
                auth.signOut().catch(() => {});
                triggerError("Impossible de vérifier le compte. Réessayez.");
                return null;
            });
    }

    function verify() {
        if (isVerifying) return;

        // ✅ CORRECTION : si la config Firebase n'a pas chargé, message clair plutôt que crash.
        if (!auth) {
            statusEl.textContent = "⚠️ Configuration non chargée. Rechargez la page.";
            statusEl.className = "status-error";
            code = "";
            updateDots();
            return;
        }

        isVerifying = true;

        statusEl.textContent = "Vérification en cours...";
        statusEl.className = "status-info";
        setLockState(true);

        const identifiant = (idInputEl.value || '').trim();
        if (!identifiant) {
            triggerError("Identifiant requis.");
            return;
        }
        // ✅ Miroir de resolveLoginEmail() dans provisioning.js : un identifiant
        //    contenant déjà "@" (adresse réelle du super-admin) est gardé tel quel.
        const email = identifiant.includes('@') ? identifiant : identifiant + '@asufor.local';

        // ✅ CORRECTION : Validation du code avant envoi (6 chiffres uniquement)
        if (!/^\d{6}$/.test(code)) {
            triggerError("Code invalide.");
            return;
        }

        auth.signInWithEmailAndPassword(email, code)
            .then((cred) => resolveSessionProfile(cred.user))
            .then((sessionData) => {
                if (!sessionData) return; // resolveSessionProfile a déjà géré l'erreur (compte non configuré)
                failCount = 0;
                lockUntil = 0;
                saveLockState();
                try {
                    localStorage.setItem('asufor_session', JSON.stringify(sessionData));
                } catch(e) {
                    console.error('Impossible de sauvegarder la session :', e);
                }
                statusEl.textContent = "Accès autorisé ✓";
                statusEl.className = "status-success";
                setTimeout(() => window.location.replace('home/accueil.html'), 600);
            })
            .catch((e) => {
                console.error("Authentification échouée :", e.code);
                failCount++;
                saveLockState();

                if (failCount >= MAX_FAILS) {
                    lockUntil = Date.now() + LOCK_DURATION_MS;
                    failCount = 0;
                    saveLockState();
                    statusEl.textContent = "Trop de tentatives. Attendez 30s.";
                    statusEl.className = "status-error";
                    setTimeout(() => {
                        checkLock();
                        code = "";
                        updateDots();
                        isVerifying = false;
                    }, LOCK_DURATION_MS);
                } else {
                    triggerError(`Code incorrect (${failCount}/${MAX_FAILS})`);
                }
            });
    }

    function triggerError(message) {
        statusEl.textContent = message || "Code d'accès incorrect";
        statusEl.className = "status-error";
        cardEl.classList.add('shake');
        setTimeout(() => {
            cardEl.classList.remove('shake');
            code = "";
            updateDots();
            isVerifying = false;
            if (!checkLock()) setLockState(false);
        }, 500);
    }

    // Vérifier le verrouillage au chargement
    checkLock();
</script>
</body>
</html>
