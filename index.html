<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <link rel="manifest" href="manifest.json">
    <script src="pwa.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Accès ASUFOR</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { 
            --bg-dark: #0f172a; 
            --bg-light: #1e293b; 
            --bg-accent: #0c4a6e;
            --txt: #f8fafc; 
            --blue: #38bdf8; 
            --error: #ef4444;
            --glass: rgba(255, 255, 255, 0.05); 
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body { 
            background: linear-gradient(-45deg, var(--bg-dark), var(--bg-light), var(--bg-accent), #1a1e21);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--txt); 
            font-family: 'Inter', sans-serif;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .card { 
            background: var(--glass); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 32px; 
            padding: 35px 30px; 
            width: 90%; 
            max-width: 380px; 
            text-align: center; 
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        .header-title {
            font-family: 'Hudhudh Bold', sans-serif;
            font-size: 24px;
            font-weight: normal;
            margin: 10px 0 5px 0;
            letter-spacing: 1px;
        }

        .header-subtitle {
            opacity: 0.6; 
            font-size: 11px; 
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .icon-lock {
            width: 32px;
            height: 32px;
            stroke: var(--blue);
            margin-bottom: 5px;
        }

        .role-selector { 
            display: flex; 
            gap: 5px; 
            background: rgba(0,0,0,0.25); 
            padding: 6px; 
            border-radius: 50px; 
            margin-bottom: 30px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .role-btn { 
            flex: 1; 
            padding: 10px; 
            border-radius: 50px; 
            border: none; 
            background: transparent; 
            color: var(--txt); 
            cursor: pointer; 
            font-family: 'Hudhudh Bold', sans-serif;
            font-size: 12px; 
            transition: all 0.3s ease; 
            opacity: 0.7;
        }
        
        .role-btn.active { 
            background: var(--blue); 
            color: #000; 
            opacity: 1;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
        }

        .dots { display: flex; justify-content: center; gap: 15px; margin-bottom: 35px; height: 14px; align-items: center; }
        .dot { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            background: rgba(255,255,255,0.15); 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .dot.active { 
            background: var(--blue); 
            box-shadow: 0 0 12px var(--blue); 
            transform: scale(1.3); 
        }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .key { 
            background: rgba(255,255,255,0.03); 
            border: 1px solid rgba(255,255,255,0.08); 
            padding: 18px; 
            border-radius: 20px; 
            color: var(--txt); 
            font-size: 24px; 
            font-weight: 300;
            cursor: pointer; 
            transition: all 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .key:active { 
            transform: scale(0.92); 
            background: rgba(255,255,255,0.15); 
            border-color: rgba(255,255,255,0.3);
        }

        .key-icon { width: 24px; height: 24px; stroke: currentColor; }
        
        #status { 
            margin-top: 25px; 
            font-size: 13px; 
            min-height: 20px; 
            transition: color 0.3s;
        }
        
        .status-error { color: var(--error); }
        .status-success { color: var(--blue); }

        .forgot-link {
            display: inline-block;
            margin-top: 15px;
            font-size: 11px;
            color: var(--txt);
            opacity: 0.5;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .forgot-link:hover { opacity: 1; }
    </style>
</head>
<body>

<div class="card" id="loginCard">
    <svg class="icon-lock" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    
    <h2 class="header-title">ASUFOR ADMIN</h2>
    <p class="header-subtitle">Réseau : Forage Diandioly</p>

    <div class="role-selector">
        <button class="role-btn active" onclick="setRole('secrétaire', this)">Secrétaire</button>
        <button class="role-btn" onclick="setRole('président', this)">Président</button>
        <button class="role-btn" onclick="setRole('trésorier', this)">Trésorier</button>
    </div>

    <div class="dots" id="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="keypad">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>
        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>
        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>
        <div style="visibility:hidden"></div>
        <button class="key" onclick="press('0')">0</button>
        <button class="key" onclick="del()" aria-label="Effacer">
            <svg class="key-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                <line x1="18" y1="9" x2="12" y2="15"></line>
                <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
        </button>
    </div>
    
    <p id="status">&nbsp;</p>
    
    <a href="#" class="forgot-link">Assistance administrateur</a>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAKC7lrKSCFwfuoXASvX-yYIGneLXInvDk",
        authDomain: "asufor-67a06.firebaseapp.com",
        databaseURL: "https://asufor-67a06-default-rtdb.firebaseio.com",
        projectId: "asufor-67a06"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let code = "";
    let role = "secrétaire";
    const statusEl = document.getElementById('status');
    const cardEl = document.getElementById('loginCard');

    auth.onAuthStateChanged((user) => {
        if (user && !localStorage.getItem('asufor_session')) {
            auth.signOut();
        }
    });

    function setRole(newRole, btn) {
        role = newRole;
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        code = "";
        statusEl.innerHTML = "&nbsp;";
        statusEl.className = "";
        updateDots();
    }

    function press(n) {
        if(code.length < 6) {
            code += n;
            updateDots();
            if(code.length === 6) verify();
        }
    }

    function del() {
        if(code.length > 0) {
            code = code.slice(0, -1);
            updateDots();
            statusEl.innerHTML = "&nbsp;";
        }
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((d, i) => {
            if (i < code.length) {
                d.classList.add('active');
            } else {
                d.classList.remove('active');
            }
        });
    }

    function verify() {
        statusEl.textContent = "Vérification en cours...";
        statusEl.className = "";
        
        const mapping = { 
            "secrétaire": "secretaire@diandioly.com", 
            "président": "president@diandioly.com", 
            "trésorier": "tresorier@diandioly.com" 
        };
        
        const email = mapping[role];

        auth.signInWithEmailAndPassword(email, code)
        .then((userCredential) => {
            localStorage.setItem('asufor_session', JSON.stringify({
                role: role,
                time: Date.now()
            }));
            statusEl.textContent = "Accès autorisé";
            statusEl.className = "status-success";
            setTimeout(() => window.location.replace('home/accueil.html'), 600);
        })
        .catch((e) => {
            console.error("Échec de l'authentification :", e.message);
            triggerError();
        });
    }

    function triggerError() {
        statusEl.textContent = "Code d'accès incorrect";
        statusEl.className = "status-error";
        cardEl.classList.add('shake');
        
        setTimeout(() => {
            cardEl.classList.remove('shake');
            code = ""; 
            updateDots();
        }, 500);
    }
</script>
</body>
</html>
