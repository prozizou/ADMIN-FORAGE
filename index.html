<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<link rel="manifest" href="manifest.json">
<script src="pwa.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Accès ASUFOR</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        :root { --bg: #1a1e21; --txt: #dfe6e9; --blue: #38bdf8; --glass: rgba(255,255,255,0.05); }
        [data-theme="light"] { --bg: #f0f2f5; --txt: #2d3436; --glass: rgba(255,255,255,0.7); }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin:0; transition: 0.3s; }
        .card { background: var(--glass); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 32px; padding: 30px; width: 90%; max-width: 400px; text-align: center; }
        .role-selector { display: flex; gap: 5px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 50px; margin-bottom: 25px; }
        .role-btn { flex: 1; padding: 10px; border-radius: 50px; border: none; background: transparent; color: var(--txt); cursor: pointer; font-size: 12px; transition: 0.2s; }
        .role-btn.active { background: var(--txt); color: var(--bg); font-weight: bold; }
        .dots { display: flex; justify-content: center; gap: 12px; margin-bottom: 30px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.1); transition: 0.3s; }
        .dot.active { background: var(--blue); box-shadow: 0 0 10px var(--blue); transform: scale(1.2); }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .key { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); padding: 20px; border-radius: 18px; color: var(--txt); font-size: 22px; cursor: pointer; }
        .key:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>

<div class="card">
    <h2 style="font-weight: 300;">🔐 ASUFOR Admin</h2>
    <p style="opacity: 0.5; font-size: 12px; margin-bottom: 20px;">Identification requise</p>

    <div class="role-selector">
        <button class="role-btn active" onclick="setRole('secrétaire', this)">Secrétaire</button>
        <button class="role-btn" onclick="setRole('président', this)">Président</button>
        <button class="role-btn" onclick="setRole('trésorier', this)">Trésorier</button>
    </div>

    <div class="dots" id="dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>

    <div class="keypad">
        <button class="key" onclick="press('1')">1</button>
        <button class="key" onclick="press('2')">2</button>
        <button class="key" onclick="press('3')">3</button>
        <button class="key" onclick="press('4')">4</button>
        <button class="key" onclick="press('5')">5</button>
        <button class="key" onclick="press('6')">6</button>
        <button class="key" onclick="press('7')">7</button>
        <button class="key" onclick="press('8')">8</button>
        <button class="key" onclick="press('9')">9</button>
        <div style="visibility:hidden"></div>
        <button class="key" onclick="press('0')">0</button>
        <button class="key" onclick="del()">⌫</button>
    </div>
    <p id="status" style="margin-top: 20px; font-size: 14px; min-height: 20px;"></p>
</div>

<script>
    // Initialisation Firebase classique
    const firebaseConfig = {
        apiKey: "AIzaSyAKC7lrKSCFwfuoXASvX-yYIGneLXInvDk",
        authDomain: "asufor-67a06.firebaseapp.com",
        databaseURL: "https://asufor-67a06-default-rtdb.firebaseio.com",
        projectId: "asufor-67a06"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let code = "";
    let role = "secrétaire";

    function setRole(newRole, btn) {
        role = newRole;
        document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        code = "";
        updateDots();
    }

    function press(n) {
        if(code.length < 6) {
            code += n;
            updateDots();
            if(code.length === 6) verify();
        }
    }

    function del() {
        code = code.slice(0, -1);
        updateDots();
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((d, i) => d.classList.toggle('active', i < code.length));
    }

    function verify() {
        const status = document.getElementById('status');
        status.textContent = "🔍 Vérification...";
        
        const mapping = { "secrétaire": "Secrétaire", "président": "president", "trésorier": "trésorier" };
        
        // Requête Firebase classique
        db.ref(`admins/${mapping[role]}`).once('value')
        .then((snap) => {
            const data = snap.val();
            const correct = data ? (data.passcode || data.Passcode) : null;

            if(correct && code === correct.toString()) {
                // Création d'une session propre
                localStorage.setItem('asufor_session', JSON.stringify({
                    role: role,
                    time: Date.now()
                }));
                status.textContent = "✅ Accès autorisé";
                setTimeout(() => window.location.replace('accueil.html'), 500);
            } else {
                status.textContent = "❌ Code incorrect";
                code = ""; 
                setTimeout(updateDots, 500);
            }
        })
        .catch((e) => {
            status.textContent = "⚠️ Erreur réseau";
            console.error(e);
        });
    }
</script>
</body>
</html>
