<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASUFOR Admin Pro - Glassmorph</title>
    
    <style>
        :root {
            --bg-color: #1a1e21;
            --text-main: #dfe6e9;
            --accent-blue: #38bdf8;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glow: rgba(56, 189, 248, 0.15);
        }

        [data-theme="light"] {
            --bg-color: #f0f2f5;
            --text-main: #2d3436;
            --glass: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glow: rgba(0, 0, 0, 0.05);
        }

        body {
            background: radial-gradient(circle at top right, #2d3436, var(--bg-color));
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0; padding: 20px;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
            transition: background 0.3s ease;
        }

        /* --- Éléments Décoratifs --- */
        .bg-blob {
            position: fixed; width: 300px; height: 300px;
            background: var(--accent-blue);
            filter: blur(100px); opacity: 0.15; z-index: -1;
            border-radius: 50%;
        }

        /* --- Header --- */
        .header { text-align: center; margin-bottom: 40px; margin-top: 20px; }
        h1 { font-weight: 300; letter-spacing: 2px; margin-bottom: 5px; }
        .subtitle { opacity: 0.6; font-size: 0.9rem; }

        /* --- Grille Staggered (Décalée) --- */
        .grid {
            display: grid; 
            grid-template-columns: repeat(2, 1fr);
            gap: 25px; 
            width: 100%; 
            max-width: 450px;
            padding-bottom: 60px;
        }

        /* --- Boutons Glassmorph --- */
        .glass-btn {
            position: relative;
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 15px;
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            text-decoration: none; color: inherit;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            opacity: 0; /* Pour l'animation d'entrée */
            animation: fadeInUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Décalage des colonnes */
        .grid a:nth-child(even) { --base-translate: 35px; transform: translateY(var(--base-translate)); }
        .grid a:nth-child(odd) { --base-translate: 0px; }

        /* Bouton Impression Centré */
        .grid a:last-child:nth-child(odd) {
            grid-column: span 2;
            margin-top: 50px;
            width: 60%;
            justify-self: center;
        }

        /* Animation d'entrée staggered */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(calc(var(--base-translate) + 20px)); }
            to { opacity: 1; transform: translateY(var(--base-translate)); }
        }

        .grid a:nth-child(1) { animation-delay: 0.1s; }
        .grid a:nth-child(2) { animation-delay: 0.2s; }
        .grid a:nth-child(3) { animation-delay: 0.3s; }
        .grid a:nth-child(4) { animation-delay: 0.4s; }
        .grid a:nth-child(5) { animation-delay: 0.5s; }

        /* --- Hover Effects --- */
        .glass-btn:hover {
            border-color: var(--accent-blue);
            box-shadow: 0 15px 35px var(--glow);
        }

        .grid a:nth-child(odd):hover { transform: translateY(-5px) scale(1.02); }
        .grid a:nth-child(even):hover { transform: translateY(30px) scale(1.02); }

        .icon-box {
            width: 45px; height: 45px; margin-bottom: 12px;
            fill: var(--accent-blue);
            filter: drop-shadow(0 0 8px var(--glow));
        }

        span { font-weight: 500; font-size: 0.95rem; }

        /* --- Theme Toggle --- */
        .theme-switch {
            position: fixed; top: 20px; right: 20px;
            width: 45px; height: 45px; border-radius: 50%;
            background: var(--glass); border: 1px solid var(--glass-border);
            color: var(--text-main); cursor: pointer; z-index: 100;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <div class="bg-blob" style="top: -50px; left: -50px;"></div>
    <div class="bg-blob" style="bottom: 50px; right: -50px; background: #60efff;"></div>

    <button class="theme-switch" onclick="toggleTheme()" aria-label="Changer le thème">🌓</button>

    <div class="header">
        <h1>ASUFOR Admin</h1>
        <div class="subtitle">Siège: DIANDIOLY | Gestion Pro</div>
    </div>

    <div class="grid">
        <a href="agent.html" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <span>Ajouter Agent</span>
        </a>

        <a href="list.html" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            </div>
            <span>Compteur</span>
        </a>

        <a href="stats.html" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
            </div>
            <span>Statistiques</span>
        </a>

        <a href="zero.html" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8s3.58 8 8 8 8-3.58 8-8h-2c0 3.31-2.69 6-6 6s-6-2.69-6-6 2.69-6 6-6z"/></svg>
            </div>
            <span>Réinitialiser</span>
        </a>

        <a href="impression.html" class="glass-btn">
            <div class="icon-box">
                <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
            </div>
            <span>Impression</span>
        </a>
    </div>

    <script>
        // --- Gestion du Thème (avec sauvegarde) ---
        const doc = document.documentElement;
        const savedTheme = localStorage.getItem('asufor-theme') || 'dark';
        doc.setAttribute('data-theme', savedTheme);

        function toggleTheme() {
            const currentTheme = doc.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            doc.setAttribute('data-theme', newTheme);
            localStorage.setItem('asufor-theme', newTheme);
        }

        // --- Mouvement Dynamique et 3D ---
        document.querySelectorAll('.glass-btn').forEach(btn => {
            btn.addEventListener('mousemove', e => {
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                btn.style.setProperty('--x', `${x}px`);
                btn.style.setProperty('--y', `${y}px`);
                
                // Calcul de l'inclinaison
                const rotateX = ((y / rect.height) - 0.5) * 10;
                const rotateY = ((x / rect.width) - 0.5) * -10;
                
                // Appliquer l'inclinaison (en gardant le décalage initial via CSS)
                btn.style.transform += ` perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });

            btn.addEventListener('mouseleave', () => {
                // On réinitialise simplement pour que le CSS reprenne le dessus
                btn.style.transform = "";
            });
        });
    </script>
</body>
</html>
