<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asufor Admin | Connexion</title>
    <style>
        :root {
            --bg: #0f172a; --card: rgba(30, 41, 59, 0.9);
            --primary: #3b82f6; --success: #10b981;
            --danger: #ef4444; --text: #f8fafc;
            --text-dim: #94a3b8; --border: rgba(255, 255, 255, 0.1);
        }
        body {
            margin: 0; padding: 15px; background: var(--bg); color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            display: flex; align-items: center; justify-content: center; height: 100vh;
            overflow: hidden;
        }
        
        .card {
            background: var(--card); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 28px;
            padding: 40px 30px; width: 100%; max-width: 380px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            z-index: 10;
        }

        .icon-lock {
            width: 64px; height: 64px; background: rgba(59, 130, 246, 0.1);
            border-radius: 50%; display: inline-flex; align-items: center;
            justify-content: center; margin-bottom: 20px; color: var(--primary);
            transition: all 0.4s ease;
        }

        h1 { margin: 0 0 5px 0; font-size: 22px; font-weight: 800; }
        p.subtitle { color: var(--text-dim); font-size: 13px; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 11px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        input {
            width: 100%; background: rgba(15, 23, 42, 0.6); border: 2px solid var(--border);
            border-radius: 12px; padding: 14px; color: white; font-size: 15px;
            outline: none; box-sizing: border-box; transition: border-color 0.3s;
        }
        input:focus { border-color: var(--primary); }

        /* NOUVEAU : Style pour la case à cocher */
        .checkbox-group {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 25px; text-align: left;
        }
        .checkbox-group input[type="checkbox"] {
            width: 18px; height: 18px; margin: 0; cursor: pointer;
            accent-color: var(--primary);
        }
        .checkbox-group label {
            font-size: 13px; color: var(--text-dim); cursor: pointer;
        }

        button {
            width: 100%; padding: 16px; background: var(--primary); color: white;
            border: none; border-radius: 14px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3);
            display: flex; justify-content: center; align-items: center; gap: 10px;
            margin-top: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 15px 20px -3px rgba(59, 130, 246, 0.4); }
        button:disabled { background: #475569; transform: none; box-shadow: none; cursor: not-allowed; }

        #error-msg { margin-top: 15px; font-size: 12px; font-weight: bold; color: var(--danger); min-height: 15px; opacity: 0; transition: opacity 0.3s; }

        .page-transition-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999;
            opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease-in-out;
        }

        .card.success { transform: scale(0.95); opacity: 0; pointer-events: none; }
        .icon-lock.success { background: var(--success); color: white; transform: scale(1.2); }
        .page-transition-overlay.active { opacity: 1; pointer-events: all; }

        .spinner {
            width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%; border-top-color: white; animation: spin 1s ease-in-out infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- ADAPTATION POUR TRÈS PETITS ÉCRANS ET TV/4K --- */
        @media (max-width: 380px) {
            .card { padding: 25px 15px; }
            h1 { font-size: 1.2rem; }
        }
        @media (min-width: 1400px) { 
            .card { max-width: 600px; padding: 60px; }
            h1 { font-size: 2.5rem; }
            p.subtitle { font-size: 1.2rem; }
            input, button, .input-group label { font-size: 1.2rem; padding: 20px; }
            .icon-lock { width: 90px; height: 90px; }
            svg { width: 45px; height: 45px; }
        }
    </style>
</head>
<body>

    <div class="page-transition-overlay" id="overlay"></div>

    <div class="card" id="login-card">
        <div class="icon-lock" id="status-icon">
            <svg id="svg-lock" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <svg id="svg-check" style="display:none;" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        
        <h1>Portail Administrateur</h1>
        <p class="subtitle">Réseau Asufor Diandioly</p>

        <form id="login-form">
            <div class="input-group">
                <label>Adresse Email</label>
                <input type="email" id="email" required placeholder="admin@diandioly.com">
            </div>
            
            <div class="input-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="remember-me" checked>
                <label for="remember-me">Se souvenir de moi</label>
            </div>

            <button type="submit" id="btn-login">
                <span id="btn-text">Se connecter</span>
                <div class="spinner" id="btn-spinner"></div>
            </button>
        </form>

        <div id="error-msg">Identifiants incorrects</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        // Ajout de setPersistence, browserLocalPersistence et onAuthStateChanged
        import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAKC7lrKSCFwfuoXASvX-yYIGneLXInvDk",
            authDomain: "asufor-67a06.firebaseapp.com",
            databaseURL: "https://asufor-67a06-default-rtdb.firebaseio.com",
            projectId: "asufor-67a06"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('login-form');
        const btn = document.getElementById('btn-login');
        const btnText = document.getElementById('btn-text');
        const spinner = document.getElementById('btn-spinner');
        const errorMsg = document.getElementById('error-msg');
        
        const card = document.getElementById('login-card');
        const iconContainer = document.getElementById('status-icon');
        const svgLock = document.getElementById('svg-lock');
        const svgCheck = document.getElementById('svg-check');
        const overlay = document.getElementById('overlay');

        // Redirection automatique si déjà connecté
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'accueil.html'; 
            }
        });

        // Pré-remplissage avec le stockage local
        window.onload = () => {
            if(localStorage.getItem('adminEmail')) {
                document.getElementById('email').value = localStorage.getItem('adminEmail');
                document.getElementById('password').value = localStorage.getItem('adminPwd') || "";
                document.getElementById('remember-me').checked = true;
            }
        };

        form.addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('remember-me').checked;

            // Sauvegarde dans le navigateur si coché
            if (rememberMe) {
                localStorage.setItem('adminEmail', email);
                localStorage.setItem('adminPwd', password); 
            } else {
                localStorage.removeItem('adminEmail');
                localStorage.removeItem('adminPwd');
            }

            errorMsg.style.opacity = '0';
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                // Application de la persistance locale
                await setPersistence(auth, browserLocalPersistence);
                await signInWithEmailAndPassword(auth, email, password);
                
                svgLock.style.display = 'none';
                svgCheck.style.display = 'block';
                iconContainer.classList.add('success');
                
                setTimeout(() => { card.classList.add('success'); }, 600);
                setTimeout(() => { overlay.classList.add('active'); }, 900);
                setTimeout(() => { window.location.href = 'accueil.html'; }, 1700);

            } catch (error) {
                console.error(error.code);
                if(error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    errorMsg.innerText = "Email ou mot de passe incorrect.";
                } else if (error.code === 'auth/network-request-failed') {
                    errorMsg.innerText = "Erreur réseau. Vérifiez votre connexion.";
                } else {
                    errorMsg.innerText = "Une erreur est survenue.";
                }
                
                errorMsg.style.opacity = '1';
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
