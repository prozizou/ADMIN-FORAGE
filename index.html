<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#0b1120">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ASUFOR">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

    <link rel="manifest" href="manifest.json">
    <script src="pwa.js" defer></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accès ASUFOR</title>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="firebase-config.js"></script>
    <!-- ✅ Multi-forage : résolution du super-admin (SUPERADMIN_EMAIL, isSuperadmin) -->
    <script src="admin-config.js"></script>
    <script src="forage-context.js"></script>

    <style>
        /* ── Design sobre "outil professionnel" : fond uni, carte opaque, accents nets ──
           (v2 : remplace le glassmorphisme d'origine — trop de transparence/dégradés
           donnait un rendu prototype plutôt qu'application de gestion.) */
        :root {
            --bg:      #0a0f1c;
            --surface: #111a2e;
            --surface-2: rgba(255, 255, 255, 0.04);
            --surface-2-hover: rgba(255, 255, 255, 0.07);
            --border:  rgba(255, 255, 255, 0.10);
            --fg:      #f8fafc;
            --muted:   rgba(248, 250, 252, 0.62);
            --muted-strong: rgba(248, 250, 252, 0.8);
            --accent:  #38bdf8;
            --accent-ink: #04202e;
            --error:   #f87171;
            --success: #34d399;
        }

        * { box-sizing: border-box; }

        body {
            position: relative;
            background: var(--bg);
            color: var(--fg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            overflow: hidden;
        }

        /* ── Ambiance très discrète en fond (un seul halo, statique, pas d'animation) ── */
        .ambient {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(600px 400px at 50% -10%, rgba(56, 189, 248, 0.10), transparent 70%);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60%  { transform: translateX(-8px); }
            40%, 80%  { transform: translateX(8px); }
        }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        .card {
            position: relative;
            z-index: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 20px 40px -16px rgba(0, 0, 0, 0.55);
            padding: 36px 30px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .brand { margin-bottom: 28px; }

        .icon-lock {
            width: 28px;
            height: 28px;
            stroke: var(--accent);
            margin-bottom: 8px;
        }

        .header-title {
            font-size: 20px;
            font-weight: 600;
            margin: 10px 0 4px 0;
            letter-spacing: 0.5px;
        }

        .header-subtitle {
            color: var(--muted);
            font-size: 11px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
        }

        .step { text-align: left; }

        /* ── Étape 1 : identifiant ── */
        .field { margin-bottom: 20px; }
        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--muted-strong);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        #idInput {
            width: 100%;
            padding: 13px 14px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--fg);
            font-size: 15px;
            font-weight: 500;
            outline: none;
            transition: background 0.15s ease, border-color 0.15s ease;
        }
        #idInput:focus { background: var(--surface-2-hover); border-color: var(--accent); }
        #idInput::placeholder { color: rgba(248, 250, 252, 0.35); }

        .field-hint {
            margin: 8px 2px 0;
            font-size: 11.5px;
            color: var(--muted);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: var(--accent-ink);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: filter 0.15s ease, opacity 0.15s ease;
        }
        .btn-primary:hover:not(:disabled) { filter: brightness(1.08); }
        .btn-primary:active:not(:disabled) { filter: brightness(0.94); }
        .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ── Étape 2 : code PIN ── */
        .identity-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 22px;
        }
        .identity-label {
            display: block;
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .identity-value {
            font-size: 14px;
            font-weight: 600;
            color: var(--fg);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .identity-edit {
            flex: none;
            background: transparent;
            border: none;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            padding: 4px 2px;
        }
        .identity-edit:hover { text-decoration: underline; }

        .pin-label {
            text-align: center;
            margin: 0 0 14px;
        }

        /* ── Points de progression du code PIN ── */
        .dots {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 16px;
            height: 14px;
            align-items: center;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid rgba(248, 250, 252, 0.3);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .dot.active {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.15);
        }

        .status-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 18px;
            margin-bottom: 18px;
        }

        .spinner {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            border: 2px solid rgba(248, 250, 252, 0.25);
            border-top-color: var(--accent);
            animation: spin 0.7s linear infinite;
            flex: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        #status {
            margin: 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.2px;
            text-transform: uppercase;
        }
        .status-error   { color: var(--error); }
        .status-success { color: var(--success); }
        .status-info    { color: var(--muted-strong); }

        /* ── Pavé numérique ── */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .key {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            min-height: 56px;
            color: var(--fg);
            font-size: 19px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.1s ease, border-color 0.1s ease, transform 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .key:hover:not(:disabled) { background: var(--surface-2-hover); border-color: rgba(255,255,255,0.2); }
        .key:active:not(:disabled) {
            background: rgba(56, 189, 248, 0.18);
            border-color: var(--accent);
            transform: scale(0.96);
        }
        .key:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .key-icon { width: 20px; height: 20px; stroke: currentColor; }

        .forgot-link {
            display: block;
            margin-top: 22px;
            font-size: 12px;
            color: var(--muted-strong);
            text-decoration: none;
            letter-spacing: 0.2px;
        }

        @media (max-width: 360px) {
            .card { padding: 28px 20px; }
            .header-title { font-size: 18px; }
            .key { min-height: 50px; font-size: 17px; }
            .keypad { gap: 8px; }
            .dots { gap: 12px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .shake, .dot, .key, .spinner { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

<div class="ambient" aria-hidden="true"></div>

<div class="card" id="loginCard">
    <div class="brand">
        <svg class="icon-lock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>

        <h1 class="header-title">ASUFOR ADMIN</h1>
        <p class="header-subtitle">Gestion de forage</p>
    </div>

    <!-- ÉTAPE 1 : identifiant -->
    <div class="step" id="stepId">
        <div class="field">
            <label class="field-label" for="idInput">Identifiant</label>
            <input type="text" id="idInput" placeholder="Téléphone ou identifiant" inputmode="text" autocomplete="username" autocapitalize="off">
            <p class="field-hint">Numéro de téléphone fourni par votre administrateur</p>
        </div>
        <button type="button" class="btn-primary" id="btnContinue" disabled>Continuer</button>
    </div>

    <!-- ÉTAPE 2 : code PIN -->
    <div class="step" id="stepPin" hidden>
        <div class="identity-pill">
            <div>
                <span class="identity-label">Connecté en tant que</span>
                <span class="identity-value" id="identityValue"></span>
            </div>
            <button type="button" class="identity-edit" id="btnEditId">Modifier</button>
        </div>

        <p class="field-label pin-label">Code PIN</p>

        <div class="dots" id="dots" aria-label="Progression du code" role="status">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

        <div class="status-row">
            <span class="spinner" id="spinner" hidden aria-hidden="true"></span>
            <p id="status" role="alert" aria-live="polite">&nbsp;</p>
        </div>

        <div class="keypad" id="keypad">
            <button class="key" onclick="press('1')" aria-label="1">1</button>
            <button class="key" onclick="press('2')" aria-label="2">2</button>
            <button class="key" onclick="press('3')" aria-label="3">3</button>
            <button class="key" onclick="press('4')" aria-label="4">4</button>
            <button class="key" onclick="press('5')" aria-label="5">5</button>
            <button class="key" onclick="press('6')" aria-label="6">6</button>
            <button class="key" onclick="press('7')" aria-label="7">7</button>
            <button class="key" onclick="press('8')" aria-label="8">8</button>
            <button class="key" onclick="press('9')" aria-label="9">9</button>
            <div style="visibility:hidden"></div>
            <button class="key" onclick="press('0')" aria-label="0">0</button>
            <button class="key" onclick="del()" aria-label="Effacer">
                <svg class="key-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
                    <line x1="18" y1="9" x2="12" y2="15"></line>
                    <line x1="12" y1="9" x2="18" y2="15"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- ✅ CORRECTION : Le lien "Assistance" ne doit pas être un href vide cliquable -->
    <span class="forgot-link" style="cursor:default;">Assistance administrateur</span>
</div>

<script>
    // ✅ CORRECTION MAJEURE : la session locale (localStorage) ne prouve PAS
    //    que le jeton Firebase est valide. Les règles de sécurité n'acceptent
    //    QUE le jeton Firebase (auth != null). Rediriger vers l'accueil sur la
    //    seule foi du localStorage laissait entrer un utilisateur SANS session
    //    Firebase → toutes les lectures échouaient (« Session utilisateur non
    //    valide »). On ne redirige donc plus ici : on se contente de purger une
    //    session locale invalide/expirée. La décision d'entrer dans l'app est
    //    prise par l'observateur onAuthStateChanged (Firebase = source de vérité).
    function localSessionValid() {
        let raw;
        try { raw = localStorage.getItem('asufor_session'); } catch (e) { return false; }
        if (!raw) return false;
        try {
            const s = JSON.parse(raw);
            const SESSION_DURATION_MS = 8 * 60 * 60 * 1000;
            const validRoles = ['président', 'secrétaire', 'trésorier'];
            const ok = s && s.role && validRoles.includes(s.role) &&
                typeof s.time === 'number' &&
                (Date.now() - s.time) < SESSION_DURATION_MS;
            if (!ok) { try { localStorage.removeItem('asufor_session'); } catch (_) {} }
            return ok;
        } catch (e) {
            try { localStorage.removeItem('asufor_session'); } catch (_) {}
            return false;
        }
    }

    const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;
    // ✅ CORRECTION : init défensive. Si la config n'a pas chargé (404) ou si firebase
    // n'est pas disponible, on N'APPELLE PAS firebase.auth() (qui lèverait une exception
    // et interromprait tout le script → erreurs TDZ en cascade sur lockUntil).
    // auth reste null et l'UI affiche un message clair au lieu de planter.
    let auth = null;
    if (!firebaseConfig || typeof firebase === 'undefined') {
        console.error('[ASUFOR] firebase-config.js non chargé !');
    } else {
        try {
            firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            // ✅ Persistance LOCALE explicite (défaut, mais on lève tout doute) :
            //    garantit que le jeton Firebase survit à la navigation entre pages.
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
        } catch (e) {
            console.error('[ASUFOR] Échec initialisation Firebase :', e);
        }
    }

    let code = "";
    let isVerifying = false;

    // ✅ CORRECTION v4 : Anti-brute-force amélioré
    //    • localStorage au lieu de sessionStorage (résiste aux fenêtres privées)
    //    • Durée de verrouillage progressive (30s → 2min → 10min → 1h)
    //    • Clé unique par identifiant (empêche d'attaquer plusieurs comptes en parallèle)
    //    • Historique des tentatives persisté sur 24h
    let failCount = 0;
    let lockUntil = 0;
    const MAX_FAILS = 5;
    let lockLevel = 0; // 0=30s, 1=2min, 2=10min, 3=1h
    const LOCK_DURATIONS_MS = [30000, 120000, 600000, 3600000];
    const LOCK_STORAGE_KEY = 'asufor_lock_v4';
    const LOCK_HISTORY_KEY = 'asufor_lock_history';
    const LOCK_WINDOW_MS = 24 * 60 * 60 * 1000; // 24 heures

    // ✅ Restauration du verrouillage depuis localStorage (résistant aux fenêtres privées)
    try {
        const stored = JSON.parse(localStorage.getItem(LOCK_STORAGE_KEY) || '{}');
        if (stored.lockUntil && stored.lockUntil > Date.now()) {
            lockUntil = stored.lockUntil;
            failCount = stored.failCount || 0;
            lockLevel = stored.lockLevel || 0;
        }
    } catch (_) {}

    const statusEl  = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const cardEl    = document.getElementById('loginCard');
    const keypadEl  = document.getElementById('keypad');

    // ── Étapes : identifiant → code PIN ──
    const stepIdEl       = document.getElementById('stepId');
    const stepPinEl       = document.getElementById('stepPin');
    const idInputEl       = document.getElementById('idInput');
    const btnContinueEl   = document.getElementById('btnContinue');
    const identityValueEl = document.getElementById('identityValue');
    const btnEditIdEl     = document.getElementById('btnEditId');

    function updateContinueState() {
        btnContinueEl.disabled = !idInputEl.value.trim();
    }
    idInputEl.addEventListener('input', updateContinueState);
    idInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !btnContinueEl.disabled) goToPinStep();
    });
    btnContinueEl.addEventListener('click', goToPinStep);
    btnEditIdEl.addEventListener('click', goToIdStep);

    function goToPinStep() {
        const identifiant = idInputEl.value.trim();
        if (!identifiant) return;
        identityValueEl.textContent = identifiant;
        stepIdEl.hidden = true;
        stepPinEl.hidden = false;
        code = "";
        updateDots();
        statusEl.innerHTML = "&nbsp;";
        statusEl.className = "";
        checkLock();
    }

    function goToIdStep() {
        if (isVerifying) return;
        stepPinEl.hidden = true;
        stepIdEl.hidden = false;
        code = "";
        updateDots();
        statusEl.innerHTML = "&nbsp;";
        statusEl.className = "";
        idInputEl.focus();
    }

    // Saisie du code PIN au clavier physique (accessibilité), en plus du pavé tactile.
    document.addEventListener('keydown', (e) => {
        if (stepPinEl.hidden) return;
        if (/^[0-9]$/.test(e.key)) { press(e.key); }
        else if (e.key === 'Backspace') { del(); }
    });

    // ✅ CORRECTION : Firebase = source de vérité pour l'accès aux données.
    //  • user + session locale valide → accès confirmé, on entre dans l'app.
    //  • user SANS session locale valide → état incohérent → on déconnecte Firebase.
    //  • pas de user → on purge la session locale « fantôme ».
    //
    //  ⚠️ CORRECTION BOUCLE DE CONNEXION : pendant une connexion en cours
    //     (isVerifying), on NE FAIT RIEN ici. Sinon une condition de course entre
    //     onAuthStateChanged et le .then() de signInWithEmailAndPassword pouvait
    //     déclencher auth.signOut() PUIS purger la session tout juste écrite →
    //     l'accueil ne trouvait plus de session → retour au clavier de code (boucle).
    //     verify() gère lui-même la redirection après une connexion réussie.
    if (auth) auth.onAuthStateChanged((user) => {
        if (isVerifying) return; // connexion en cours : laisser verify() piloter
        if (user) {
            if (localSessionValid()) {
                window.location.replace('home/accueil.html');
            } else {
                auth.signOut().catch(() => {});
            }
        } else {
            try { localStorage.removeItem('asufor_session'); } catch (_) {}
        }
    });

    function setLockState(locked) {
        const keys = keypadEl.querySelectorAll('.key');
        keys.forEach(k => k.disabled = locked);
    }

    function saveLockState() {
        try {
            localStorage.setItem(LOCK_STORAGE_KEY, JSON.stringify({ lockUntil, failCount, lockLevel }));
        } catch(_) {}
    }

    function recordAttempt(identifiant) {
        try {
            const history = JSON.parse(localStorage.getItem(LOCK_HISTORY_KEY) || '[]');
            history.push({ id: identifiant, time: Date.now() });
            // Garder uniquement les 24 dernières heures
            const cutoff = Date.now() - LOCK_WINDOW_MS;
            const filtered = history.filter(e => e.time > cutoff);
            localStorage.setItem(LOCK_HISTORY_KEY, JSON.stringify(filtered));
            return filtered.filter(e => e.id === identifiant).length;
        } catch(_) {
            return 0;
        }
    }

    function getRecentFailures(identifiant) {
        try {
            const history = JSON.parse(localStorage.getItem(LOCK_HISTORY_KEY) || '[]');
            const cutoff = Date.now() - LOCK_WINDOW_MS;
            return history.filter(e => e.id === identifiant && e.time > cutoff).length;
        } catch(_) {
            return 0;
        }
    }

    function checkLock() {
        if (Date.now() < lockUntil) {
            const remaining = Math.ceil((lockUntil - Date.now()) / 1000);
            statusEl.textContent = `Trop de tentatives. Attendez ${remaining}s.`;
            statusEl.className = 'status-error';
            setLockState(true);
            return true;
        }
        setLockState(false);
        return false;
    }

    function press(n) {
        if (checkLock() || isVerifying) return;
        if (code.length < 6) {
            code += n;
            updateDots();
            if (code.length === 6) verify();
        }
    }

    function del() {
        if (isVerifying) return;
        if (code.length > 0) {
            code = code.slice(0, -1);
            updateDots();
            if (!checkLock()) {
                statusEl.innerHTML = "&nbsp;";
                statusEl.className = "";
            }
        }
    }

    function updateDots() {
        const dots = document.querySelectorAll('.dot');
        dots.forEach((d, i) => {
            d.classList.toggle('active', i < code.length);
        });
    }

    /**
     * ✅ Multi-forage : résout role/forageKey/nom depuis users/{uid} après une
     * connexion Firebase réussie. Chaque compte étant désormais individuel
     * (identifiant = téléphone), l'absence de fiche users/{uid} est une erreur
     * (compte mal configuré) : on déconnecte et on prévient au lieu de deviner
     * un rôle par défaut.
     */
    function resolveSessionProfile(user) {
        const email = user.email || '';
        const isSuper = !!(window.ForageContext && window.ForageContext.isSuperadmin(email));

        return firebase.database().ref('users/' + user.uid).once('value')
            .then((snap) => {
                if (snap.exists()) {
                    const u = snap.val() || {};
                    return {
                        role: u.role,
                        time: Date.now(),
                        email: email,
                        forageKey: u.forageKey || null,
                        nom: u.nom || null,
                        isSuperadmin: isSuper
                    };
                }
                if (isSuper) {
                    return { role: 'président', time: Date.now(), email: email, forageKey: null, nom: 'Super-admin', isSuperadmin: true };
                }
                auth.signOut().catch(() => {});
                triggerError("Compte non configuré. Contactez l'administrateur.");
                return null;
            })
            .catch((lookupErr) => {
                console.warn('[ASUFOR] Résolution profil users/{uid} indisponible :', lookupErr);
                auth.signOut().catch(() => {});
                triggerError("Impossible de vérifier le compte. Réessayez.");
                return null;
            });
    }

    function verify() {
        if (isVerifying) return;

        // ✅ CORRECTION : si la config Firebase n'a pas chargé, message clair plutôt que crash.
        if (!auth) {
            statusEl.textContent = "⚠️ Configuration non chargée. Rechargez la page.";
            statusEl.className = "status-error";
            code = "";
            updateDots();
            return;
        }

        isVerifying = true;

        statusEl.textContent = "Vérification en cours…";
        statusEl.className = "status-info";
        spinnerEl.hidden = false;
        setLockState(true);

        const identifiant = (idInputEl.value || '').trim();
        if (!identifiant) {
            triggerError("Identifiant requis.");
            return;
        }
        // ✅ Miroir de resolveLoginEmail() dans provisioning.js : un identifiant
        //    contenant déjà "@" (adresse réelle du super-admin) est gardé tel quel.
        const email = identifiant.includes('@') ? identifiant : identifiant + '@asufor.local';

        // ✅ CORRECTION : Validation du code avant envoi (6 chiffres uniquement)
        if (!/^\d{6}$/.test(code)) {
            triggerError("Code invalide.");
            return;
        }

        // ✅ CORRECTION v5 : le mot de passe Firebase est désormais un hash dérivé
        //    (SHA-256 de 'asufor_auth_v5:login:pin') — miroir de derivePassword()
        //    dans provisioning.js. On essaie d'abord le mot de passe dérivé
        //    (nouveaux comptes), puis le PIN brut en fallback (comptes créés
        //    avant v5, non encore migrés). Le super-admin (email réel, mot de
        //    passe libre géré en console Firebase) suit le chemin fallback.
        const deriveV5 = async (login, pin) => {
            const material = 'asufor_auth_v5:' + String(login).trim() + ':' + String(pin).trim();
            const data = new TextEncoder().encode(material);
            const buf = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        };

        const signInSmart = async () => {
            if (identifiant.includes('@')) {
                // Adresse réelle (super-admin) : mot de passe saisi tel quel.
                return auth.signInWithEmailAndPassword(email, code);
            }
            const derived = await deriveV5(identifiant, code);
            try {
                return await auth.signInWithEmailAndPassword(email, derived);
            } catch (err) {
                // Fallback comptes pré-v5 (PIN brut comme mot de passe).
                if (err && (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential' || err.code === 'auth/invalid-login-credentials')) {
                    return await auth.signInWithEmailAndPassword(email, code);
                }
                throw err;
            }
        };

        signInSmart()
            .then((cred) => resolveSessionProfile(cred.user))
            .then((sessionData) => {
                if (!sessionData) return; // resolveSessionProfile a déjà géré l'erreur (compte non configuré)
                failCount = 0;
                lockUntil = 0;
                saveLockState();
                try {
                    localStorage.setItem('asufor_session', JSON.stringify(sessionData));
                } catch(e) {
                    console.error('Impossible de sauvegarder la session :', e);
                }
                spinnerEl.hidden = true;
                statusEl.textContent = "Accès autorisé ✓";
                statusEl.className = "status-success";
                setTimeout(() => window.location.replace('home/accueil.html'), 600);
            })
            .catch((e) => {
                console.error("Authentification échouée :", e.code);
                failCount++;
                saveLockState();

                if (failCount >= MAX_FAILS) {
                    lockLevel = Math.min(lockLevel + 1, LOCK_DURATIONS_MS.length - 1);
                    const lockDuration = LOCK_DURATIONS_MS[lockLevel];
                    lockUntil = Date.now() + lockDuration;
                    failCount = 0;
                    saveLockState();
                    const lockLabel = lockDuration >= 3600000 ? '1 heure' :
                                      lockDuration >= 600000 ? '10 minutes' :
                                      lockDuration >= 120000 ? '2 minutes' : '30 secondes';
                    spinnerEl.hidden = true;
                    statusEl.textContent = `Trop de tentatives. Verrouillé ${lockLabel}.`;
                    statusEl.className = "status-error";
                    recordAttempt(identifiant);
                    setTimeout(() => {
                        checkLock();
                        code = "";
                        updateDots();
                        isVerifying = false;
                    }, lockDuration);
                } else {
                    triggerError(`Code incorrect (${failCount}/${MAX_FAILS})`);
                }
            });
    }

    function triggerError(message) {
        spinnerEl.hidden = true;
        statusEl.textContent = message || "Code d'accès incorrect";
        statusEl.className = "status-error";
        cardEl.classList.add('shake');
        setTimeout(() => {
            cardEl.classList.remove('shake');
            code = "";
            updateDots();
            isVerifying = false;
            if (!checkLock()) setLockState(false);
        }, 500);
    }

    // Vérifier le verrouillage au chargement
    checkLock();
</script>
</body>
</html>
