<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="theme-color" content="#f8fafc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Satigué Eau">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satigué Eau – Relevé de compte</title>

    <script src="../biometric.js"></script>
    <script src="../security.js"></script>
    <script src="../loader.js"></script>
    <script src="../sync.js"></script>
    <script src="../firebase-config.js"></script>
    <script src="../admin-config.js"></script>
    <script src="../forage-context.js"></script>
    <script src="../superadmin-village.js"></script>
    <script src="../billing.js"></script>
    <script src="../compta.js"></script>
    <script src="../compta-ui.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script>
        if (typeof window.checkAccess === 'function') window.checkAccess(['président', 'secrétaire', 'trésorier']);
    </script>
    <style>
        /* Dark premium : palette sombre par défaut (l'impression repasse en clair). Les variables --surface / --text-main /
           --border sont aussi utilisées par les fenêtres de compta-ui.js. */
        :root { color-scheme: dark; --bg:#0a0f1c; --surface:#121a2b; --surface-2:#182238; --text-main:#e8edf6; --text-sub:#8fa0ba; --border:#24314b;
                --primary:#3b82f6; --primary-strong:#2563eb; --success:#34d399; --danger:#f87171; --warn:#fbbf24; --shadow:0 2px 10px rgba(0,0,0,.35); }
        * { box-sizing: border-box; }
        html, body { overflow-x: hidden; }
        body { margin:0; background:var(--bg); color:var(--text-main); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        .wrap { max-width: 640px; margin: 0 auto; padding: 12px 12px 48px; }
        .card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:12px; box-shadow:var(--shadow); min-width:0; }

        /* En-tête client */
        .top { display:flex; align-items:center; gap:10px; }
        a.back { flex:none; width:40px; height:40px; border-radius:12px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-sub); text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
        .who { min-width:0; flex:1; }
        h1 { font-size:1.15rem; line-height:1.2; margin:0; font-weight:800; overflow-wrap:anywhere; }
        .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
        .chip { display:inline-flex; align-items:center; gap:5px; font-size:.74rem; font-weight:600; color:var(--text-sub); background:var(--surface-2); border:1px solid var(--border); border-radius:999px; padding:3px 9px; max-width:100%; }
        .chip i { font-size:.68rem; opacity:.85; }
        .sub { color:var(--text-sub); font-size:.8rem; line-height:1.35; }

        /* KPI : 3 principaux, 3 secondaires */
        .kpis { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:12px; }
        .kpi { background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:10px 10px 9px; min-width:0; }
        .kpi .l { font-size:.64rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--text-sub); }
        .kpi .v { font-weight:800; margin-top:3px; overflow-wrap:anywhere; line-height:1.15; }
        .kpi.main .v { font-size:1.02rem; }
        .kpi.solde { background:linear-gradient(160deg, rgba(59,130,246,.18), rgba(59,130,246,.05)); border-color:rgba(59,130,246,.4); }
        .kpis.second .kpi { background:transparent; padding:7px 10px; }
        .kpis.second .kpi .v { font-size:.86rem; }
        .kpis.second { margin-top:8px; }
        .good { color:var(--success); } .bad { color:var(--danger); } .warn { color:var(--warn); }

        /* Actions : une ligne, boutons 44–48 px */
        .actions { display:flex; align-items:stretch; gap:8px; margin-top:12px; position:relative; }
        .btn { min-height:44px; border:1px solid var(--border); border-radius:14px; padding:0 12px; font-weight:700; font-size:.85rem; cursor:pointer; background:var(--surface-2); color:var(--text-main); display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; min-width:0; }
        .btn:active { transform:scale(.98); }
        .btn.primary { background:var(--primary-strong); border-color:var(--primary-strong); color:#fff; box-shadow:0 3px 10px rgba(37,99,235,.35); }
        .btn.danger { background:transparent; color:var(--danger); border-color:rgba(248,113,113,.5); }
        .btn:disabled { opacity:.5; cursor:not-allowed; }
        .actions .btn { flex:1 1 0; }
        .actions .btn.primary { flex:1.3 1 0; }
        .actions .btn.more { flex:none; width:44px; padding:0; }
        .actions .btn[hidden], .actions .btn[style*="display: none"] { display:none !important; }
        .menu { position:absolute; right:0; top:calc(100% + 6px); z-index:20; min-width:220px; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.5); padding:6px; display:none; }
        .menu.open { display:block; }
        .menu a, .menu button { display:flex; align-items:center; gap:10px; width:100%; min-height:44px; padding:0 12px; border:0; background:none; color:var(--text-main); font-size:.9rem; font-weight:600; text-align:left; text-decoration:none; border-radius:10px; cursor:pointer; }
        .menu a:hover, .menu button:hover { background:rgba(148,163,184,.12); }
        .menu i { width:16px; text-align:center; color:var(--text-sub); }

        /* Chronologie : vraie timeline verticale */
        .tl-head { font-weight:800; font-size:.95rem; }
        #timeline { position:relative; margin-top:10px; padding-left:0; }
        #timeline::before { content:""; position:absolute; left:15px; top:6px; bottom:6px; width:2px; background:var(--border); border-radius:2px; }
        .ev { position:relative; padding:0 0 12px 42px; margin:0; min-width:0; }
        .ev:last-child { padding-bottom:0; }
        .ev .dot { position:absolute; left:0; top:0; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.78rem; color:#fff; background:var(--primary-strong); border:3px solid var(--surface); }
        .ev.paiement .dot { background:#059669; } .ev.ajustement .dot { background:#d97706; }
        .ev.annule { opacity:.6; }
        .ev .box { background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:10px 12px; min-width:0; }
        .ev .h { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
        .ev .t { min-width:0; font-weight:700; font-size:.9rem; line-height:1.25; overflow-wrap:anywhere; }
        .ev .amt { flex:none; font-weight:800; font-size:.95rem; white-space:nowrap; text-align:right; }
        .ev .d { color:var(--text-sub); font-size:.72rem; margin-top:3px; }
        .ev .m { font-size:.8rem; margin-top:6px; line-height:1.4; color:var(--text-main); overflow-wrap:anywhere; }
        .ev .m.calc { color:var(--text-sub); font-variant-numeric:tabular-nums; }
        .ev .pr { display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:6px; font-size:.82rem; }
        .ev ul { margin:6px 0 0; padding-left:16px; font-size:.8rem; color:var(--text-sub); }
        .ev .actions { margin-top:8px; }
        .ev .actions .btn { min-height:40px; font-size:.8rem; }
        .pill { display:inline-block; vertical-align:middle; font-size:.62rem; font-weight:800; letter-spacing:.02em; border-radius:999px; padding:2px 8px; margin:0 0 0 6px; background:rgba(148,163,184,.18); color:#cbd5e1; text-transform:uppercase; }
        .pill.payee, .pill.valide { background:rgba(52,211,153,.16); color:#6ee7b7; }
        .pill.partielle, .pill.en_attente { background:rgba(251,191,36,.16); color:#fcd34d; }
        .pill.ouverte { background:rgba(248,113,113,.16); color:#fca5a5; }
        .pill.annulee, .pill.annule, .pill.rejete { background:rgba(148,163,184,.18); color:#a8b5cb; }
        .pill.probleme { background:rgba(249,115,22,.18); color:#fdba74; }
        .empty { color:var(--text-sub); text-align:center; padding:18px; font-size:.85rem; }
        #timeline .empty { padding-left:0; }
        #timeline:has(.empty)::before { display:none; }
        @media (max-width:359px) { .btn span.lbl { display:none; } }
        @media print {
            :root { color-scheme: light; --bg:#fff; --surface:#fff; --surface-2:#fff; --text-main:#000; --text-sub:#444; --border:#999; --success:#166534; --danger:#991b1b; --warn:#92400e; --shadow:none; }
            .no-print, .actions, .ev .btn, .menu { display:none !important; } body { background:#fff; color:#000; }
            .ev .dot { border-color:#fff; }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="top">
            <a class="back no-print" href="../statistiques/stats.html" aria-label="Retour aux statistiques" title="Statistiques"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="who">
                <h1 id="client">Relevé de compte</h1>
                <div class="chips" id="meta"><span class="chip">Chargement…</span></div>
            </div>
        </div>
        <div id="compta-migration" style="display:none"></div>
        <div class="kpis">
            <div class="kpi main"><div class="l">Facturé</div><div class="v" id="t-facture">—</div></div>
            <div class="kpi main"><div class="l">Payé</div><div class="v good" id="t-paye">—</div></div>
            <div class="kpi main solde"><div class="l">Solde à payer</div><div class="v" id="t-solde">—</div></div>
        </div>
        <div class="kpis second">
            <div class="kpi"><div class="l">Arriérés</div><div class="v bad" id="t-arrieres">—</div></div>
            <div class="kpi"><div class="l">Avance</div><div class="v good" id="t-avance">—</div></div>
            <div class="kpi"><div class="l">Ajustements</div><div class="v" id="t-ajust">—</div></div>
        </div>
        <div class="sub" id="provisoire" style="margin-top:8px"></div>
        <div class="actions no-print">
            <button class="btn primary" id="btn-pay" style="display:none"><i class="fa-solid fa-hand-holding-dollar"></i><span class="lbl">Encaisser</span></button>
            <button class="btn" id="btn-adj" style="display:none"><i class="fa-solid fa-scale-balanced"></i><span class="lbl">Ajustement</span></button>
            <button class="btn" id="btn-print" onclick="window.print()"><i class="fa-solid fa-print"></i><span class="lbl">Imprimer</span></button>
            <button class="btn more" id="btn-more" aria-haspopup="true" aria-expanded="false" aria-label="Plus d'actions"><i class="fa-solid fa-ellipsis-vertical"></i></button>
            <div class="menu" id="menu" role="menu">
                <a href="../statistiques/stats.html" role="menuitem"><i class="fa-solid fa-chart-column"></i> Statistiques</a>
                <button id="mi-refresh" role="menuitem"><i class="fa-solid fa-rotate"></i> Actualiser l'affichage</button>
                <button id="mi-copy" role="menuitem"><i class="fa-regular fa-copy"></i> Copier le n° de compteur</button>
            </div>
        </div>
    </div>
    <div class="card">
        <div class="tl-head">Chronologie</div>
        <div class="sub">Factures, paiements et ajustements, du plus ancien au plus récent.</div>
        <div id="timeline"><div class="empty">Chargement…</div></div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update, push, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Lecture protégée (délai maximal + nouvelles tentatives, voir sync.js) : jamais de chargement infini.

const sget = (r) => window.AsuforSync ? window.AsuforSync.safeGet(get, r) : get(r);

const app = initializeApp(window.ASUFOR_FIREBASE_CONFIG);
const db = getDatabase(app);
const auth = getAuth(app);
const P = window.ForageContext.paths();
const C = window.Compta, UI = window.ComptaUI, B = window.Billing;
const esc = UI.esc, fcfa = UI.fcfa, cyc = UI.cycleLabel;
const session = JSON.parse(localStorage.getItem('asufor_session') || '{}');
const role = session.role;
const cid = new URLSearchParams(location.search).get('c');
let releve = null;

const dt = (iso) => iso ? new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const SOURCES = { cloture: 'clôture mensuelle', migration_backup: 'reprise des archives', correction_releve: 'relevé corrigé' };
const TYPES = { remise: 'Remise', majoration: 'Majoration', correction: 'Correction', annulation: 'Annulation de facture' };
const STATUTS = { ouverte: 'ouverte', partielle: 'partielle', payee: 'payée', annulee: 'annulée', valide: 'validé', annule: 'annulé', en_attente: 'en attente', rejete: 'rejeté' };

function toast(msg) { alert(msg); }
function setMeta(numero, zone) {
    document.getElementById('meta').innerHTML =
        `<span class="chip"><i class="fa-solid fa-gauge"></i>Compteur n°${esc(numero || '—')}</span>` +
        `<span class="chip"><i class="fa-solid fa-location-dot"></i>${esc(zone || 'Sans zone')}</span>`;
}

function render() {
    const S = UI.getState();
    const acc = C.computeAccount(S, cid);
    const du = C.amountDueNow(S, cid, releve);
    document.getElementById('t-facture').textContent = fcfa(acc.total_facture);
    document.getElementById('t-paye').textContent = fcfa(acc.total_paye);
    document.getElementById('t-ajust').textContent = (acc.total_ajustements > 0 ? '+' : '') + fcfa(acc.total_ajustements);
    document.getElementById('t-arrieres').textContent = fcfa(acc.arrieres);
    document.getElementById('t-avance').textContent = fcfa(acc.avance);
    const sol = document.getElementById('t-solde');
    sol.textContent = acc.solde < 0 ? 'Crédit ' + fcfa(-acc.solde) : fcfa(acc.solde);
    sol.className = 'v ' + (acc.solde > 0 ? 'bad' : 'good');
    document.getElementById('provisoire').textContent = du.facture_provisoire
        ? `Relevé du mois en cours : ${fcfa(du.facture_provisoire)} (facturé à la clôture) — total dû aujourd'hui : ${fcfa(du.total_du)}.`
        : '';

    const canPay = UI.canCollect() && UI.isMigrated();
    const bp = document.getElementById('btn-pay');
    bp.style.display = UI.canCollect() ? '' : 'none';
    bp.disabled = !canPay;
    document.getElementById('btn-adj').style.display = (UI.canCollect() && UI.isMigrated()) ? '' : 'none';
    UI.migrationBanner(document.getElementById('compta-migration'), render);

    const events = [];
    acc.factures.forEach(f => events.push({ t: f.date_creation, kind: 'facture', f }));
    acc.paiements.forEach(p => events.push({ t: p.date_paiement, kind: 'paiement', p }));
    acc.ajustements.forEach(j => events.push({ t: j.created_at, kind: 'ajustement', j }));
    events.sort((a, b) => Date.parse(a.t) - Date.parse(b.t));

    const tl = document.getElementById('timeline');
    if (!events.length) { tl.innerHTML = `<div class="empty">${UI.isMigrated() ? 'Aucune écriture comptable pour ce compteur.' : 'Comptabilité non encore initialisée (migration requise).'}</div>`; return; }
    tl.innerHTML = events.map(e => {
        if (e.kind === 'facture') {
            const f = e.f;
            const prob = f.probleme && f.probleme.actif
                ? `<span class="pill probleme">${f.probleme.resolu ? '✓ problème résolu' : '⚠ surconsommation ' + esc(f.probleme.valeur_m3) + ' m³'}</span>` : '';
            const canResolve = f.probleme && f.probleme.actif && !f.probleme.resolu && (role === 'président' || role === 'secrétaire');
            return `<div class="ev facture ${f.annulee ? 'annule' : ''}"><span class="dot"><i class="fa-solid fa-file-invoice"></i></span><div class="box">
                <div class="h"><div class="t">Facture ${esc(cyc(f.cycle))}<span class="pill ${f.statut}">${STATUTS[f.statut] || f.statut}</span>${prob}</div><div class="amt">${fcfa(f.montant_net)}</div></div>
                <div class="d">${dt(f.date_creation)} · ${esc(SOURCES[f.source] || f.source)}</div>
                ${f.ancien_index != null ? `<div class="m calc">Index ${esc(f.ancien_index)} → ${esc(f.nouvel_index)} · ${esc(f.consommation)} m³ × ${esc(f.facteur)} F = ${fcfa(f.montant_initial)}${f.montant_net !== f.montant_initial ? ` · net après ajustements : <b>${fcfa(f.montant_net)}</b>` : ''}</div>` : (f.montant_net !== f.montant_initial ? `<div class="m calc">Net après ajustements : <b>${fcfa(f.montant_net)}</b></div>` : '')}
                <div class="pr"><span>Payé : <b class="good">${fcfa(f.montant_paye)}</b></span><span>Reste : <b class="${f.reste_a_payer > 0 ? 'bad' : 'good'}">${fcfa(f.reste_a_payer)}</b></span></div>
                ${f.probleme && f.probleme.resolu && f.probleme.resolution ? `<div class="d">Problème résolu le ${dt(f.probleme.resolution.resolu_le)} : ${esc(f.probleme.resolution.motif)} (résolu ≠ payé)</div>` : ''}
                ${canResolve ? `<div class="actions"><button class="btn small" data-resolve="${esc(f.facture_id)}"><i class="fa-solid fa-screwdriver-wrench"></i> Marquer le problème résolu</button></div>` : ''}
            </div></div>`;
        }
        if (e.kind === 'paiement') {
            const p = e.p;
            const affs = Object.entries((S.affectations[p.paiement_id]) || {}).sort((a, b) => (a[1].ordre || 0) - (b[1].ordre || 0))
                .map(([fid, a]) => `<li>${esc(cyc(a.cycle))} : ${fcfa(a.montant)}${a.statut === 'annulee' ? ' <i>(annulée)</i>' : ''}</li>`).join('');
            const valide = p.statut === 'valide';
            return `<div class="ev paiement ${valide ? '' : 'annule'}"><span class="dot"><i class="fa-solid fa-hand-holding-dollar"></i></span><div class="box">
                <div class="h"><div class="t">Paiement · reçu n°${esc(p.numero_recu)}<span class="pill ${p.statut}">${STATUTS[p.statut] || p.statut}</span></div><div class="amt good">+${fcfa(p.montant)}</div></div>
                <div class="d">${dt(p.date_paiement)} · ${esc(C.MODES_LABEL[p.mode] || p.mode)}${p.reference ? ' · réf. ' + esc(p.reference) : ''} · par ${esc(p.encaisse_par_nom || p.role || '—')}</div>
                ${affs ? `<ul>${affs}</ul>` : '<div class="m">Aucune facture réglée : montant conservé en avance.</div>'}
                ${valide && p.disponible > 0 ? `<div class="m good">Avance disponible sur ce paiement : ${fcfa(p.disponible)}</div>` : ''}
                ${!valide ? `<div class="m bad">Annulé le ${dt(p.annule_le)} : ${esc(p.motif_annulation || '')}</div>` : ''}
                <div class="actions">
                    <button class="btn small" data-recu="${esc(p.paiement_id)}"><i class="fa-solid fa-receipt"></i> Reçu</button>
                    ${valide && role === 'président' ? `<button class="btn small danger" data-cancel="${esc(p.paiement_id)}"><i class="fa-solid fa-ban"></i> Annuler</button>` : ''}
                </div>
            </div></div>`;
        }
        const j = e.j;
        const signe = j.type === 'remise' ? -Math.abs(j.montant) : (j.type === 'majoration' ? Math.abs(j.montant) : (j.type === 'annulation' ? -Math.abs(j.montant) : j.montant));
        return `<div class="ev ajustement ${j.statut === 'rejete' ? 'annule' : ''}"><span class="dot"><i class="fa-solid fa-scale-balanced"></i></span><div class="box">
            <div class="h"><div class="t">${esc(TYPES[j.type] || j.type)} · ${esc(cyc(j.cycle))}<span class="pill ${j.statut}">${STATUTS[j.statut] || j.statut}</span></div><div class="amt ${signe > 0 ? 'bad' : 'good'}">${signe > 0 ? '+' : ''}${fcfa(signe)}</div></div>
            <div class="d">${dt(j.created_at)} · proposé par ${esc(j.cree_par_nom || '—')}${j.date_validation ? ' · ' + (j.statut === 'valide' ? 'validé' : 'traité') + ' le ' + dt(j.date_validation) + (j.valide_par_nom ? ' par ' + esc(j.valide_par_nom) : '') : ''}</div>
            <div class="m">Motif : ${esc(j.motif)}</div>
            ${j.statut === 'en_attente' && role === 'président' ? `<div class="actions"><button class="btn small primary" data-validate="${esc(j.ajustement_id)}">Valider</button><button class="btn small danger" data-reject="${esc(j.ajustement_id)}">Rejeter</button></div>` : ''}
        </div></div>`;
    }).join('');
}

function withMotif(title, label, onOk) {
    const m = UI.modal(`<h3>${esc(title)}</h3><label for="mot">${esc(label)}</label><textarea id="mot" rows="3" maxlength="300"></textarea><div class="cui-err" id="err"></div><div class="cui-act"><button class="cui-ghost" id="no">Annuler</button><button class="cui-primary" id="ok">Confirmer</button></div>`);
    m.q('#no').onclick = m.close;
    m.q('#ok').onclick = () => {
        const motif = m.q('#mot').value.trim();
        if (motif.length < 3) { m.q('#err').textContent = 'Le motif est obligatoire.'; return; }
        m.q('#ok').disabled = true;
        onOk(motif).then(() => { m.close(); render(); }, (e) => { m.q('#ok').disabled = false; m.q('#err').textContent = e.message || String(e); });
    };
}

function openAdjustment() {
    const acc = C.computeAccount(UI.getState(), cid);
    const fs = acc.factures.filter(f => !f.annulee);
    if (!fs.length) { toast('Aucune facture à ajuster pour ce compteur.'); return; }
    const pres = role === 'président';
    const m = UI.modal(`<h3>Ajustement</h3><p class="cui-sub">${pres ? 'Validé immédiatement (président) ou laissé en attente.' : 'Proposition soumise à la validation du président.'}</p>
        <label for="fac">Facture</label><select id="fac">${fs.map(f => `<option value="${esc(f.facture_id)}">${esc(cyc(f.cycle))} — net ${fcfa(f.montant_net)}, reste ${fcfa(f.reste_a_payer)}</option>`).join('')}</select>
        <label for="typ">Type</label><select id="typ"><option value="remise">Remise (−)</option><option value="majoration">Majoration (+)</option><option value="correction">Correction (±)</option><option value="annulation">Annulation de la facture</option></select>
        <label for="mnt">Montant (F)${' '}<small>(correction : négatif pour réduire)</small></label><input id="mnt" type="number" step="1">
        <label for="mot">Motif (obligatoire)</label><textarea id="mot" rows="2" maxlength="300"></textarea>
        ${pres ? '<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="val" checked style="width:auto"> Valider immédiatement</label>' : ''}
        <div class="cui-err" id="err"></div>
        <div class="cui-act"><button class="cui-ghost" id="no">Annuler</button><button class="cui-primary" id="ok">Enregistrer</button></div>`);
    const syncType = () => { m.q('#mnt').disabled = m.q('#typ').value === 'annulation'; };
    m.q('#typ').onchange = syncType; syncType();
    m.q('#no').onclick = m.close;
    m.q('#ok').onclick = () => {
        m.q('#ok').disabled = true; m.q('#err').textContent = '';
        UI.run((S, base) => C.buildAdjustmentOps(S, { ...base, factureId: m.q('#fac').value, type: m.q('#typ').value, montant: Number(m.q('#mnt').value), motif: m.q('#mot').value, valider: pres && m.q('#val').checked, releve }))
            .then(() => { m.close(); render(); }, (e) => { m.q('#ok').disabled = false; m.q('#err').textContent = e.message || String(e); });
    };
}

document.getElementById('timeline').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.recu) window.open(`recu.html?p=${encodeURIComponent(b.dataset.recu)}`, '_blank');
    else if (b.dataset.cancel) withMotif('Annuler ce paiement', "Motif de l'annulation (obligatoire)", (motif) =>
        UI.run((S, base) => C.buildPaymentCancelOps(S, { ...base, paiementId: b.dataset.cancel, motif, releve })));
    else if (b.dataset.resolve) withMotif('Résoudre le problème', 'Comment le problème a-t-il été résolu ? (résolu ≠ payé)', (motif) =>
        UI.run((S, base) => C.buildProblemResolutionOps(S, { ...base, factureId: b.dataset.resolve, motif })));
    else if (b.dataset.validate || b.dataset.reject) {
        const id = b.dataset.validate || b.dataset.reject, decision = b.dataset.validate ? 'valide' : 'rejete';
        if (!confirm(decision === 'valide' ? 'Valider cet ajustement ?' : 'Rejeter cet ajustement ?')) return;
        UI.run((S, base) => C.buildAdjustmentValidationOps(S, { ...base, ajustementId: id, decision, releve })).then(render, (err) => toast(err.message));
    }
});
document.getElementById('btn-pay').onclick = () => UI.openPaymentDialog({
    compteurId: cid, releve, client: releve && releve.name, numero: releve && releve.numero_compteur,
    recuUrl: (pid) => `recu.html?p=${encodeURIComponent(pid)}`, onDone: render
});
document.getElementById('btn-adj').onclick = openAdjustment;

const menu = document.getElementById('menu'), more = document.getElementById('btn-more');
const setMenu = (open) => { menu.classList.toggle('open', open); more.setAttribute('aria-expanded', String(open)); };
more.onclick = (e) => { e.stopPropagation(); setMenu(!menu.classList.contains('open')); };
document.addEventListener('click', () => setMenu(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
document.getElementById('mi-refresh').onclick = () => { setMenu(false); render(); };
document.getElementById('mi-copy').onclick = () => {
    setMenu(false);
    const n = (releve && releve.numero_compteur) || '';
    if (navigator.clipboard && n) navigator.clipboard.writeText(String(n)).catch(() => {});
};

onAuthStateChanged(auth, async (user) => {
    if (!user) { if (window.handleFirebaseSessionLoss) window.handleFirebaseSessionLoss('releve.html'); return; }
    if (!cid) { document.getElementById('meta').innerHTML = '<span class="chip">Compteur non précisé</span>'; return; }
    UI.init({ db, ref, get, update, push, onValue, P, session, getUid: () => auth.currentUser && auth.currentUser.uid });
    if (window.AsuforSync && !window.__relSyncOn) { window.__relSyncOn = true; window.AsuforSync.init({ db, ref, onValue }); }
    try {
        const snap = await sget(ref(db, `${P.compteurs}/${cid}`));
        releve = snap.exists() ? snap.val() : null;
        const src = releve || (Object.values(UI.getState().factures).find(f => f.compteur_id === cid) || {});
        document.getElementById('client').textContent = (releve ? releve.name : src.client) || 'Client';
        setMeta(releve ? releve.numero_compteur : src.numero_compteur, releve ? releve.zone : src.zone);
    } catch (e) {
        document.getElementById('meta').innerHTML = '<span class="chip">Lecture impossible (' + esc(e.code || e.message) + ')</span>';
    }
    UI.subscribe((st, mig, ready) => { if (ready) render(); });
});
</script>
</body>
</html>
