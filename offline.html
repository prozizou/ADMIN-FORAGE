<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8fafc">
    <title>Hors ligne — ASUFOR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: #ffffff;
            border: 1px solid rgba(15, 23, 42, 0.1);
            border-radius: 28px;
            padding: 40px 30px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12);
        }
        .icon {
            width: 96px; height: 96px;
            margin: 0 auto 20px;
            border-radius: 24px;
            background: #0c4a6e;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .icon img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 22px; margin-bottom: 10px; }
        p { font-size: 14.5px; line-height: 1.6; opacity: 0.75; margin-bottom: 24px; }
        button {
            background: #38bdf8; color: #08131f;
            border: none; padding: 13px 28px;
            border-radius: 24px; font-weight: 700; font-size: 14.5px;
            cursor: pointer; transition: filter 0.15s;
        }
        button:active { filter: brightness(0.9); }
        .dot {
            display: inline-block; width: 9px; height: 9px;
            border-radius: 50%; background: #ef4444; margin-right: 7px;
            vertical-align: middle; animation: pulse 1.5s ease infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .status { font-size: 12.5px; opacity: 0.6; margin-top: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">
            <img src="icons/icon-192.png" alt="ASUFOR" onerror="this.parentNode.textContent='💧'">
        </div>
        <h1>Vous êtes hors ligne</h1>
        <p>ASUFOR a besoin d'une connexion pour charger les données à jour. Vérifiez votre réseau puis réessayez.</p>
        <button onclick="location.reload()">Réessayer</button>
        <div class="status"><span class="dot"></span><span id="net">Connexion perdue</span></div>
    </div>
    <script>
        function refresh() {
            if (navigator.onLine) {
                document.getElementById('net').textContent = 'Connexion rétablie — rechargement…';
                setTimeout(function () { location.reload(); }, 600);
            }
        }
        window.addEventListener('online', refresh);
    </script>
</body>
</html>
