<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#f8fafc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Satigué Eau">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">

    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un Agent – Satigué Eau</title>

    <script src="../biometric.js"></script>
    <script src="../security.js"></script>
    <!-- ✅ Overlay de chargement partagé -->
    <script src="../loader.js"></script>
    <script src="../sync.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="../firebase-config.js"></script>
    <!-- ✅ Multi-forage : résolution des chemins (mode legacy = chemins actuels) -->
    <script src="../admin-config.js"></script>
    <script src="../forage-context.js"></script>
    <!-- ✅ Vue à 360° super-admin : sélecteur de village -->
    <script src="../superadmin-village.js"></script>
    <!-- ✅ Sécurité : hachage SHA-256 des passcodes agents -->
    <script src="../crypto.js"></script>

    <style>
        /* ── Parcours guidé plutôt que formulaire d'administration ──
           Fond clair uniforme → titre sombre → explication courte → champs
           bien contrastés → bouton bleu principal (seule couleur d'action). */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --border-color: rgba(15, 23, 42, 0.09);
            --field-bg: rgba(15, 23, 42, 0.04);
            --accent-blue: #0284c7;
            --text-white: #1e293b;
            --text-muted: rgba(30, 41, 59, 0.6);
            --error: #dc2626;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            background: var(--bg-color);
            color: var(--text-white);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 28px 18px 40px;
        }

        /* ✅ v2 : la carte apparaît près du haut de l'écran sur mobile, au
           lieu de flotter au centre d'un grand vide. */
        .card {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 26px 22px 24px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
        }

        .brand-logo {
            display: block;
            width: 48px;
            height: 48px;
            margin: 0 0 10px;
        }

        h1 {
            margin: 0 0 4px;
            font-weight: 700;
            color: var(--text-white);
            font-size: 1.3rem;
        }
        .subtitle {
            margin: 0 0 26px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .field { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 0.82rem;
            font-weight: 600;
            color: rgba(30, 41, 59, 0.85);
        }
        .req { color: var(--accent-blue); }

        input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 12px;
            background: var(--field-bg);
            border: 1px solid var(--border-color);
            color: var(--text-white);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            box-sizing: border-box;
        }
        input::placeholder { color: rgba(30, 41, 59, 0.4); }

        input:focus {
            border-color: var(--accent-blue);
            background: rgba(15, 23, 42, 0.02);
        }

        input.error { border-color: var(--error); }

        .field-hint {
            margin: 7px 2px 0;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* Téléphone : indicatif visuel (n'entre pas dans la valeur envoyée) */
        .tel-row { display: flex; gap: 8px; }
        .tel-prefix {
            flex: none;
            display: flex; align-items: center; justify-content: center;
            padding: 0 12px;
            border-radius: 12px;
            background: var(--field-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.95rem;
            font-weight: 600;
        }
        .tel-row input { flex: 1; min-width: 0; }

        /* Code d'accès : bouton œil pour vérifier avant de valider */
        .pass-row { position: relative; }
        .pass-row input { padding-right: 46px; letter-spacing: 3px; }
        .eye-btn {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 34px; height: 34px;
            background: none; border: none; border-radius: 8px;
            color: var(--text-muted); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .eye-btn:hover { color: var(--accent-blue); background: rgba(15, 23, 42, 0.05); }
        .eye-btn svg { width: 19px; height: 19px; }

        /* ✅ v2 : explication courte avant de valider — ce qui va se passer */
        .pre-submit-note {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.18);
            border-radius: 12px;
            padding: 10px 12px;
            margin: 4px 0 18px;
        }

        /* ✅ v2 : plus de MAJUSCULES sur les libellés / le bouton — moins dur,
           plus naturel à lire */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--accent-blue);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:active { transform: scale(0.97); }
        .btn-submit:disabled { opacity: 0.65; cursor: not-allowed; }

        /* État "chargement" du bouton — visible, pas juste un texte changé */
        .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: rgba(30, 41, 59, 0.72);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: color 0.2s;
        }
        .footer-link:hover { color: var(--accent-blue); }

        #msg {
            text-align: center;
            font-size: 0.88rem;
            margin-top: 14px;
            min-height: 0;
            font-weight: 600;
            line-height: 1.4;
        }
        #msg .msg-title { display: block; }
        #msg .msg-detail { display: block; margin-top: 3px; font-size: 0.82rem; font-weight: 500; opacity: 0.85; }
        .msg-success .msg-title { color: var(--success); }
        .msg-error   .msg-title { color: var(--error); }

        @media (max-width: 380px) {
            .card { padding: 22px 16px; }
            h1 { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <div class="card">
        <img class="brand-logo" src="../icons/logo.png" alt="Satigué Eau">
        <h1>Ajouter un agent</h1>
        <p class="subtitle">Créez l'accès d'un nouvel agent.</p>

        <div class="field">
            <label for="agent_name">Nom complet <span class="req">*</span></label>
            <input type="text" id="agent_name" placeholder="Ex : Abou Diop" autocomplete="off" maxlength="100">
        </div>

        <div class="field">
            <label for="agent_tel">Numéro de téléphone <span class="req">*</span></label>
            <div class="tel-row">
                <span class="tel-prefix">+221</span>
                <input type="tel" id="agent_tel" placeholder="77 507 67 70" inputmode="tel" maxlength="15">
            </div>
        </div>

        <div class="field">
            <!-- ✅ CORRECTION : passcode agent stocké haché côté serveur (cf. Firebase Rules) -->
            <!-- ⚠️  Le passcode est actuellement stocké en clair dans Firebase.
                      Recommandation : hacher côté Firebase Functions avec bcrypt avant stockage. -->
            <label for="agent_pass">Code d'accès à 6 chiffres <span class="req">*</span></label>
            <div class="pass-row">
                <input type="password" id="agent_pass" placeholder="••••••" maxlength="6" inputmode="numeric" autocomplete="new-password">
                <button type="button" class="eye-btn" id="btnTogglePass" onclick="togglePasscodeVisibility()" aria-label="Afficher le code">
                    <svg id="eyeIconShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg id="eyeIconHide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden>
                        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.86 21.86 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.9 21.9 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
            </div>
            <p class="field-hint">Ce code permettra à l'agent de se connecter.</p>
        </div>

        <div class="field">
            <label for="agent_zone">Zone ou quartier <span class="req">*</span></label>
            <input type="text" id="agent_zone" placeholder="Ex : HLM 2" autocomplete="off" maxlength="50">
            <p class="field-hint">Le secteur où l'agent effectuera ses relevés de compteurs.</p>
        </div>

        <p class="pre-submit-note">Une fois créé, l'agent pourra se connecter avec son numéro de téléphone et son code d'accès.</p>

        <button class="btn-submit" id="btnEnreg" onclick="sendToFirebase()">
            <span class="spinner" id="btnSpinner" hidden></span>
            <span id="btnText">Créer l'agent</span>
        </button>

        <div id="msg" role="alert"></div>

        <a href="../home/accueil.html" class="footer-link">← Retour à l'accueil</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set, query, orderByChild, equalTo, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // ✅ CORRECTION : Vérification d'accès avant tout chargement
        const session = window.checkAccess(['président', 'secrétaire']);
        if (!session) throw new Error('Accès refusé');

        const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;
        // Lecture protégée (délai maximal + nouvelles tentatives, voir sync.js) : jamais de chargement infini.
        const sget = (r) => window.AsuforSync ? window.AsuforSync.safeGet(get, r) : get(r);
        const app  = initializeApp(firebaseConfig);
        const db   = getDatabase(app);
        const auth = getAuth(app);
        // ✅ Chemins Firebase du forage courant (legacy → db_agents, etc.)
        const P = window.ForageContext.paths();

        // ✅ Vue à 360° super-admin : sélecteur de village (aucun effet pour les autres rôles)
        if (window.SuperadminVillage) window.SuperadminVillage.init({ db, get, ref, session });

        const msgEl     = document.getElementById('msg');
        const btn       = document.getElementById('btnEnreg');
        const btnTxt    = document.getElementById('btnText');
        const btnSpin   = document.getElementById('btnSpinner');

        // ✅ v2 : message en deux temps (titre + détail), formulé comme une
        // phrase humaine plutôt qu'un message technique.
        function showMsg(title, detail, isError = false) {
            msgEl.innerHTML = `<span class="msg-title">${title}</span>` +
                (detail ? `<span class="msg-detail">${detail}</span>` : '');
            msgEl.className = isError ? 'msg-error' : 'msg-success';
        }
        function clearMsg() { msgEl.innerHTML = ''; msgEl.className = ''; }

        function clearErrors() {
            document.querySelectorAll('input.error').forEach(i => i.classList.remove('error'));
        }

        function markError(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add('error');
        }

        // ✅ v2 : état "chargement" visible sur le bouton (spinner + libellé
        // unique "Création…"), pas seulement un texte qui change.
        function setLoading(isLoading) {
            btn.disabled = isLoading;
            btnSpin.hidden = !isLoading;
            btnTxt.textContent = isLoading ? 'Création…' : "Créer l'agent";
        }

        // ✅ v2 : icône œil pour vérifier le code avant de valider
        window.togglePasscodeVisibility = function () {
            const input = document.getElementById('agent_pass');
            const showIcon = document.getElementById('eyeIconShow');
            const hideIcon = document.getElementById('eyeIconHide');
            const willShow = input.type === 'password';
            input.type = willShow ? 'text' : 'password';
            showIcon.hidden = willShow;
            hideIcon.hidden = !willShow;
            document.getElementById('btnTogglePass').setAttribute(
                'aria-label', willShow ? 'Masquer le code' : 'Afficher le code'
            );
        };

        // ✅ CORRECTION : Normalisation du numéro de téléphone
        function normalizePhone(tel) {
            return tel.replace(/[\s\-\.]/g, '');
        }

        window.sendToFirebase = async function () {
            clearErrors();
            clearMsg();
            const name  = document.getElementById('agent_name').value.trim();
            const tel   = normalizePhone(document.getElementById('agent_tel').value.trim());
            const pass  = document.getElementById('agent_pass').value;
            const zone  = document.getElementById('agent_zone').value.trim();

            let valid = true;
            if (!name)  { markError('agent_name'); valid = false; }
            if (!tel)   { markError('agent_tel');  valid = false; }
            if (!pass)  { markError('agent_pass'); valid = false; }
            if (!zone)  { markError('agent_zone'); valid = false; }

            if (!valid) { showMsg('Certains champs sont manquants', 'Merci de remplir tous les champs marqués d\'une *.', true); return; }

            if (!/^\d{6}$/.test(pass)) {
                markError('agent_pass');
                showMsg('Code d\'accès invalide', 'Il doit contenir exactement 6 chiffres.', true);
                return;
            }

            if (!/^\d{7,15}$/.test(tel)) {
                markError('agent_tel');
                showMsg('Numéro de téléphone invalide', 'Il doit contenir entre 7 et 15 chiffres, sans l\'indicatif.', true);
                return;
            }

            // ✅ CORRECTION : Validation longueur du nom
            if (name.length < 2 || name.length > 100) {
                markError('agent_name');
                showMsg('Nom trop court ou trop long', 'Le nom doit contenir entre 2 et 100 caractères.', true);
                return;
            }

            setLoading(true);

            // ✅ CORRECTION : Vérification doublon par téléphone avant insertion
            try {
                const existing = await sget(
                    query(ref(db, P.agents), orderByChild('agent_tel'), equalTo(tel))
                );
                if (existing.exists()) {
                    markError('agent_tel');
                    showMsg('Ce numéro est déjà utilisé', 'Un agent possède déjà ce numéro de téléphone.', true);
                    setLoading(false);
                    return;
                }
            } catch (e) {
                // En cas d'erreur de lecture, on continue (la Security Rule bloquera si non autorisé)
                console.warn('Vérification doublon échouée :', e);
            }

            if (window.AsuforLoader) AsuforLoader.show('Création de l\'agent…');

            // ✅ Attendre que Firebase Auth soit prêt
            await new Promise((resolve) => {
                const unsub = onAuthStateChanged(auth, (user) => {
                    unsub();
                    resolve(user);
                });
            });

            try {
                // ✅ Siège dérivé du forage réel de l'utilisateur (Asufor/{forageKey}/config.siege),
                // jamais "DIANDIOLY" en dur — sinon un agent créé pour un AUTRE village se
                // retrouve avec le siège de Diandioly.
                let siege = 'SATIGUE EAU';
                try {
                    const cfgSnap = await sget(ref(db, P.config));
                    const cfg = cfgSnap.exists() ? cfgSnap.val() : {};
                    siege = (cfg.siege || cfg.nom || 'SATIGUE EAU').toUpperCase();
                } catch (_) { /* garde le repli générique */ }

                const agentsRef   = ref(db, P.agents);
                const newAgentRef = push(agentsRef);
                const uniqueId    = newAgentRef.key;

                // ✅ CORRECTION v4 : Hachage SHA-256 du passcode avant stockage.
                //    Le passcode en clair n'est plus écrit dans Firebase.
                //    La vérification terrain se fait via ASUFORCrypto.verifyAgentPasscode().
                const hashedPasscode = await window.ASUFORCrypto.hashAgentPasscode(pass);

                await set(newAgentRef, {
                    agent:          name,
                    agent_id:       uniqueId,
                    agent_tel:      tel,
                    passcode_hash:  hashedPasscode,  // hash SHA-256 (ne jamais stocker en clair)
                    id_source:      "267b175fb210e9be",
                    key:            uniqueId,
                    siege:          siege,
                    zone:           zone,
                    created_at:     new Date().toISOString()
                });

                showMsg('Agent créé avec succès', name + ' peut maintenant accéder à son espace avec son numéro de téléphone et son code.');
                document.getElementById('agent_name').value = '';
                document.getElementById('agent_tel').value  = '';
                document.getElementById('agent_pass').value = '';
                document.getElementById('agent_zone').value = '';

            } catch (error) {
                console.error('Erreur Firebase :', error);
                showMsg('Une erreur est survenue', error.message, true);
            } finally {
                if (window.AsuforLoader) AsuforLoader.hide();
                setLoading(false);
            }
        };
    </script>
</body>
</html>
