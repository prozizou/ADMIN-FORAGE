name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests unitaires billing.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # billing.js n'a aucune dépendance : on lance directement les tests.
      - name: Run billing tests
        run: node scripts/billing.test.js
