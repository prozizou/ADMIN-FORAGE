<!DOCTYPE html>
<html lang="fr">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#f8fafc">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ASUFOR">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">

    <link rel="manifest" href="../manifest.json">
    <script src="../pwa.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon équipe – ASUFOR</title>

    <script src="../security.js"></script>
    <!-- ✅ Overlay de chargement partagé -->
    <script src="../loader.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="../firebase-config.js"></script>
    <!-- ✅ Multi-forage : résolution des chemins (mode legacy = chemins actuels) -->
    <script src="../admin-config.js"></script>
    <script src="../forage-context.js"></script>

    <style>
        :root {
            --bg-color: #f0f2f5;
            --glass-bg: #ffffff;
            --glass-border: rgba(15, 23, 42, 0.1);
            --accent-blue: #0284c7;
            --text-white: #1e293b;
            --error: #dc2626;
            --success: #16a34a;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .wrap { max-width: 640px; margin: 0 auto; }

        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .top-nav a { color: var(--accent-blue); text-decoration: none; font-size: 0.85rem; }

        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
            margin-bottom: 25px;
        }

        h2 { margin: 0 0 25px 0; font-weight: 600; color: var(--accent-blue); font-size: 1.25rem; }

        .field { margin-bottom: 18px; }
        .pin-wrap { position: relative; }
        .pin-wrap input { padding-right: 46px; }
        .pin-toggle {
            position: absolute;
            top: 50%;
            right: 6px;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            font-size: 1.1rem;
            line-height: 1;
            opacity: 0.6;
        }
        .pin-toggle:hover { opacity: 1; }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }
        input, select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.03);
            border: 1px solid var(--glass-border);
            color: var(--text-white);
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        input:focus, select:focus { border-color: var(--accent-blue); }
        input.error, select.error { border-color: var(--error); }
        select option { background: #ffffff; color: var(--text-white); }

        .btn-submit {
            width: 100%;
            padding: 16px;
            margin-top: 6px;
            background: var(--accent-blue);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
        }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        #msg { text-align: center; font-size: 0.85rem; margin-top: 12px; min-height: 20px; font-weight: 600; }
        .msg-success { color: var(--success); }
        .msg-error { color: var(--error); }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--glass-border); white-space: nowrap; }
        th { opacity: 0.6; text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.5px; }
        .empty-row td { opacity: 0.5; text-align: center; padding: 20px; white-space: normal; }

        /* ✅ Table scrollable horizontalement plutôt que débordante hors carte sur petit écran */
        .table-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }

        /* ✅ Responsive : resserre les cartes et le texte sur mobile */
        @media (max-width: 480px) {
            body { padding: 14px; }
            .wrap { max-width: 100%; }
            .glass-card { padding: 22px 16px; border-radius: 18px; }
            h2 { font-size: 1.1rem; margin-bottom: 18px; }
            input, select { padding: 12px 14px; font-size: 0.95rem; }
            .btn-submit { padding: 14px; font-size: 0.9rem; }
        }
        @media (max-width: 360px) {
            .top-nav a { font-size: 0.78rem; }
            th, td { padding: 8px 6px; font-size: 0.78rem; }
        }
    </style>
</head>
<body>

<div class="wrap">
    <div class="top-nav">
        <a href="../home/accueil.html">← Accueil</a>
        <a href="#" id="btn-logout">Déconnexion</a>
    </div>

    <div class="glass-card">
        <h2>➕ Ajouter un membre</h2>

        <div class="field" id="forageSelectorField" style="display:none;">
            <label for="forageSelect">Forage</label>
            <select id="forageSelect"></select>
        </div>

        <div class="field">
            <label for="m_nom">Nom complet</label>
            <input type="text" id="m_nom" placeholder="Ex: Fatou Ndiaye" autocomplete="off" maxlength="100">
        </div>

        <div class="field">
            <label for="m_login">Numéro de téléphone (identifiant)</label>
            <input type="tel" id="m_login" placeholder="Ex: 770000000 (sans indicatif)" inputmode="tel" autocomplete="off" maxlength="15">
        </div>

        <div class="field">
            <label for="m_role">Rôle</label>
            <select id="m_role">
                <option value="secrétaire">Secrétaire</option>
                <option value="trésorier">Trésorier</option>
            </select>
        </div>

        <div class="field">
            <label for="m_pin">PIN (6 chiffres)</label>
            <div class="pin-wrap">
                <input type="password" id="m_pin" placeholder="••••••" maxlength="6" inputmode="numeric" autocomplete="new-password">
                <button type="button" class="pin-toggle" data-target="m_pin" aria-label="Afficher le PIN" title="Afficher le PIN">👁️</button>
            </div>
        </div>

        <div class="field">
            <label for="m_pin2">Confirmer le PIN</label>
            <div class="pin-wrap">
                <input type="password" id="m_pin2" placeholder="••••••" maxlength="6" inputmode="numeric" autocomplete="new-password">
                <button type="button" class="pin-toggle" data-target="m_pin2" aria-label="Afficher le PIN" title="Afficher le PIN">👁️</button>
            </div>
        </div>

        <button class="btn-submit" id="btnCreate">Créer le compte</button>
        <div id="msg" role="alert"></div>
    </div>

    <div class="glass-card">
        <h2>👥 Mon équipe</h2>
        <div class="table-scroll">
        <table>
            <thead>
                <tr><th>Nom</th><th>Téléphone</th><th>Rôle</th></tr>
            </thead>
            <tbody id="teamList">
                <tr class="empty-row"><td colspan="3">Chargement…</td></tr>
            </tbody>
        </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { createAccount } from "../provisioning.js";

    // ✅ Accessible au président (son propre forage) et au super-admin (forage au choix).
    const session = window.checkAccess(['président']);
    if (!session) throw new Error('Accès refusé');

    const firebaseConfig = window.ASUFOR_FIREBASE_CONFIG;
    const app  = initializeApp(firebaseConfig);
    const db   = getDatabase(app);
    const auth = getAuth(app);

    const msgEl      = document.getElementById('msg');
    const btn        = document.getElementById('btnCreate');
    const teamList   = document.getElementById('teamList');
    const forageSel  = document.getElementById('forageSelect');
    const forageField = document.getElementById('forageSelectorField');

    function showMsg(text, isError) {
        msgEl.textContent = text;
        msgEl.className = isError ? 'msg-error' : 'msg-success';
    }
    function clearErrors() {
        document.querySelectorAll('input.error, select.error').forEach(i => i.classList.remove('error'));
    }
    function markError(id) {
        const el = document.getElementById(id);
        if (el) el.classList.add('error');
    }

    function currentForageKey() {
        if (session.isSuperadmin) return forageSel.value || '';
        return session.forageKey || (window.ForageContext ? window.ForageContext.DEFAULT_FORAGE_KEY : 'Asufor_diandioly');
    }

    async function loadTeam() {
        const forageKey = currentForageKey();
        if (!forageKey) {
            teamList.innerHTML = '<tr class="empty-row"><td colspan="3">Sélectionnez un forage.</td></tr>';
            return;
        }
        teamList.innerHTML = '<tr class="empty-row"><td colspan="3">Chargement…</td></tr>';
        try {
            const snap = await get(ref(db, 'Asufor/' + forageKey + '/team'));
            const team = snap.val() || {};
            const uids = Object.keys(team);
            if (uids.length === 0) {
                teamList.innerHTML = '<tr class="empty-row"><td colspan="3">Aucun membre pour l\'instant.</td></tr>';
                return;
            }
            teamList.innerHTML = uids
                .map(uid => team[uid])
                .filter(m => m && m.role !== 'président')
                .sort((a, b) => String(a.nom || '').localeCompare(String(b.nom || '')))
                .map(m => '<tr><td>' + escHtml(m.nom || '—') + '</td><td>' + escHtml(m.login || '—') + '</td><td>' + escHtml(m.role || '—') + '</td></tr>')
                .join('') || '<tr class="empty-row"><td colspan="3">Aucun membre pour l\'instant.</td></tr>';
        } catch (e) {
            console.error('Chargement équipe échoué :', e);
            teamList.innerHTML = '<tr class="empty-row"><td colspan="3">Erreur de chargement.</td></tr>';
        }
    }

    async function initForageSelector() {
        if (!session.isSuperadmin) return;
        forageField.style.display = '';
        try {
            const snap = await get(ref(db, 'Asufor'));
            const forages = snap.val() || {};
            const keys = Object.keys(forages);
            if (keys.length === 0) {
                forageSel.innerHTML = '<option value="">Aucun forage</option>';
                return;
            }
            forageSel.innerHTML = keys
                .map(key => '<option value="' + key + '">' + escHtml((forages[key].config && forages[key].config.nom) || key) + '</option>')
                .join('');
            forageSel.addEventListener('change', loadTeam);
        } catch (e) {
            console.error('Chargement forages échoué :', e);
        }
    }

    btn.addEventListener('click', async () => {
        clearErrors();
        const forageKey = currentForageKey();
        const nom   = document.getElementById('m_nom').value.trim();
        // Identifiant = numéro de téléphone SANS indicatif (même convention que
        // agent_tel ailleurs dans l'app).
        const login = document.getElementById('m_login').value.trim().replace(/[\s\-.]/g, '');
        const role  = document.getElementById('m_role').value;
        const pin   = document.getElementById('m_pin').value;
        const pin2  = document.getElementById('m_pin2').value;

        let valid = true;
        if (!forageKey) { if (session.isSuperadmin) markError('forageSelect'); valid = false; }
        if (!nom)   { markError('m_nom');   valid = false; }
        if (!/^\d{7,15}$/.test(login)) { markError('m_login'); valid = false; }
        if (!/^\d{6}$/.test(pin)) { markError('m_pin'); valid = false; }
        if (pin !== pin2) { markError('m_pin2'); valid = false; }

        if (!valid) { showMsg('Veuillez corriger les champs en rouge (téléphone : 7-15 chiffres sans indicatif).', true); return; }

        btn.disabled = true;
        if (window.AsuforLoader) AsuforLoader.show('Création du compte…');

        try {
            await createAccount({
                firebaseConfig,
                db,
                identifiant: login,
                pin,
                role,
                forageKey,
                nom,
                createdByUid: auth.currentUser ? auth.currentUser.uid : ''
            });

            showMsg('✅ Compte de ' + nom + ' créé.', false);
            ['m_nom', 'm_login', 'm_pin', 'm_pin2'].forEach(id => document.getElementById(id).value = '');
            loadTeam();
        } catch (e) {
            console.error('Création membre échouée :', e);
            let msg = e && e.message ? e.message : 'Erreur inconnue.';
            if (e && e.code === 'auth/email-already-in-use') msg = 'Cet identifiant est déjà utilisé.';
            showMsg('Erreur : ' + msg, true);
        } finally {
            if (window.AsuforLoader) AsuforLoader.hide();
            btn.disabled = false;
        }
    });

    document.getElementById('btn-logout').addEventListener('click', (e) => {
        e.preventDefault();
        if (confirm('Voulez-vous vraiment vous déconnecter ?')) window.logout();
    });

    // ✅ Bascule affichage/masquage du PIN (voir en clair via l'icône œil).
    document.querySelectorAll('.pin-toggle').forEach((btn) => {
        btn.addEventListener('click', () => {
            const input = document.getElementById(btn.dataset.target);
            if (!input) return;
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            btn.textContent = showing ? '👁️' : '🙈';
            btn.setAttribute('aria-label', showing ? 'Afficher le PIN' : 'Masquer le PIN');
            btn.setAttribute('title', showing ? 'Afficher le PIN' : 'Masquer le PIN');
        });
    });

    (async function init() {
        await initForageSelector();
        loadTeam();
    })();
</script>
</body>
</html>
