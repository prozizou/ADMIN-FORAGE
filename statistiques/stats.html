<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <!-- PWA-META -->
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ASUFOR">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUFOR – Statistiques</title>

    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="../assets/theme.css">
    <link rel="stylesheet" href="stats.css">

    <!-- ✅ v4 : Chart.js retiré — le donut et le graphique en barres ont été
         remplacés par des présentations plus simples (carte Bilan, Top 3
         quartiers), plus lisibles pour un public novice. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <!-- ✅ CORRECTION : security.js chargé AVANT le module stats.js -->
    <script src="../security.js"></script>
    <!-- ✅ Overlay de chargement partagé -->
    <script src="../loader.js"></script>
    <!-- ✅ Config Firebase centralisée -->
    <script src="../firebase-config.js"></script>
    <!-- ✅ Moteur de facturation partagé (window.Billing) -->
    <script src="../billing.js"></script>
    <!-- ✅ Multi-forage : résolution des chemins (mode legacy = chemins actuels) -->
    <script src="../admin-config.js"></script>
    <script src="../forage-context.js"></script>
    <!-- ✅ Vue à 360° super-admin : sélecteur de village -->
    <script src="../superadmin-village.js"></script>
    <!-- ✅ Bibliothèque d'icônes SVG unique (remplace emojis + Font Awesome) -->
    <script src="../assets/icons.js"></script>
    <script>
        // ✅ CORRECTION : utiliser window.checkAccess (cohérent avec tous les autres fichiers)
        if (typeof window.checkAccess === 'function') {
            window.checkAccess(['trésorier', 'président', 'secrétaire']);
        }
    </script>

    <script src="../pwa.js" defer></script>
</head>
<body>

<div id="toast">Message</div>

<div class="main-layout">
    <div class="container">
        <a href="../home/accueil.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> Accueil</a>
        <div class="header">
            <div>
                <small style="color: var(--text-sub); font-weight: 600;">Tableau de bord</small>
                <h2 id="forage-title" style="margin:0; font-size: 1.2rem;">ASUFOR</h2>
            </div>
            <div class="header-actions">
                <button class="btn-theme" onclick="toggleTheme()" title="Changer le thème">
                    <span id="theme-icon" class="ic"></span>
                </button>
                <button class="btn-export" onclick="exportPDFImpayes()">
                    <i class="fa-solid fa-file-pdf"></i> PDF Impayés
                </button>
                <button class="btn-export" onclick="exportCSV()">
                    <i class="fa-solid fa-file-excel"></i> CSV
                </button>
            </div>
        </div>

        <div class="select-wrapper">
            <select id="agent-spinner" onchange="applyFilter()"></select>
        </div>

        <div class="filter-row">
            <select id="month-filter" onchange="changeMonth()" title="Sélectionner la période">
                <option value="actuel">Chargement des périodes...</option>
            </select>
        </div>

        <!-- ✅ v2 : bandeau visible uniquement sur une période archivée —
             rappelle que les données sont figées (voir statuts verrouillés
             plus bas dans la liste). -->
        <div id="archive-banner">
            <i class="fa-solid fa-lock"></i>
            <span>Archive — données clôturées, lecture seule.</span>
        </div>

        <!-- ✅ v4 : la carte "Bilan" raconte le mois en une phrase simple
             ("Il reste X F à encaisser") plutôt qu'en pourcentage brut, avec
             une jauge qui va du rouge au vert. Vocabulaire courant plutôt que
             "Encaissé"/"Impayé". -->
        <div class="recap-card">
            <div class="recap-title" id="recap-title">Bilan du mois</div>
            <div class="recap-row">
                <div class="recap-cell">
                    <span class="recap-lbl">Argent reçu</span>
                    <span class="recap-val recap-val-good" id="total-money">0 CFA</span>
                    <div id="trend-money" class="trend-indicator"></div>
                </div>
                <div class="recap-cell">
                    <span class="recap-lbl">Argent à réclamer</span>
                    <span class="recap-val recap-val-bad" id="total-debt">0 CFA</span>
                    <div id="trend-debt" class="trend-indicator"></div>
                </div>
            </div>
            <div class="recap-bar-bg"><div class="recap-bar-fill" id="recap-bar-fill"></div></div>
            <p class="recap-story" id="recap-story">—</p>
            <div class="recap-pct" id="recap-pct">0 % encaissé</div>
        </div>

        <!-- ✅ v4 : remplace le graphique en barres (noms de quartiers
             illisibles) par une liste "Top 3" simple, avec icônes et jauges
             douces — plus rapide à lire pour un novice. -->
        <div class="quartiers-card">
            <div class="card-title-soft"><i class="fa-solid fa-house"></i> Où consomme-t-on le plus ?</div>
            <div id="top-quartiers"><p class="muted-note">Chargement…</p></div>
        </div>

        <!-- ✅ v2 : 4 onglets au lieu de 5 — Relevés/Non relevés deviennent un
             filtre secondaire à côté du tri (voir plus bas), la ligne
             d'onglets ne débordait plus sur mobile.
             ✅ v4 : icônes distinctes + libellé "Problèmes" (moins technique
             qu'"Anomalies"), onglets agrandis et mieux espacés. -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-all"       onclick="setTab('all')"><i class="fa-solid fa-list-ul"></i> Tous</button>
            <button class="tab-btn"        id="tab-paye"      onclick="setTab('paye')"><i class="fa-solid fa-circle-check"></i> Payés</button>
            <button class="tab-btn"        id="tab-impaye"    onclick="setTab('impaye')"><i class="fa-solid fa-circle-exclamation"></i> Impayés</button>
            <button class="tab-btn"        id="tab-anomalies" onclick="setTab('anomalies')"><i class="fa-solid fa-triangle-exclamation"></i> Problèmes</button>
        </div>

        <div id="releves-progress-card" style="display:none;">
            <div class="releves-progress-header">
                <span><i class="fa-solid fa-gauge-high"></i> Compteurs relevés</span>
                <span id="releves-ratio">0 / 0</span>
            </div>
            <div class="releves-progress-bar-bg">
                <div class="releves-progress-bar-fill" id="releves-bar-fill"></div>
            </div>
            <div id="releves-progress-pct" class="releves-progress-pct">0%</div>
        </div>
    </div>

    <div class="list-section" id="scrollable-list">
        <div class="filter-row">
            <div style="position: relative; display: flex; flex: 1;">
                <input
                    type="text"
                    id="search-client"
                    placeholder="Rechercher client ou compteur..."
                    oninput="applyFilter()"
                    style="padding-right: 45px; width: 100%;"
                >
                <button
                    id="btn-mic"
                    onclick="startVoiceSearch()"
                    title="Recherche vocale"
                    style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-sub);transition:0.3s;"
                >
                    <i class="fa-solid fa-microphone"></i>
                </button>
            </div>
        </div>

        <div class="filter-row" style="margin-bottom: 20px;">
            <select id="releve-filter" onchange="setReleveFilter(this.value)" title="Filtrer par statut de relevé">
                <option value="all">Tous les relevés</option>
                <option value="releves">Relevés uniquement</option>
                <option value="non-releves">Non relevés uniquement</option>
            </select>
            <select id="sort-spinner" onchange="applyFilter()">
                <option value="recent">Plus récent</option>
                <option value="max_amount">Plus grand montant</option>
                <option value="min_amount">Plus petit montant</option>
                <option value="zone">Par Zone (A-Z)</option>
                <option value="name">Par Nom (A-Z)</option>
                <option value="compteur">Par N° Compteur</option>
            </select>
        </div>

        <div id="item-count" style="font-size:0.85rem;font-weight:bold;color:var(--text-sub);margin-bottom:10px;text-align:right;">
            0 élément(s)
        </div>

        <div id="skeleton-loader">
            <div class="skeleton-item"><div class="skeleton-text" style="width:50%"></div><div class="skeleton-text" style="width:80%"></div></div>
            <div class="skeleton-item"><div class="skeleton-text" style="width:40%"></div><div class="skeleton-text" style="width:70%"></div></div>
            <div class="skeleton-item"><div class="skeleton-text" style="width:60%"></div><div class="skeleton-text" style="width:90%"></div></div>
        </div>

        <div id="releves-list"></div>

        <button id="btn-load-more" class="load-more" onclick="loadMore()" style="display:none;">
            <span class="ic" data-ic="arrow-down"></span> Charger plus
        </button>
    </div>
</div>

<button id="back-to-top" onclick="scrollToTop()">
    <i class="fa-solid fa-arrow-up"></i>
</button>

<!-- Modal de modification -->
<div id="edit-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <span class="close-btn" onclick="closeEditModal()">&times;</span>
        <h3><i class="fa-solid fa-pen-to-square"></i> Modifier le relevé</h3>
        <div id="edit-form">
            <input type="hidden" id="edit-key">
            <label>Nom du client</label>
            <input type="text" id="edit-name" required>
            <label>Numéro de compteur</label>
            <input type="text" id="edit-compteur">
            <label>Ancien index</label>
            <input type="number" id="edit-last-index" step="any" required>
            <label>Nouvel index</label>
            <input type="number" id="edit-new-index" step="any" required>
            <label>Facteur (prix/m³)</label>
            <input type="number" id="edit-facteur" step="any" required>
            <div class="modal-actions">
                <button type="button" onclick="closeEditModal()">Annuler</button>
                <button type="button" onclick="submitEdit()">Enregistrer</button>
            </div>
        </div>
    </div>
</div>

<script type="module" src="stats.js"></script>
</body>
</html>
