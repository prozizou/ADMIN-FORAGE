<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASUFOR Diandioly - Gestion Pro</title>
    
    <link rel="manifest" href="../manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="stats.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
    
    <script src="../security.js"></script>
    <script>
        if (typeof checkAccess === 'function') {
            checkAccess(['trésorier', 'président', 'secrétaire']);
        }
    </script>
    <script src="../pwa.js" defer></script>
</head>
<body>

<div id="toast">Message</div>

<div class="main-layout">
    <div class="container">
        <div class="header">
            <div>
                <small style="color: var(--text-sub); font-weight: 600;">Tableau de bord</small>
                <h2 style="margin:0; font-size: 1.2rem;">ASUFOR Diandioly</h2>
            </div>
            <div class="header-actions">
                <button class="btn-theme" onclick="toggleTheme()"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
                <button class="btn-export" style="background: var(--danger);" onclick="exportPDFImpayes()"><i class="fa-solid fa-file-pdf"></i> PDF Impayés</button>
                <button class="btn-export" onclick="exportCSV()"><i class="fa-solid fa-file-excel"></i> Exporter</button>
            </div>
        </div>

        <div class="select-wrapper">
            <select id="agent-spinner" onchange="applyFilter()"></select>
        </div>

        <div class="filter-row">
            <select id="month-filter" onchange="changeMonth()" title="Sélectionner la période">
                <option value="actuel">📂 Chargement des périodes...</option>
            </select>
        </div>

        <div class="wallet-card">
            <small>✅ Total Recettes Encaissées</small>
            <h1 id="total-money">0 CFA</h1>
            <div id="trend-money" class="trend-indicator"></div>
        </div>

        <div class="debt-card">
            <small style="font-weight:bold; font-size: 0.75rem; text-transform:uppercase;">🚨 Reste à recouvrer</small>
            <h2 id="total-debt">0 CFA</h2>
            <div id="trend-debt" class="trend-indicator"></div>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <canvas id="pieChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="barChart"></canvas>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tab-all" onclick="setTab('all')">Tous</button>
            <button class="tab-btn" id="tab-paye" onclick="setTab('paye')">Payés</button>
            <button class="tab-btn" id="tab-impaye" onclick="setTab('impaye')">Impayés</button>
        </div>
    </div>

    <div class="list-section" id="scrollable-list">
        <div class="filter-row">
            <div style="position: relative; display: flex; flex: 1;">
                <input type="text" id="search-client" placeholder="🔍 Rechercher client ou compteur..." oninput="applyFilter()" style="padding-right: 45px; width: 100%;">
                <button id="btn-mic" onclick="startVoiceSearch()" title="Recherche vocale" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-sub); transition: 0.3s;">
                    <i class="fa-solid fa-microphone"></i>
                </button>
            </div>
        </div>
        <div class="filter-row" style="margin-bottom: 20px;">
            <select id="sort-spinner" onchange="applyFilter()">
                <option value="recent">⏱️ Plus récent</option>
                <option value="max_amount">💰 Plus grand montant</option>
                <option value="min_amount">🪙 Plus petit montant</option>
                <option value="zone">📍 Par Zone (A-Z)</option>
                <option value="name">🔤 Par Nom (A-Z)</option>
                <option value="compteur">🔢 Par N° Compteur</option>
            </select>
        </div>

        <div id="item-count" style="font-size: 0.85rem; font-weight: bold; color: var(--text-sub); margin-bottom: 10px; text-align: right;">
            0 élément(s)
        </div>

        <div id="skeleton-loader">
            <div class="skeleton-item"><div class="skeleton-text" style="width: 50%;"></div><div class="skeleton-text" style="width: 80%;"></div></div>
            <div class="skeleton-item"><div class="skeleton-text" style="width: 40%;"></div><div class="skeleton-text" style="width: 70%;"></div></div>
            <div class="skeleton-item"><div class="skeleton-text" style="width: 60%;"></div><div class="skeleton-text" style="width: 90%;"></div></div>
        </div>

        <div id="releves-list"></div>
        <button id="btn-load-more" class="load-more" onclick="loadMore()" style="display:none;">⬇️ Charger plus (100)</button>
    </div>
</div>

<button id="back-to-top" onclick="scrollToTop()"><i class="fa-solid fa-arrow-up"></i></button>

<div id="edit-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <span class="close-btn" onclick="closeEditModal()">&times;</span>
        <h3><i class="fa-solid fa-pen-to-square"></i> Modifier le relevé</h3>
        <form id="edit-form">
            <input type="hidden" id="edit-key">
            <label>Nom du client</label>
            <input type="text" id="edit-name" required>
            <label>Numéro de compteur</label>
            <input type="text" id="edit-compteur">
            <label>Ancien index</label>
            <input type="number" id="edit-last-index" step="any" required>
            <label>Nouvel index</label>
            <input type="number" id="edit-new-index" step="any" required>
            <label>Facteur</label>
            <input type="number" id="edit-facteur" step="any" required>
            <div class="modal-actions">
                <button type="button" onclick="closeEditModal()">Annuler</button>
                <button type="submit">Enregistrer</button>
            </div>
        </form>
    </div>
</div>

<script type="module" src="stats.js"></script>
</body>
</html>
